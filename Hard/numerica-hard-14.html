<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 14 - Modo Difícil</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, Helvetica, sans-serif;
background: #0f172a;
color: #f8fafc;
min-height:100vh;
padding:30px 15px;
}

.container{
max-width:950px;
margin:auto;
background: #1e293b;
padding:25px;
border-radius:24px;
box-shadow: 0 0 25px rgba(2, 132, 199, 0.2);
border: 1px solid #0284c7;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:2.3rem;
color: #38bdf8;
margin-bottom:10px;
text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
}

.header p{
color: #94a3b8;
}

.stats-bar{
display:flex;
gap:12px;
justify-content:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.stat-box{
background: #0f172a;
border: 1px solid #38bdf8;
border-radius:14px;
padding:12px 18px;
min-width:150px;
text-align:center;
color: #f8fafc;
box-shadow: 0 0 10px rgba(56, 189, 248, 0.1);
}

.stat-box span {
color: #94a3b8;
}

.question{
display:none;
background: #0f172a;
border: 1px solid #0284c7;
border-radius:20px;
padding:20px;
margin-top:20px;
}

.question.active{
display:block;
}

.question h3 {
color: #f8fafc;
}

.option{
background: #1e293b;
padding:12px;
margin:10px 0;
border-radius:12px;
cursor:pointer;
transition:0.2s;
border: 1px solid #334155;
color: #f8fafc;
}

.option:hover{
background: #334155;
border-color: #38bdf8;
}

.option.selected{
background: #0284c7;
color: white;
border-color: #38bdf8;
box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
}

.option.correct-answer{
background: #065f46;
color: #a7f3d0;
border-color: #10b981;
}

.option.wrong-answer{
background: #991b1b;
color: #fecaca;
border-color: #ef4444;
}

.navigation{
text-align:center;
margin-top:15px;
}

button{
border:none;
padding:10px 15px;
border-radius:10px;
margin:5px;
cursor:pointer;
font-weight:bold;
transition: background 0.2s, box-shadow 0.2s;
}

button:hover{
opacity: 0.9;
}

.next{
background: #0284c7;
color:white;
box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
}

.prev{
background: #334155;
color: #f8fafc;
border: 1px solid #475569;
}

.finish{
background: #0369a1;
color:white;
box-shadow: 0 0 10px rgba(3, 105, 161, 0.4);
}

.actions{
text-align:center;
margin-top:20px;
}

.result{
display:none;
margin-top:20px;
padding:20px;
background: #0f172a;
border-radius:15px;
border: 1px solid #0284c7;
}

.review-item{
background: #1e293b;
padding:14px;
margin:12px 0;
border-left:5px solid gray;
border-radius:12px;
color: #f8fafc;
}

.correcta{
border-left-color: #10b981;
}

.incorrecta{
border-left-color: #ef4444;
}

.sin-responder{
border-left-color: #f59e0b;
}

.explicacion{
margin-top:8px;
font-size:0.92rem;
color: #94a3b8;
}

/* PANEL RANKING */
.ranking-panel{
position:fixed;
left:0;
top:0;
width:320px;
height:100vh;
background: #1e293b;
box-shadow:4px 0 20px rgba(0,0,0,0.5);
padding:20px;
overflow-y:auto;
z-index:999;
transition:transform 0.3s ease;
border-right: 1px solid #0284c7;
}

.ranking-panel.hidden{
transform:translateX(-100%);
}

.toggle-ranking{
position:fixed;
left:15px;
top:15px;
z-index:1000;
background: #0284c7;
color:white;
border:none;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
box-shadow: 0 0 10px rgba(2, 132, 199, 0.5);
}

.ranking-content{
margin-top:60px;
color: #f8fafc;
}

@media(max-width:768px){
.ranking-panel{
width:260px;
}
.container{
padding:18px;
}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧠 Habilidad Numérica 14</h1>
<p>Examen interactivo - Modo Difícil 🔥</p>
</div>

<div class="stats-bar">
<div class="stat-box">
<span>Pregunta</span><br>
<b id="qNum">1</b> / <span class="totalQuestions">10</span>
</div>

<div class="stat-box">
<span>Progreso</span><br>
<b id="progress">0 / <span class="totalQuestions">10</span></b>
</div>
</div>

<div id="quiz"></div>

<div class="actions">
<button class="finish" onclick="finish()">Calificar</button>
<button class="prev" onclick="location.reload()">Reiniciar</button>
</div>

<div class="result" id="resultado">
<h2 style="margin-bottom:20px; color:#38bdf8;">
Resultado Final
</h2>
<p id="score"></p>
<div id="review"></div>
</div>

</div>

<script>
const questions = [
  {
    q: "1. ¿Cuál es el resultado de: 258 + 749 − 312 = ?",
    o: ["695", "689", "703", "715"],
    a: 0,
    exp: "Primero sumamos 258 + 749 = 1007. Luego restamos 312: 1007 − 312 = 695."
  },
  {
    q: "2. Si tienes 48 lápices y los distribuyes entre 6 personas, ¿cuántos recibe cada una?",
    o: ["6", "8", "10", "12"],
    a: 1,
    exp: "Dividimos el total de lápices entre la cantidad de personas: 48 ÷ 6 = 8 lápices por persona."
  },
  {
    q: "3. ¿Cuál es el valor de: 17 × 12 = ?",
    o: ["204", "214", "224", "234"],
    a: 0,
    exp: "Multiplicamos de manera directa: 17 × 10 = 170 y 17 × 2 = 34. Sumamos ambos resultados: 170 + 34 = 204."
  },
  {
    q: "4. Calcula: 180 ÷ 15 = ?",
    o: ["10", "12", "14", "16"],
    a: 1,
    exp: "Dividimos de manera directa: 180 ÷ 15 = 12."
  },
  {
    q: "5. Si la razón entre a y b es 3:4, ¿cuál es el valor de a si b = 20?",
    o: ["12", "15", "18", "25"],
    a: 1,
    exp: "La relación es a/b = 3/4. Si b = 20, planteamos la ecuación: a/20 = 3/4. Despejamos a: a = (3 × 20) / 4 = 60 / 4 = 15."
  },
  {
    q: "6. Un mapa tiene una escala de 1:5000. Si dos puntos están a 4 cm en el mapa, ¿cuál es la distancia real?",
    o: ["200 m", "20 km", "2 km", "0.2 km"],
    a: 0,
    exp: "Multiplicamos la distancia del mapa por la escala: 4 cm × 5,000 = 20,000 cm. Convertimos a metros dividiendo entre 100: 20,000 cm / 100 = 200 m."
  },
  {
    q: "7. En un salón hay 24 hombres y 16 mujeres. ¿Cuál es la razón entre hombres y mujeres?",
    o: ["2:3", "3:2", "4:3", "3:4"],
    a: 1,
    exp: "La razón se plantea como hombres/mujeres: 24/16. Simplificamos dividiendo ambos números entre 8: 24÷8 = 3 y 16÷8 = 2. La razón simplificada es 3:2."
  },
  {
    q: "8. Un producto costaba Q400 y se le aplicó un descuento del 25%. ¿Cuál es su precio con el descuento?",
    o: ["Q100", "Q275", "Q300", "Q325"],
    a: 2,
    exp: "El 25% de descuento sobre Q400 equivale a una cuarta parte: 400 × 0.25 = Q100. Restamos el descuento al precio original: Q400 − Q100 = Q300."
  },
  {
    q: "9. ¿Cuál es el número que sigue en esta serie? 3, 6, 12, 24, 48, ?",
    o: ["60", "72", "96", "108"],
    a: 2,
    exp: "La serie multiplica el término anterior por 2 en cada paso: 3×2=6, 6×2=12, 12×2=24, 24×2=48. Por lo tanto, el siguiente número es 48 × 2 = 96."
  },
  {
    q: "10. ¿Qué número falta en la serie? 81, 27, 9, ___, 1",
    o: ["5", "4", "3", "6"],
    a: 2,
    exp: "La serie se divide entre 3 en cada paso: 81 ÷ 3 = 27, 27 ÷ 3 = 9. El valor faltante es 9 ÷ 3 = 3 (y comprobamos que 3 ÷ 3 = 1)."
  }
];

document.querySelectorAll('.totalQuestions').forEach(el => {
    el.textContent = questions.length;
});

let current = 0;
let answers = new Array(questions.length).fill(null);
let done = false;

function render(){
    const quiz = document.getElementById("quiz");
    quiz.innerHTML = "";

    questions.forEach((q, i) => {
        const div = document.createElement("div");
        div.className = "question" + (i === current ? " active" : "");

        let opts = "";
        q.o.forEach((op, j) => {
            let cls = "";
            if (answers[i] === j) {
                cls += " selected";
            }
            if (done) {
                if (j === q.a) {
                    cls += " correct-answer";
                }
                if (answers[i] === j && j !== q.a) {
                    cls += " wrong-answer";
                }
            }

            opts += `
                <div class="option${cls}" onclick="select(${i},${j})">
                    ${op}
                </div>
            `;
        });

        div.innerHTML = `
            <h3>${q.q}</h3>
            ${opts}
            <div class="navigation">
                <button class="prev" onclick="prev()" ${i === 0 ? "disabled" : ""}>
                    Anterior
                </button>
                ${i === questions.length - 1
                    ? `<button class="finish" onclick="finish()">Finalizar</button>`
                    : `<button class="next" onclick="next()">Siguiente</button>`
                }
            </div>
        `;
        quiz.appendChild(div);
    });

    update();
}

function select(i, j){
    if (done) return;
    answers[i] = j;
    render();
}

function next(){
    if (answers[current] === null) {
        alert("Responde primero");
        return;
    }
    current++;
    render();
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function prev(){
    current--;
    render();
}

function update(){
    document.getElementById("qNum").textContent = current + 1;
    document.getElementById("progress").textContent =
        answers.filter(a => a !== null).length + " / " + questions.length;
}

function finish(){
    done = true;

    let correct = 0;
    let html = "";

    questions.forEach((q, i) => {
        if (answers[i] === q.a) {
            correct++;
        }
    });

    let porcentaje = Math.round((correct / questions.length) * 100);

    // MODO DÍFICIL: Generación de notas de Bots ajustadas de 60% a 100%
    const bots = [];
    for (let i = 1; i <= 30; i++) {
        bots.push({
            nombre: `Bot_${i}`,
            nota: 60 + Math.floor(Math.random() * 41)
        });
    }

    const ranking = [
        ...bots,
        {
            nombre: "Tú",
            nota: porcentaje,
            usuario: true
        }
    ];

    ranking.sort((a, b) => b.nota - a.nota);

    let debajo = ranking.filter(p => porcentaje > p.nota).length;
    let iguales = ranking.filter(p => porcentaje === p.nota).length;

    let percentil = Math.round(
        ((debajo + (0.5 * iguales)) / ranking.length) * 100
    );

    if (percentil < 1) percentil = 1;
    if (percentil > 99) percentil = 99;

    let nivel = "Muy bajo";
    if (percentil >= 90) {
        nivel = "Excelente";
    } else if (percentil >= 75) {
        nivel = "Muy bueno";
    } else if (percentil >= 60) {
        nivel = "Bueno";
    } else if (percentil >= 40) {
        nivel = "Promedio";
    } else if (percentil >= 20) {
        nivel = "Bajo";
    }

    questions.forEach((q, i) => {
        let estado = "";
        if (answers[i] === null) {
            estado = "sin-responder";
        } else if (answers[i] === q.a) {
            estado = "correcta";
        } else {
            estado = "incorrecta";
        }

        html += `
            <div class="review-item ${estado}">
                <h3>Pregunta ${i + 1}</h3>
                <p style="margin-top:8px;">${q.q}</p>
                <br>
                <p><b>Tu respuesta:</b> ${answers[i] !== null ? q.o[answers[i]] : "Sin responder"}</p>
                <p style="margin-top:6px;"><b>Correcta:</b> ${q.o[q.a]}</p>
                <div class="explicacion">${q.exp}</div>
            </div>
        `;
    });

    let rankingHTML = "";
    ranking.forEach((p, i) => {
        rankingHTML += `
            <div style="display:flex; justify-content:space-between; padding:10px; margin:6px 0; background:${p.usuario ? "#0284c7" : "#0f172a"}; border-radius:10px; border:1px solid #334155; color:${p.usuario ? "white" : "#f8fafc"}">
                <span>#${i + 1} - ${p.nombre}</span>
                <span>${p.nota}%</span>
            </div>
        `;
    });

    document.getElementById("score").innerHTML = `
        <button class="toggle-ranking" onclick="toggleRanking()">
            ☰ Ranking
        </button>
        <div id="rankingPanel" class="ranking-panel hidden">
            <div class="ranking-content">
                <h3 style="margin-bottom:15px; color:#38bdf8;">🏆 Ranking General</h3>
                ${rankingHTML}
            </div>
        </div>
        <div style="background:#1e293b; padding:20px; border-radius:15px; margin-bottom:20px; border:1px solid #0284c7;">
            <h2 style="color:#f8fafc;">${correct}/${questions.length}</h2>
            <p style="font-size:26px; font-weight:bold; margin-top:10px; color:#38bdf8;">${porcentaje}%</p>
            <div style="display:flex; flex-direction:column; gap:12px; margin-top:20px; max-width:250px;">
                <div class="stat-box">
                    <span>Percentil</span><br>
                    <b>${percentil}%</b>
                </div>
                <div class="stat-box">
                    <span>Nivel</span><br>
                    <b>${nivel}</b>
                </div>
            </div>
        </div>
    `;

    document.getElementById("review").innerHTML = html;
    document.getElementById("resultado").style.display = "block";
    document.getElementById("resultado").scrollIntoView({
        behavior: "smooth"
    });

    render();
}

function toggleRanking(){
    document.getElementById("rankingPanel").classList.toggle("hidden");
}

render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 7-(Nivel 3)</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg, #0b1329, #111c38, #070d1d);
color:#e2e8f0;
min-height:100vh;
padding:30px 15px;
}

.container{
max-width:950px;
margin:auto;
background:rgba(15, 23, 42, 0.95);
padding:25px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,0.6);
border: 1px solid #1e293b;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:2.3rem;
color:#818cf8;
margin-bottom:10px;
text-shadow: 0 0 12px rgba(129, 140, 248, 0.3);
}

.header p{
color:#94a3b8;
}

.stats-bar{
display:flex;
gap:12px;
justify-content:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.stat-box{
background:#1e293b;
border:1px solid #334155;
border-radius:14px;
padding:12px 18px;
min-width:150px;
text-align:center;
color:#e2e8f0;
box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.stat-box span{
color:#94a3b8;
}

.question{
display:none;
background:#1e293b;
border:1px solid #6366f1;
border-radius:20px;
padding:20px;
box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
}

.question.active{
display:block;
}

.question h3 {
color: #f8fafc;
margin-bottom: 15px;
}

.option{
background:#0f172a;
color:#cbd5e1;
padding:12px;
margin:10px 0;
border-radius:12px;
border: 1px solid #334155;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#1e293b;
border-color:#818cf8;
color:#ffffff;
}

.option.selected{
background:#4f46e5;
color:white;
border-color:#818cf8;
box-shadow: 0 0 10px rgba(129, 140, 248, 0.4);
}

.option.correct-answer{
background:#065f46;
color:#a7f3d0;
border-color:#10b981;
}

.option.wrong-answer{
background:#881337;
color:#fecdd3;
border-color:#f43f5e;
}

.navigation{
text-align:center;
margin-top:15px;
}

button{
border:none;
padding:10px 15px;
border-radius:10px;
margin:5px;
cursor:pointer;
font-weight:bold;
transition: 0.2s;
}

.next{
background:#4338ca;
color:white;
}

.next:hover{
background:#3730a3;
}

.prev{
background:#334155;
color:#94a3b8;
}

.prev:hover{
background:#475569;
color:white;
}

.finish{
background:#4f46e5;
color:white;
}

.finish:hover{
background:#4338ca;
}

.actions{
text-align:center;
margin-top:20px;
}

.actions button{
background:#1e293b;
color:#e2e8f0;
border:1px solid #334155;
}

.actions button:hover{
background:#334155;
}

.result{
display:none;
margin-top:20px;
padding:20px;
background:#1e293b;
border-radius:15px;
border:1px solid #334155;
}

.review-item{
background:#0f172a;
padding:14px;
margin:12px 0;
border-left:5px solid gray;
border-radius:12px;
color:#e2e8f0;
}

.correcta{
border-left-color:#10b981;
}

.incorrecta{
border-left-color:#f43f5e;
}

.sin-responder{
border-left-color:#f59e0b;
}

.explicacion{
margin-top:8px;
font-size:0.92rem;
color:#94a3b8;
}

/* PANEL RANKING */

.ranking-panel{
position:fixed;
left:0;
top:0;
width:320px;
height:100vh;
background:#0f172a;
border-right: 1px solid #334155;
box-shadow:4px 0 20px rgba(0,0,0,0.5);
padding:20px;
overflow-y:auto;
z-index:999;
transition:transform 0.3s ease;
color: #e2e8f0;
}

.ranking-panel.hidden{
transform:translateX(-100%);
}

.toggle-ranking{
position:fixed;
left:15px;
top:15px;
z-index:1000;
background:#4338ca;
color:white;
border:none;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.ranking-content{
margin-top:60px;
}

@media(max-width:768px){

.ranking-panel{
width:260px;
}

.container{
padding:18px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧠 Simulacro Final – Habilidad Numérica (Nivel 3)</h1>
<p>Nivel examen real avanzado</p>
</div>

<div class="stats-bar">

<div class="stat-box">
<span>Pregunta</span><br>
<b id="qNum">1</b> / 25
</div>

<div class="stat-box">
<span>Progreso</span><br>
<b id="progress">0 / 25</b>
</div>

</div>

<div id="quiz"></div>

<div class="actions">
<button class="finish" onclick="finish()">Calificar</button>
<button class="prev" onclick="resetExam()">Reiniciar</button>
</div>

<div class="result" id="resultado">

<h2 style="margin-bottom:20px; color:#818cf8;">
Resultado Final
</h2>

<p id="score"></p>

<div id="review"></div>

</div>

</div>

<script>

const questions = [

{q:"Serie: 4, 9, 19, 39, 79, ?",o:["119","139","159","199","Ninguna"],a:2,exp:"Se multiplica por 2 y se suma 1: 79×2+1=159"},
{q:"Serie: 1, 3, 6, 10, 15, ?",o:["18","20","21","24","Ninguna"],a:2,exp:"Se suma 2,3,4,5,6 → 15+6=21"},
{q:"Serie: 2, 6, 7, 21, 22, ?",o:["44","66","67","88","Ninguna"],a:1,exp:"Se alterna ×3 y +1 → 22×3=66"},
{q:"Serie: 5, 10, 20, 40, 80, ?",o:["120","140","160","180","Ninguna"],a:2,exp:"Se multiplica por 2 → 80×2=160"},
{q:"Serie: 3, 6, 18, 72, ?",o:["144","216","288","360","Ninguna"],a:2,exp:"Se multiplica por 2,3,4 → 72×4=288"},
{q:"Si 4x - 8 = 24, ¿x?",o:["6","7","8","9","Ninguna"],a:2,exp:"4x=32 → x=8"},
{q:"Si 3x + 6 = 21, ¿x?",o:["3","4","5","6","Ninguna"],a:2,exp:"3x=15 → x=5"},
{q:"Si x/4 = 7, ¿x?",o:["21","24","28","32","Ninguna"],a:2,exp:"x=28"},
{q:"Si 2x + 5 = 19, ¿x?",o:["5","6","7","8","Ninguna"],a:2,exp:"2x=14 → x=7"},
{q:"(3/5)+(7/10)",o:["1","11/10","12/10","13/10","Ninguna"],a:3,exp:"6/10+7/10=13/10"},
{q:"(4/3)×(9/8)",o:["3/2","1/2","2","4","Ninguna"],a:0,exp:"36/24=3/2"},
{q:"(10/3)÷(5/6)",o:["2","3","4","5","Ninguna"],a:2,exp:"(10/3)×(6/5)=60/15=4"},
{q:"25% de 360",o:["80","85","90","95","Ninguna"],a:2,exp:"0.25×360=90"},
{q:"40% de 250",o:["80","90","100","110","Ninguna"],a:2,exp:"0.4×250=100"},
{q:"Si 12 es el 20% de un número, ¿cuál es?",o:["50","60","70","80","Ninguna"],a:1,exp:"12÷0.2=60"},
{q:"(8×5)+(12÷3)",o:["40","42","44","46","Ninguna"],a:2,exp:"40+4=44"},
{q:"(15×2)+(18÷6)",o:["30","32","33","36","Ninguna"],a:2,exp:"30+3=33"},
{q:"Serie: 1, 4, 9, 16, 25, ?",o:["30","32","36","40","Ninguna"],a:2,exp:"Son cuadrados: 6²=36"},
{q:"Serie: 2, 5, 10, 17, 26, ?",o:["35","36","37","38","Ninguna"],a:2,exp:"Se suma 3,5,7,9,11 → 26+11=37"},
{q:"Serie: 1, 2, 4, 8, 16, ?",o:["24","30","32","36","Ninguna"],a:2,exp:"Se multiplica por 2 → 32"},
{q:"Promedio de 20, 30, 40, 50",o:["30","35","40","45","Ninguna"],a:1,exp:"(20+30+40+50)/4=35"},
{q:"Perímetro de un cuadrado lado 7",o:["21","24","28","30","Ninguna"],a:2,exp:"7×4=28"},
{q:"Área de un rectángulo 8×5",o:["30","35","40","45","Ninguna"],a:2,exp:"8×5=40"},
{q:"Si 5x = 45, ¿x?",o:["7","8","9","10","Ninguna"],a:2,exp:"x=9"},
{q:"Si x² = 81, ¿x?",o:["7","8","9","10","Ninguna"],a:2,exp:"x=9"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

const div=document.createElement("div");

div.className="question"+(i===current?" active":"");

let opts="";

q.o.forEach((op,j)=>{

let cls="";

if(answers[i]===j){

cls+=" selected";

}

if(done){

if(j===q.a){

cls+=" correct-answer";

}

if(answers[i]===j && j!==q.a){

cls+=" wrong-answer";

}

}

opts+=`

<div class="option${cls}" onclick="select(${i},${j})">
${op}
</div>

`;

});

div.innerHTML=`

<h3>${q.q}</h3>

${opts}

<div class="navigation">

<button class="prev"
onclick="prev()"
${i===0?"disabled":""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish" onclick="finish()">Finalizar</button>`

: `<button class="next" onclick="next()">Siguiente</button>`

}

</div>

`;

quiz.appendChild(div);

});

update();

}

function select(i,j){

if(done)return;

answers[i]=j;

render();

}

function next(){

if(answers[current]===null){

alert("Responde primero");

return;

}

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function prev(){

current--;

render();

}

function update(){

document.getElementById("qNum").textContent=current+1;

document.getElementById("progress").textContent=
answers.filter(a=>a!==null).length+" / "+questions.length;

}

function finish(){

if(done) return;
done=true;

let correct=0;
let incorrectas=0;
let sinResponder=0;

questions.forEach((q,i)=>{
if(answers[i]===q.a) correct++;
else if(answers[i]===null) sinResponder++;
else incorrectas++;
});

let porcentaje=Math.round(
(correct/questions.length)*100
);

// GENERACIÓN DE BOTS NIVEL 3 (Notas de bots entre 75% y 100%)
const bots = [];
for(let i=1; i<=30; i++){
    const notaBot = Math.floor(Math.random() * 26) + 75; // Genera 75 - 100
    bots.push({
        nombre: `Bot_${i}`,
        nota: notaBot
    });
}

const ranking = [
    ...bots,
    { nombre: "Tú", nota: porcentaje, usuario: true }
];

ranking.sort((a,b) => b.nota - a.nota);

let debajo = ranking.filter(p => porcentaje > p.nota).length;
let iguales = ranking.filter(p => porcentaje === p.nota).length;
let percentil = Math.round((debajo + (0.5 * iguales)) / ranking.length * 100);

if(percentil < 1) percentil = 1;
if(percentil > 99) percentil = 99;

let nivel = "Muy bajo";
if(percentil >= 90) nivel = "Excelente";
else if(percentil >= 75) nivel = "Muy bueno";
else if(percentil >= 60) nivel = "Bueno";
else if(percentil >= 40) nivel = "Promedio";
else if(percentil >= 20) nivel = "Bajo";

let html="";
questions.forEach((q,i)=>{

let estado="";

if(answers[i]===null){
estado="sin-responder";
}
else if(answers[i]===q.a){
estado="correcta";
}
else{
estado="incorrecta";
}

html+=`

<div class="review-item ${estado}">

<h3>
Pregunta ${i+1}
</h3>

<p style="margin-top:8px;">
${q.q}
</p>

<br>

<p>
<b>Tu respuesta:</b>

${
answers[i]!==null
?
q.o[answers[i]]
:
"Sin responder"
}
</p>

<p style="margin-top:6px;">
<b>Correcta:</b>
${q.o[q.a]}
</p>

<div class="explicacion">
${q.exp}
</div>

</div>

`;

});

document.getElementById("score").innerHTML=`
<button class="toggle-ranking" onclick="toggleRanking()">🏆 Ver Ranking</button>

<div id="rankingPanel" class="ranking-panel hidden">
<div class="ranking-content">
<span class="badge-nivel">Nivel 3 (Dificultad Alta)</span>
<h3 style="margin-bottom:15px; color:#38bdf8;">🏆 Ranking General</h3>
${ranking.map((p,i)=>`
<div style="display:flex; justify-content:space-between; padding:10px; margin:6px 0; background:${p.usuario ? "#1e293b" : "#0f172a"}; border: 1px solid ${p.usuario ? "#38bdf8" : "#334155"}; border-radius:10px;">
<span>#${i+1} - ${p.nombre}</span>
<span>${p.nota}%</span>
</div>
`).join("")}
</div>
</div>

<div style="background:#0f172a; padding:20px; border-radius:15px; margin-bottom:20px; border: 1px solid #334155;">
<h2>${correct}/${questions.length}</h2>
<p style="font-size:26px; font-weight:bold; margin-top:10px; color:#38bdf8;">${porcentaje}%</p>
<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:15px;">
<div class="stat-box"><span>Correctas</span><br><b>${correct}</b></div>
<div class="stat-box"><span>Incorrectas</span><br><b>${incorrectas}</b></div>
<div class="stat-box"><span>Sin responder</span><br><b>${sinResponder}</b></div>
<div class="stat-box"><span>Percentil</span><br><b>${percentil}%</b></div>
<div class="stat-box"><span>Nivel</span><br><b>${nivel}</b></div>
</div>
</div>
`;

document.getElementById("review")
.innerHTML=html;

document.getElementById("resultado")
.style.display="block";

document.getElementById("resultado")
.scrollIntoView({
behavior:"smooth"
});

render();

}

function toggleRanking(){
const panel = document.getElementById("rankingPanel");
if(panel){
panel.classList.toggle("hidden");
}
}

window.select = select;
window.next = next;
window.prev = prev;
window.finish = finish;
window.toggleRanking = toggleRanking;

render();

</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

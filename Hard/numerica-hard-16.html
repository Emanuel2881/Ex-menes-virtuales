body{

.container{

}

.header p{

.stats-bar{

.question.active{

}

.question h3 {
color: #f8fafc;
}

.option{
background: #1e293b;
padding:12px;
margin:10px 0;
border-radius:12px;
cursor:pointer;
transition:0.2s;
border: 1px solid #334155;
color: #f8fafc;
}

.option:hover{

.option.selected{
background: #0284c7;

.option.correct-answer{
background: #065f46;

}

.option.wrong-answer{
background: #991b1b;
color: #fecaca;
border-color: #ef4444;
}

.navigation{
text-align:center;
margin-top:15px;
}

button{
border:none;
padding:10px 15px;
border-radius:10px;
margin:5px;

font-weight:bold;

button:hover{

.next{
background: #0284c7;
color:white;

.prev{
background: #334155;
color: #f8fafc;

.finish{
background: #0369a1;

.actions{
text-align:center;
margin-top:20px;
}

.result{
display:none;
margin-top:20px;
padding:20px;
background: #0f172a;
border-radius:15px;
border: 1px solid #0284c7;
}

.review-item{
background: #1e293b;
padding:14px;
margin:12px 0;
border-left:5px solid gray;
border-radius:12px;
color: #f8fafc;
}

.correcta{
border-left-color: #10b981;
}

.incorrecta{
border-left-color: #ef4444;
}

.sin-responder{
border-left-color: #f59e0b;

.explicacion{
margin-top:8px;
font-size:0.92rem;
color: #94a3b8;

/* Estilos para tablas dentro de las preguntas */
table {
color: #f8fafc;
border-color: #334155 !important;

table th {
background: #0f172a !important;
color: #38bdf8;

table td {
background: #1e293b !important;

.ranking-panel{
position:fixed;
left:0;
top:0;

height:100vh;
background: #1e293b;

padding:20px;
overflow-y:auto;
z-index:999;
transition:transform 0.3s ease;

.ranking-panel.hidden{

.toggle-ranking{
position:fixed;
left:15px;
top:15px;
z-index:1000;
background: #0284c7;
color:white;
border:none;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
box-shadow: 0 0 10px rgba(2, 132, 199, 0.5);
}

.ranking-content{
margin-top:60px;
color: #f8fafc;
}

@media(max-width:768px){
.ranking-panel{
width:260px;

.container{
padding:18px;

    o: ["25", "35", "40", "45", "50"],
    a: 2,
    exp: "Fila Junio: 15 + 10 + Jun_Sil = 55 ⇒ Jun_Sil = 30. Gran Total: 45 + 55 + Jul_Tot + 25 = 155 ⇒ Jul_Tot = 30. Fila Julio: Jul_Arm + 5 + 20 = 30 ⇒ Jul_Arm = 5. Fila Mayo: May_Arm + 15 + 20 = 45 ⇒ May_Arm = 10. Columna Armarios (?): 10 + 15 + 5 + 10 = 40."
  },
  {
    q: `<div><b>Ejercicio 32</b><br><br><table border="1" style="width:100%;border-collapse:collapse;text-align:center;"><tr><th>Artículo</th><th>Unidades</th><th>Puntos/unidad</th><th>Total puntos</th></tr><tr><td>Grapa</td><td>2,500</td><td>0.05</td><td>125</td></tr><tr><td>Chincheta</td><td>3,000</td><td>?</td><td>X</td></tr><tr><td>Tornillo</td><td>1,200</td><td>0.1</td><td>120</td></tr><tr><td colspan="3"><b>Total</b></td><td>845</td></tr></table></div>`,
    o: ["0.03", "0.1", "0.2", "0.5", "5"],
    a: 2,
    exp: "Total Chincheta = 845 - 125 - 120 = 600. Puntos/Unidad de Chincheta (?) = 600 / 3000 = 0.2."
  }
];

// Actualizar totales de preguntas dinámicamente
document.querySelectorAll('.totalQuestions').forEach(el => {
    el.textContent = questions.length;
});


let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

const div=document.createElement("div");

div.className="question"+(i===current?" active":"");

let opts="";

q.o.forEach((op,j)=>{

let cls="";

if(answers[i]===j){

cls+=" selected";

}

if(done){

if(j===q.a){

cls+=" correct-answer";

}

if(answers[i]===j && j!==q.a){

cls+=" wrong-answer";

}

}

opts+=`

<div class="option${cls}" onclick="select(${i},${j})">
${op}
</div>

`;

});

div.innerHTML=`

<h3>${q.q}</h3>

${opts}

<div class="navigation">

<button class="prev"
onclick="prev()"
${i===0?"disabled":""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish" onclick="finish()">Finalizar</button>`

: `<button class="next" onclick="next()">Siguiente</button>`

}

</div>

`;

quiz.appendChild(div);

});

update();

}

function select(i,j){

if(done)return;

answers[i]=j;

render();

}

function next(){

if(answers[current]===null){

alert("Responde primero");

return;

}

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function prev(){

current--;

render();

}

function update(){

document.getElementById("qNum").textContent=current+1;

document.getElementById("progress").textContent=
answers.filter(a=>a!==null).length+" / "+questions.length;

}

function finish(){

if(done) return;
done=true;

let correct=0;
let incorrectas=0;
let sinResponder=0;

questions.forEach((q,i)=>{
if(answers[i]===q.a) correct++;
else if(answers[i]===null) sinResponder++;
else incorrectas++;
});

let porcentaje=Math.round(
(correct/questions.length)*100
);

// GENERACIÓN DE BOTS NIVEL 3 (Notas de bots entre 75% y 100%)
const bots = [];
for(let i=1; i<=30; i++){
    const notaBot = Math.floor(Math.random() * 26) + 75; // Genera 75 - 100
    bots.push({
        nombre: `Bot_${i}`,
        nota: notaBot
    });
}

const ranking = [
    ...bots,
    { nombre: "Tú", nota: porcentaje, usuario: true }
];

ranking.sort((a,b) => b.nota - a.nota);

let debajo = ranking.filter(p => porcentaje > p.nota).length;
let iguales = ranking.filter(p => porcentaje === p.nota).length;
let percentil = Math.round((debajo + (0.5 * iguales)) / ranking.length * 100);

if(percentil < 1) percentil = 1;
if(percentil > 99) percentil = 99;

let nivel = "Muy bajo";
if(percentil >= 90) nivel = "Excelente";
else if(percentil >= 75) nivel = "Muy bueno";
else if(percentil >= 60) nivel = "Bueno";
else if(percentil >= 40) nivel = "Promedio";
else if(percentil >= 20) nivel = "Bajo";

let html="";
questions.forEach((q,i)=>{

let estado="";

if(answers[i]===null){
estado="sin-responder";
}
else if(answers[i]===q.a){
estado="correcta";
}
else{
estado="incorrecta";
}

html+=`

<div class="review-item ${estado}">

<h3>
Pregunta ${i+1}
</h3>

<p style="margin-top:8px;">
${q.q}
</p>

<br>

<p>
<b>Tu respuesta:</b>

${
answers[i]!==null
?
q.o[answers[i]]
:
"Sin responder"
}
</p>

<p style="margin-top:6px;">
<b>Correcta:</b>
${q.o[q.a]}
</p>

<div class="explicacion">
${q.exp}
</div>

</div>

`;

});

document.getElementById("score").innerHTML=`
<button class="toggle-ranking" onclick="toggleRanking()">🏆 Ver Ranking</button>

<div id="rankingPanel" class="ranking-panel hidden">
<div class="ranking-content">
<span class="badge-nivel">Nivel 3 (Dificultad Alta)</span>
<h3 style="margin-bottom:15px; color:#38bdf8;">🏆 Ranking General</h3>
${ranking.map((p,i)=>`
<div style="display:flex; justify-content:space-between; padding:10px; margin:6px 0; background:${p.usuario ? "#1e293b" : "#0f172a"}; border: 1px solid ${p.usuario ? "#38bdf8" : "#334155"}; border-radius:10px;">
<span>#${i+1} - ${p.nombre}</span>
<span>${p.nota}%</span>
</div>
`).join("")}
</div>
</div>

<div style="background:#0f172a; padding:20px; border-radius:15px; margin-bottom:20px; border: 1px solid #334155;">
<h2>${correct}/${questions.length}</h2>
<p style="font-size:26px; font-weight:bold; margin-top:10px; color:#38bdf8;">${porcentaje}%</p>
<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:15px;">
<div class="stat-box"><span>Correctas</span><br><b>${correct}</b></div>
<div class="stat-box"><span>Incorrectas</span><br><b>${incorrectas}</b></div>
<div class="stat-box"><span>Sin responder</span><br><b>${sinResponder}</b></div>
<div class="stat-box"><span>Percentil</span><br><b>${percentil}%</b></div>
<div class="stat-box"><span>Nivel</span><br><b>${nivel}</b></div>
</div>
</div>
`;

document.getElementById("review")
.innerHTML=html;

document.getElementById("resultado")
.style.display="block";

document.getElementById("resultado")
.scrollIntoView({
behavior:"smooth"
});

render();

}

function toggleRanking(){
const panel = document.getElementById("rankingPanel");
if(panel){
panel.classList.toggle("hidden");
}
}

window.select = select;
window.next = next;
window.prev = prev;
window.finish = finish;
window.toggleRanking = toggleRanking;

render();

</script>

</body>
</html>

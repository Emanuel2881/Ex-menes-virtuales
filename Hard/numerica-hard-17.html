let current = 0;
let answers = new Array(questions.length).fill(null);
let done = false;

function render(){
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";

  document.getElementById("totalQ").textContent = questions.length;

  questions.forEach((q, i) => {
    const div = document.createElement("div");
    div.className = "question" + (i === current ? " active" : "");

    let opts = "";
    q.o.forEach((op, j) => {
      let cls = "";
      if(answers[i] === j){
        cls += " selected";
      }
      if(done){
        if(j === q.a){
          cls += " correct-answer";
        }
        if(answers[i] === j && j !== q.a){
          cls += " wrong-answer";
        }
      }
      opts += `<div class="option${cls}" onclick="select(${i},${j})">${op}</div>`;
    });

    div.innerHTML = `
      <h3>${i+1}. ${q.q}</h3>
      ${opts}
      <div class="navigation">
        <button class="prev" onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
        ${i === questions.length-1 
          ? `<button class="finish" onclick="finish()">Finalizar</button>`
          : `<button class="next" onclick="next()">Siguiente</button>`
        }
      </div>
    `;

    quiz.appendChild(div);
  });

  update();
}

function select(i, j){
  if(done) return;
  answers[i] = j;
  render();
}

function next(){
  if(current < questions.length - 1){
    current++;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function prev(){
  if(current > 0){
    current--;
    render();
  }
}

function update(){
  document.getElementById("qNum").textContent = current + 1;
  document.getElementById("progress").textContent = answers.filter(a => a !== null).length + " / " + questions.length;
}

function finish(){
  done = true;
  let correct = 0;
  let html = "";

  questions.forEach((q, i) => {
    if(answers[i] === q.a){
      correct++;
    }
  });

  let porcentaje = Math.round((correct / questions.length) * 100);

  // GENERACIÓN DE BOTS NIVEL 3 (Notas de bots entre 75% y 100%)
  const bots = [];
  for(let i=1; i<=30; i++){
    const notaBot = Math.floor(Math.random() * 26) + 75; // Genera 75 - 100
    bots.push({
      nombre: `Bot_${i}`,
      nota: notaBot
    });
  }

  const ranking = [...bots, { nombre: "Tú", nota: porcentaje, usuario: true }];
  ranking.sort((a, b) => b.nota - a.nota);

  let percentil;
  if (porcentaje >= 60) {
    percentil = Math.round(60 + ((porcentaje - 60) / 40) * 39);
  } else {
    percentil = Math.round((porcentaje / 60) * 59);
  }

  if(percentil < 1) percentil = 1;
  if(percentil > 99) percentil = 99;

  let nivel = "Muy bajo";
  if(percentil >= 90) nivel = "Excelente";
  else if(percentil >= 75) nivel = "Muy bueno";
  else if(percentil >= 60) nivel = "Bueno";
  else if(percentil >= 40) nivel = "Promedio";
  else if(percentil >= 20) nivel = "Bajo";

  questions.forEach((q, i) => {
    let estado = "";
    if(answers[i] === null) estado = "sin-responder";
    else if(answers[i] === q.a) estado = "correcta";
    else estado = "incorrecta";

    html += `
      <div class="review-item ${estado}">
        <h3>Pregunta ${i+1}</h3>
        <p style="margin-top:8px;">${q.q}</p>
        <br>
        <p><b>Tu respuesta:</b> ${answers[i] !== null ? q.o[answers[i]] : "Sin responder"}</p>
        <p style="margin-top:6px;"><b>Correcta:</b> ${q.o[q.a]}</p>
        <div class="explicacion"><b>Explicación:</b> ${q.exp}</div>
      </div>
    `;
  });

  let rankingHTML = "";
  ranking.forEach((p, i) => {
    rankingHTML += `
      <div style="display:flex; justify-content:space-between; padding:10px; margin:6px 0; background:${p.usuario ? "#0284c7" : "#334155"}; color:${p.usuario ? "#ffffff" : "#e2e8f0"}; border-radius:10px; font-weight:${p.usuario ? "bold" : "normal"};">
        <span>#${i+1} - ${p.nombre}</span>
        <span>${p.nota}%</span>
      </div>
    `;
  });

  document.getElementById("score").innerHTML = `
    <button class="toggle-ranking" onclick="toggleRanking()">☰ Ranking</button>
    <div id="rankingPanel" class="ranking-panel hidden">
      <div class="ranking-content">
        <h3 style="margin-bottom:15px; color:#38bdf8;">🏆 Ranking General</h3>
        ${rankingHTML}
      </div>
    </div>
    <div style="background:#1e293b; padding:20px; border-radius:15px; margin-bottom:20px; text-align:center; border: 1px solid #0284c7;">
      <h2 style="color:#f8fafc;">Aciertos: ${correct} / ${questions.length}</h2>
      <p style="font-size:2.5rem; font-weight:bold; margin-top:10px; color:#38bdf8;">${porcentaje}%</p>
      <div style="display:flex; gap:12px; justify-content:center; margin-top:20px;">
        <div class="stat-box"><span>Percentil</span><br><b style="color:#38bdf8;">${percentil}%</b></div>
        <div class="stat-box"><span>Nivel</span><br><b style="color:#38bdf8;">${nivel}</b></div>
      </div>
    </div>
  `;

  document.getElementById("review").innerHTML = html;
  document.getElementById("resultado").style.display = "block";
  document.getElementById("resultado").scrollIntoView({ behavior: "smooth" });

  render();
}

function toggleRanking(){
  const panel = document.getElementById("rankingPanel");
  if(panel){
    panel.classList.toggle("hidden");
  }
}

function resetExam(){
  current = 0;
  answers = new Array(questions.length).fill(null);
  done = false;
  document.getElementById("resultado").style.display = "none";
  render();
}

// Inicialización
render();
</script>
</body>
</html>

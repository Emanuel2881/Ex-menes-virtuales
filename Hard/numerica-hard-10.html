<style>

body{

.question.active{

.option.correct-answer{

}

.option.wrong-answer{

.navigation{
text-align:center;
margin-top:15px;
}

button{
border:none;
padding:10px 15px;
border-radius:10px;
margin:5px;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
}

.next{
background:#2563eb;
color:white;
}

.next:hover{
background:#1d4ed8;
box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
}

.prev{
background:#334155;
color:#f8fafc;
}

.prev:hover{
background:#475569;
}

.finish{
background:#059669;
color:white;
}

.finish:hover{
background:#10b981;
box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
}

.actions{
text-align:center;
margin-top:20px;
}

.result{
display:none;
margin-top:20px;
padding:25px;
background:#1e293b;
border-radius:18px;
border:1px solid #334155;
}

.review-item{
background:#0f172a;
padding:15px;
margin:12px 0;
border-left:5px solid gray;
border-radius:12px;
color:#e2e8f0;
}

.correcta{
border-left-color:#10b981;
}

.incorrecta{
border-left-color:#f43f5e;
}

.sin-responder{
border-left-color:#f59e0b;
}

.explicacion{
margin-top:10px;
font-size:0.92rem;
color:#94a3b8;
background:rgba(255,255,255,0.03);
padding:10px;
border-radius:8px;
}

/* PANEL RANKING */
.ranking-panel{
position:fixed;
left:0;
top:0;
width:320px;
height:100vh;
background:#0f172a;
color:#e2e8f0;
border-right:1px solid #334155;
box-shadow:4px 0 20px rgba(0,0,0,0.5);
padding:20px;
overflow-y:auto;
z-index:999;
transition:transform 0.3s ease;
}

.ranking-panel.hidden{
transform:translateX(-100%);
}

.toggle-ranking{
position:fixed;
left:15px;
top:15px;
z-index:1000;
background:#2563eb;
color:white;
border:none;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
}

.ranking-content{
margin-top:60px;
}

@media(max-width:768px){
.ranking-panel{
width:260px;
}
.container{
padding:18px;
}
}
</style>
</head>

{q:"[{(? × 4) ÷ 3] − 5} × 5 = (13 + 19 − 2) ÷ 2",o:["2","3","6","8","15"],a:2,exp:"?=6"},
{q:"30 + 25 − 16 = [(? × 2) ÷ 4] − 1",o:["5","20","40","80","160"],a:3,exp:"?=80"},
{q:"(? − 5)² ÷ 8 = 42 ÷ 21",o:["3","7","9","13","41"],a:2,exp:"?=9"},

{q:"Serie: 1,2,4,3,6,7,14,13,26,27,54,?",o:["35","53","55","56","108"],a:1,exp:"×2 y −1 alternados"},

{q:"Serie: 39,40,38,19,22,18,9,14,8,4,?",o:["2","5","7","10","11"],a:4,exp:"Respuesta correcta: 11"},

{q:`<div><b>Ejercicio 27</b><br><br><table border="1" style="width:100%;border-collapse:collapse;text-align:center;background:#1e293b;color:#f8fafc;"><tr><th></th><th>Plancha</th><th>Depiladora</th><th>Afeitadoras</th><th>Total</th></tr><tr><td>Mayo</td><td>20</td><td>5</td><td>X</td><td>40</td></tr><tr><td>Junio</td><td>X</td><td>X</td><td>10</td><td>X</td></tr><tr><td>Abril</td><td>X</td><td>5</td><td>5</td><td>25</td></tr><tr><td>Total</td><td>40</td><td>20</td><td>X</td><td>?</td></tr></table></div>`,o:["60","65","75","90","95"],a:3,exp:"Respuesta correcta: 90"},
{q:`<div><b>Ejercicio 28</b><br><br><table border="1" style="width:100%;border-collapse:collapse;text-align:center;background:#1e293b;color:#f8fafc;"><tr><th></th><th>Hornos</th><th>Microondas</th><th>Vitrocerámica</th><th>Total</th></tr><tr><td>Septiembre</td><td>25</td><td>40</td><td>5</td><td>70</td></tr><tr><td>Octubre</td><td>X</td><td>45</td><td>50</td><td>X</td></tr><tr><td>Noviembre</td><td>30</td><td>X</td><td>?</td><td>90</td></tr><tr><td>Diciembre</td><td>35</td><td>30</td><td>X</td><td>105</td></tr><tr><td>Total</td><td>145</td><td>155</td><td>X</td><td>X</td></tr></table></div>`,o:["10","15","20","30","60"],a:2,exp:"Respuesta correcta: 20"},

{q:`<div><b>Ejercicio 29</b><br><br><table border="1" style="width:100%;border-collapse:collapse;text-align:center;background:#1e293b;color:#f8fafc;"><tr><th></th><th>Cafetera</th><th>Tostadora</th><th>Freidora</th><th>Total</th></tr><tr><td>Enero</td><td>X</td><td>5</td><td>20</td><td>35</td></tr><tr><td>Febrero</td><td>5</td><td>X</td><td>X</td><td>30</td></tr><tr><td>Marzo</td><td>15</td><td>30</td><td>?</td><td>X</td></tr><tr><td>Total</td><td>X</td><td>55</td><td>40</td><td>X</td></tr></table></div>`,o:["5","10","15","20","25"],a:2,exp:"Respuesta correcta: 15"},

];


let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

const div=document.createElement("div");

div.className="question"+(i===current?" active":"");

let opts="";

q.o.forEach((op,j)=>{

let cls="";

if(answers[i]===j){

cls+=" selected";

}

if(done){

if(j===q.a){

cls+=" correct-answer";

}

if(answers[i]===j && j!==q.a){

cls+=" wrong-answer";

}

}

opts+=`

<div class="option${cls}" onclick="select(${i},${j})">
${op}
</div>

`;

});

div.innerHTML=`

<h3>${q.q}</h3>

${opts}

<div class="navigation">

<button class="prev"
onclick="prev()"
${i===0?"disabled":""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish" onclick="finish()">Finalizar</button>`

: `<button class="next" onclick="next()">Siguiente</button>`

}

</div>

`;

quiz.appendChild(div);

});

update();

}

function select(i,j){

if(done)return;

answers[i]=j;

render();

}

function next(){

if(answers[current]===null){

alert("Responde primero");

return;

}

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function prev(){

current--;

render();

}

function update(){

document.getElementById("qNum").textContent=current+1;

document.getElementById("progress").textContent=
answers.filter(a=>a!==null).length+" / "+questions.length;

}

function finish(){

if(done) return;
done=true;

let correct=0;
let incorrectas=0;
let sinResponder=0;

questions.forEach((q,i)=>{
if(answers[i]===q.a) correct++;
else if(answers[i]===null) sinResponder++;
else incorrectas++;
});

let porcentaje=Math.round(
(correct/questions.length)*100
);

// GENERACIÓN DE BOTS NIVEL 3 (Notas de bots entre 75% y 100%)
const bots = [];
for(let i=1; i<=30; i++){
    const notaBot = Math.floor(Math.random() * 26) + 75; // Genera 75 - 100
    bots.push({
        nombre: `Bot_${i}`,
        nota: notaBot
    });
}

const ranking = [
    ...bots,
    { nombre: "Tú", nota: porcentaje, usuario: true }
];

ranking.sort((a,b) => b.nota - a.nota);

let debajo = ranking.filter(p => porcentaje > p.nota).length;
let iguales = ranking.filter(p => porcentaje === p.nota).length;
let percentil = Math.round((debajo + (0.5 * iguales)) / ranking.length * 100);

if(percentil < 1) percentil = 1;
if(percentil > 99) percentil = 99;

let nivel = "Muy bajo";
if(percentil >= 90) nivel = "Excelente";
else if(percentil >= 75) nivel = "Muy bueno";
else if(percentil >= 60) nivel = "Bueno";
else if(percentil >= 40) nivel = "Promedio";
else if(percentil >= 20) nivel = "Bajo";

let html="";
questions.forEach((q,i)=>{

let estado="";

if(answers[i]===null){
estado="sin-responder";
}
else if(answers[i]===q.a){
estado="correcta";
}
else{
estado="incorrecta";
}

html+=`

<div class="review-item ${estado}">

<h3>
Pregunta ${i+1}
</h3>

<p style="margin-top:8px;">
${q.q}
</p>

<br>

<p>
<b>Tu respuesta:</b>

${
answers[i]!==null
?
q.o[answers[i]]
:
"Sin responder"
}
</p>

<p style="margin-top:6px;">
<b>Correcta:</b>
${q.o[q.a]}
</p>

<div class="explicacion">
${q.exp}
</div>

</div>

`;

});

document.getElementById("score").innerHTML=`
<button class="toggle-ranking" onclick="toggleRanking()">🏆 Ver Ranking</button>

<div id="rankingPanel" class="ranking-panel hidden">
<div class="ranking-content">
<span class="badge-nivel">Nivel 3 (Dificultad Alta)</span>
<h3 style="margin-bottom:15px; color:#38bdf8;">🏆 Ranking General</h3>
${ranking.map((p,i)=>`
<div style="display:flex; justify-content:space-between; padding:10px; margin:6px 0; background:${p.usuario ? "#1e293b" : "#0f172a"}; border: 1px solid ${p.usuario ? "#38bdf8" : "#334155"}; border-radius:10px;">
<span>#${i+1} - ${p.nombre}</span>
<span>${p.nota}%</span>
</div>
`).join("")}
</div>
</div>

<div style="background:#0f172a; padding:20px; border-radius:15px; margin-bottom:20px; border: 1px solid #334155;">
<h2>${correct}/${questions.length}</h2>
<p style="font-size:26px; font-weight:bold; margin-top:10px; color:#38bdf8;">${porcentaje}%</p>
<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:15px;">
<div class="stat-box"><span>Correctas</span><br><b>${correct}</b></div>
<div class="stat-box"><span>Incorrectas</span><br><b>${incorrectas}</b></div>
<div class="stat-box"><span>Sin responder</span><br><b>${sinResponder}</b></div>
<div class="stat-box"><span>Percentil</span><br><b>${percentil}%</b></div>
<div class="stat-box"><span>Nivel</span><br><b>${nivel}</b></div>
</div>
</div>
`;

document.getElementById("review")

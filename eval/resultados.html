<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados Finales</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background: linear-gradient(135deg, #18121e, #0f172a);
    color: #f1f5f9;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:950px;
    background: #1e1b2e;
    border: 1px solid rgba(244, 63, 94, 0.2);
    border-radius:20px;
    padding:30px;
    box-shadow:0 12px 35px rgba(0, 0, 0, 0.4);
}

h1{
    text-align:center;
    margin-bottom:10px;
    color: #fb7185;
}

.subtitulo{
    text-align:center;
    color: #94a3b8;
    margin-bottom:30px;
}

.resumen{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:30px;
}

.card{
    background: #272238;
    border: 1px solid rgba(56, 189, 248, 0.15);
    padding:20px;
    border-radius:14px;
    text-align:center;
}

.card h3{
    margin-bottom:10px;
    font-size:18px;
    color: #38bdf8;
}

.card p{
    font-size:28px;
    font-weight:bold;
    color: #f43f5e;
}

.titulo-seccion{
    margin-bottom:15px;
    margin-top:25px;
    color: #fb7185;
}

.ranking{
    background: #272238;
    border-radius:14px;
    padding:20px;
    border: 1px solid rgba(56, 189, 248, 0.15);
}

.fila{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-bottom:1px solid #382d47;
    color: #cbd5e1;
}

.fila:last-child{
    border-bottom:none;
}

.usuario{
    background: #3b1d31;
    color: #f43f5e;
    font-weight:bold;
    border-radius:10px;
    border: 1px solid #f43f5e;
}

.nivel-box{
    background: #272238;
    border: 1px solid rgba(244, 63, 94, 0.2);
    padding:20px;
    border-radius:14px;
    text-align:center;
    margin-top:25px;
}

.nivel-box h2{
    margin-bottom:10px;
    color: #cbd5e1;
}

#nivel{
    font-size:30px;
    font-weight:bold;
    color: #38bdf8;
}

button{
    width:100%;
    margin-top:30px;
    background: linear-gradient(135deg, #e11d48, #be123c);
    color:white;
    border:none;
    padding:16px;
    border-radius:14px;
    cursor:pointer;
    font-size:18px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
    transition: background 0.2s, transform 0.1s;
}

button:hover{
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    transform: translateY(-2px);
}

@media(max-width:700px){
    .fila{
        font-size:14px;
    }
    .card p{
        font-size:22px;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>Resultados Finales</h1>
    <p class="subtitulo">Simulador de admisión universitaria</p>

    <div class="resumen">
        <div class="card">
            <h3>Verbal</h3>
            <p id="verbal">0</p>
        </div>
        <div class="card">
            <h3>Numérica</h3>
            <p id="numerica">0</p>
        </div>
        <div class="card">
            <h3>Promedio</h3>
            <p id="promedio">0</p>
        </div>
        <div class="card">
            <h3>Percentil</h3>
            <p id="percentil">0%</p>
        </div>
    </div>

    <div class="nivel-box">
        <h2>Nivel obtenido</h2>
        <p id="nivel">Promedio</p>
    </div>

    <h2 class="titulo-seccion">Ranking General</h2>
    <div class="ranking" id="ranking"></div>

    <button id="reiniciarBtn">
        Volver a empezar
    </button>

</div>

<script type="module" src="resultados.js"></script>
</body>
</html>

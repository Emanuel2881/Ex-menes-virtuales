<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 8</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#ecfeff,#cffafe,#a5f3fc);
color:#155e75;
min-height:100vh;
padding:30px 15px;
}

.container{
max-width:950px;
margin:auto;
background:rgba(255,255,255,0.95);
padding:25px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:2.3rem;
color:#0e7490;
margin-bottom:10px;
}

.header p{
color:#0f766e;
}

.stats-bar{
display:flex;
gap:12px;
justify-content:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.stat-box{
background:#fff;
border:1px solid #67e8f9;
border-radius:14px;
padding:12px 18px;
min-width:150px;
text-align:center;
}

.question{
display:none;
background:#ecfeff;
border:1px solid #67e8f9;
border-radius:20px;
padding:20px;
}

.question.active{
display:block;
}

.option{
background:#cffafe;
padding:12px;
margin:10px 0;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#a5f3fc;
}

.option.selected{
background:#0e7490;
color:white;
}

.option.correct-answer{
background:#bbf7d0;
}

.option.wrong-answer{
background:#fecaca;
}

.navigation{
text-align:center;
margin-top:15px;
}

button{
border:none;
padding:10px 15px;
border-radius:10px;
margin:5px;
cursor:pointer;
font-weight:bold;
}

.next{
background:#0e7490;
color:white;
}

.prev{
background:#67e8f9;
}

.finish{
background:#155e75;
color:white;
}

.actions{
text-align:center;
margin-top:20px;
}

.result{
display:none;
margin-top:20px;
padding:20px;
background:#ecfeff;
border-radius:15px;
}

.review-item{
background:white;
padding:14px;
margin:12px 0;
border-left:5px solid gray;
border-radius:12px;
}

.correcta{
border-left-color:green;
}

.incorrecta{
border-left-color:red;
}

.sin-responder{
border-left-color:orange;
}

.explicacion{
margin-top:8px;
font-size:0.92rem;
color:#374151;
}

/* PANEL RANKING */

.ranking-panel{
position:fixed;
left:0;
top:0;
width:320px;
height:100vh;
background:white;
box-shadow:4px 0 20px rgba(0,0,0,0.1);
padding:20px;
overflow-y:auto;
z-index:999;
transition:transform 0.3s ease;
}

.ranking-panel.hidden{
transform:translateX(-100%);
}

.toggle-ranking{
position:fixed;
left:15px;
top:15px;
z-index:1000;
background:#0e7490;
color:white;
border:none;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.ranking-content{
margin-top:60px;
}

@media(max-width:768px){

.ranking-panel{
width:260px;
}

.container{
padding:18px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧠 Habilidad Numérica 8</h1>
<p>Simulacro mixto</p>
</div>

<div class="stats-bar">

<div class="stat-box">
<span>Pregunta</span><br>
<b id="qNum">1</b> / 25
</div>

<div class="stat-box">
<span>Progreso</span><br>
<b id="progress">0 / 25</b>
</div>

</div>

<div id="quiz"></div>

<div class="actions">
<button class="finish" onclick="finish()">Calificar</button>
<button class="prev" onclick="resetExam()">Reiniciar</button>
</div>

<div class="result" id="resultado">

<h2 style="margin-bottom:20px;">
Resultado Final
</h2>

<p id="score"></p>

<div id="review"></div>

</div>

</div>

<script>

const questions = [

{q:"Serie: 3, 7, 15, 31, ?",o:["47","55","63","71","Ninguna"],a:2,exp:"Se multiplica por 2 y se suma 1 → 31×2+1=63"},

{q:"Serie: 1, 4, 10, 20, ?",o:["30","32","35","40","Ninguna"],a:2,exp:"+3,+6,+10,+15 → 35"},

{q:"Serie: 2, 4, 8, 16, ?",o:["20","24","32","36","Ninguna"],a:2,exp:"×2"},

{q:"Serie: 5, 6, 8, 11, 15, ?",o:["18","20","21","22","Ninguna"],a:1,exp:"+1,+2,+3,+4,+5 → 20"},

{q:"Si 3x + 9 = 24, ¿x?",o:["3","4","5","6","Ninguna"],a:2,exp:"3x=15 → x=5"},

{q:"Si 2x - 4 = 10, ¿x?",o:["5","6","7","8","Ninguna"],a:2,exp:"2x=14 → x=7"},

{q:"Si x/5 = 6, ¿x?",o:["25","30","35","40","Ninguna"],a:1,exp:"x=30"},

{q:"(2/3)+(1/6)",o:["3/6","4/6","5/6","6/6","Ninguna"],a:2,exp:"4/6+1/6=5/6"},

{q:"(3/4)×(8/9)",o:["2/3","3/4","4/5","5/6","Ninguna"],a:0,exp:"24/36=2/3"},

{q:"(10/3)÷(2/3)",o:["3","4","5","6","Ninguna"],a:2,exp:"(10/3)×(3/2)=5"},

{q:"20% de 300",o:["50","60","70","80","Ninguna"],a:1,exp:"=60"},

{q:"15% de 200",o:["25","30","35","40","Ninguna"],a:1,exp:"=30"},

{q:"Si 8 es el 40% de un número, ¿cuál es?",o:["10","15","20","25","Ninguna"],a:2,exp:"8/0.4=20"},

{q:"(6×5)+(12÷3)",o:["30","32","34","36","Ninguna"],a:2,exp:"30+4=34"},

{q:"(10×4)+(18÷6)",o:["40","42","43","44","Ninguna"],a:2,exp:"40+3=43"},

{q:"Serie: 1, 3, 9, 27, ?",o:["54","72","81","90","Ninguna"],a:2,exp:"×3"},

{q:"Serie: 2, 5, 10, 17, ?",o:["24","25","26","27","Ninguna"],a:2,exp:"+3,+5,+7,+9 → 26"},

{q:"Promedio de 5, 10, 15, 20",o:["10","12.5","15","17.5","Ninguna"],a:1,exp:"50/4=12.5"},

{q:"Área de rectángulo 6×7",o:["36","40","42","45","Ninguna"],a:2,exp:"=42"},

{q:"Perímetro de cuadrado lado 9",o:["27","30","36","40","Ninguna"],a:2,exp:"9×4=36"},

{q:"Si 4x = 36, ¿x?",o:["6","7","8","9","Ninguna"],a:3,exp:"x=9"},

{q:"Si x² = 64, ¿x?",o:["6","7","8","9","Ninguna"],a:2,exp:"x=8"},

{q:"Serie: 10, 20, 40, 80, ?",o:["120","140","160","180","Ninguna"],a:2,exp:"×2"},

{q:"Serie: 7, 14, 28, 56, ?",o:["84","96","112","128","Ninguna"],a:2,exp:"×2"},

{q:"(50÷5)+(60÷6)",o:["15","18","20","22","Ninguna"],a:2,exp:"10+10=20"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

const div=document.createElement("div");

div.className="question"+(i===current?" active":"");

let opts="";

q.o.forEach((op,j)=>{

let cls="";

if(answers[i]===j){

cls+=" selected";

}

if(done){

if(j===q.a){

cls+=" correct-answer";

}

if(answers[i]===j && j!==q.a){

cls+=" wrong-answer";

}

}

opts+=`

<div class="option${cls}" onclick="select(${i},${j})">
${op}
</div>

`;

});

div.innerHTML=`

<h3>${q.q}</h3>

${opts}

<div class="navigation">

<button class="prev"
onclick="prev()"
${i===0?"disabled":""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish" onclick="finish()">Finalizar</button>`

: `<button class="next" onclick="next()">Siguiente</button>`

}

</div>

`;

quiz.appendChild(div);

});

update();

}

function select(i,j){

if(done)return;

answers[i]=j;

render();

}

function next(){

if(answers[current]===null){

alert("Responde primero");

return;

}

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function prev(){

current--;

render();

}

function update(){

document.getElementById("qNum").textContent=current+1;

document.getElementById("progress").textContent=
answers.filter(a=>a!==null).length+" / "+questions.length;

}

function finish(){

done=true;

let correct=0;
let html="";

questions.forEach((q,i)=>{

if(answers[i]===q.a){

correct++;

}

});

let porcentaje=Math.round(
(correct/questions.length)*100
);

const bots=[];

for(let i=1;i<=30;i++){

bots.push({

nombre:`Bot_${i}`,

nota:Math.floor(Math.random()*71)+30

});

}

const ranking=[

...bots,

{

nombre:"Tú",
nota:porcentaje,
usuario:true

}

];

ranking.sort((a,b)=>b.nota-a.nota);

let debajo=ranking.filter(
p=>porcentaje>p.nota
).length;

let iguales=ranking.filter(
p=>porcentaje===p.nota
).length;

let percentil=Math.round(
(
debajo+(0.5*iguales)
)
/ranking.length
*100
);

if(percentil<1){
percentil=1;
}

if(percentil>99){
percentil=99;
}

let nivel="Muy bajo";

if(percentil>=90){
nivel="Excelente";
}
else if(percentil>=75){
nivel="Muy bueno";
}
else if(percentil>=60){
nivel="Bueno";
}
else if(percentil>=40){
nivel="Promedio";
}
else if(percentil>=20){
nivel="Bajo";
}

questions.forEach((q,i)=>{

let estado="";

if(answers[i]===null){

estado="sin-responder";

}
else if(answers[i]===q.a){

estado="correcta";

}
else{

estado="incorrecta";

}

html+=`

<div class="review-item ${estado}">

<h3>
Pregunta ${i+1}
</h3>

<p style="margin-top:8px;">
${q.q}
</p>

<br>

<p>
<b>Tu respuesta:</b>

${
answers[i]!==null
?
q.o[answers[i]]
:
"Sin responder"
}

</p>

<p style="margin-top:6px;">
<b>Correcta:</b>

${q.o[q.a]}

</p>

<div class="explicacion">

${q.exp}

</div>

</div>

`;

});

let rankingHTML="";

ranking.forEach((p,i)=>{

rankingHTML+=`

<div style="
display:flex;
justify-content:space-between;
padding:10px;
margin:6px 0;
background:${p.usuario ? "#cffafe" : "white"};
border-radius:10px;
">

<span>
#${i+1} - ${p.nombre}
</span>

<span>
${p.nota}%
</span>

</div>

`;

});

document.getElementById("score").innerHTML=

`

<button class="toggle-ranking" onclick="toggleRanking()">
☰ Ranking
</button>

<div id="rankingPanel" class="ranking-panel">

<div class="ranking-content">

<h3 style="margin-bottom:15px;">
🏆 Ranking General
</h3>

${rankingHTML}

</div>

</div>

<div style="
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
">

<h2>
${correct}/${questions.length}
</h2>

<p style="
font-size:26px;
font-weight:bold;
margin-top:10px;
color:#0e7490;
">
${porcentaje}%
</p>

<div style="
display:flex;
flex-direction:column;
gap:12px;
margin-top:20px;
max-width:250px;
">

<div class="stat-box">
<span>Percentil</span><br>
<b>${percentil}%</b>
</div>

<div class="stat-box">
<span>Nivel</span><br>
<b>${nivel}</b>
</div>

</div>

</div>

`;

document.getElementById("review")
.innerHTML=html;

document.getElementById("resultado")
.style.display="block";

document.getElementById("resultado")
.scrollIntoView({
behavior:"smooth"
});

if(window.enviarResultadoFinal){

window.enviarResultadoFinal({

correctas:correct,
total:questions.length,
porcentaje

});

}

render();

}

function toggleRanking(){

document.getElementById("rankingPanel")
.classList.toggle("hidden");

}

function resetExam(){

current=0;

answers=new Array(questions.length).fill(null);

done=false;

document.getElementById("resultado")
.style.display="none";

render();

}

render();

</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 3</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#ecfeff,#cffafe,#a5f3fc);
color:#0f766e;
min-height:100vh;
padding:30px 15px;
}

.container{
max-width:950px;
margin:auto;
background:rgba(255,255,255,0.95);
padding:25px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:2.3rem;
color:#0891b2;
margin-bottom:10px;
}

.stats-bar{
display:flex;
gap:12px;
justify-content:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.stat-box{
background:#fff;
border:1px solid #67e8f9;
border-radius:14px;
padding:12px 18px;
min-width:150px;
text-align:center;
}

.question{
display:none;
background:#ecfeff;
border:1px solid #67e8f9;
border-radius:20px;
padding:20px;
}

.question.active{
display:block;
}

.option{
background:#cffafe;
padding:12px;
margin:10px 0;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#a5f3fc;
}

.option.selected{
background:#0891b2;
color:white;
}

.option.correct-answer{
background:#bbf7d0;
}

.option.wrong-answer{
background:#fecaca;
}

.navigation{
text-align:center;
margin-top:15px;
}

button{
border:none;
padding:10px 15px;
border-radius:10px;
margin:5px;
cursor:pointer;
}

.next{
background:#0891b2;
color:white;
}

.prev{
background:#67e8f9;
}

.finish{
background:#0e7490;
color:white;
}

.actions{
text-align:center;
margin-top:20px;
}

.result{
display:none;
margin-top:20px;
padding:20px;
background:#ecfeff;
border-radius:15px;
}

.review-item{
background:white;
padding:14px;
margin:12px 0;
border-left:5px solid gray;
border-radius:12px;
}

.correcta{
border-left-color:green;
}

.incorrecta{
border-left-color:red;
}

.sin-responder{
border-left-color:orange;
}

.explicacion{
margin-top:8px;
font-size:0.92rem;
color:#374151;
}

/* PANEL RANKING */

.ranking-panel{
position:fixed;
left:0;
top:0;
width:320px;
height:100vh;
background:white;
box-shadow:4px 0 20px rgba(0,0,0,0.1);
padding:20px;
overflow-y:auto;
z-index:999;
transition:transform 0.3s ease;
}

.ranking-panel.hidden{
transform:translateX(-100%);
}

.toggle-ranking{
position:fixed;
left:15px;
top:15px;
z-index:1000;
background:#0891b2;
color:white;
border:none;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.ranking-content{
margin-top:60px;
}

@media(max-width:768px){

.ranking-panel{
width:260px;
}

.container{
padding:18px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧠 Habilidad Numérica 3</h1>
<p>Procedimientos y lógica</p>
</div>

<div class="stats-bar">

<div class="stat-box">
<span>Pregunta</span><br>
<b id="qNum">1</b> / 20
</div>

<div class="stat-box">
<span>Progreso</span><br>
<b id="progress">0 / 20</b>
</div>

</div>

<div id="quiz"></div>

<div class="actions">
<button onclick="finish()">Calificar</button>
<button onclick="resetExam()">Reiniciar</button>
</div>

<div class="result" id="resultado">

<h2 style="margin-bottom:20px;">
Resultado Final
</h2>

<p id="score"></p>

<div id="review"></div>

</div>

</div>

<script>

const questions = [

{q:"Si 13×18 + 7 = ?",o:["231","241","247","254","Ninguna"],a:1,exp:"13×18=234 → 234+7=241"},
{q:"Simplifica: 6x + 4x - 3x",o:["5x","6x","7x","8x","Ninguna"],a:2,exp:"(6+4-3)x=7x"},
{q:"(8/4) + (6/3)",o:["3","4","5","6","Ninguna"],a:1,exp:"2+2=4"},
{q:"25% de 80",o:["10","15","20","25","Ninguna"],a:2,exp:"0.25×80=20"},
{q:"Si x/4 = 5",o:["10","15","20","25","Ninguna"],a:2,exp:"x=20"},
{q:"Resto de 45 ÷ 6",o:["1","2","3","4","Ninguna"],a:2,exp:"45 ÷ 6 = 7 resto 3"},
{q:"9²",o:["72","81","90","99","Ninguna"],a:1,exp:"9×9=81"},
{q:"(5×3)+(2×4)",o:["19","21","23","25","Ninguna"],a:2,exp:"15+8=23"},
{q:"Si 2x = 14",o:["5","6","7","8","Ninguna"],a:2,exp:"x=7"},
{q:"(12/3)+(8/4)",o:["4","5","6","7","Ninguna"],a:2,exp:"4+2=6"},
{q:"36 ÷ 6",o:["4","5","6","7","Ninguna"],a:2,exp:"=6"},
{q:"3x + 6 = 15",o:["2","3","4","5","Ninguna"],a:1,exp:"3x=9 → x=3"},
{q:"10% de 200",o:["10","15","20","25","Ninguna"],a:2,exp:"=20"},
{q:"7 + 8 × 2",o:["30","28","23","22","Ninguna"],a:2,exp:"7+16=23"},
{q:"Si 5x = 25",o:["3","4","5","6","Ninguna"],a:2,exp:"x=5"},
{q:"(9/3)+(6/2)",o:["5","6","7","8","Ninguna"],a:1,exp:"3+3=6"},
{q:"100 - 45",o:["45","50","55","60","Ninguna"],a:2,exp:"=55"},
{q:"Si x + 9 = 20",o:["9","10","11","12","Ninguna"],a:2,exp:"x=11"},
{q:"(4×5)+(3×6)",o:["30","32","34","38","Ninguna"],a:3,exp:"20+18=38"},
{q:"81 ÷ 9",o:["7","8","9","10","Ninguna"],a:2,exp:"=9"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

const div=document.createElement("div");

div.className="question"+(i===current?" active":"");

let opts="";

q.o.forEach((op,j)=>{

let cls="";

if(answers[i]===j){

cls+=" selected";

}

if(done){

if(j===q.a){

cls+=" correct-answer";

}

if(answers[i]===j && j!==q.a){

cls+=" wrong-answer";

}

}

opts+=`

<div class="option${cls}" onclick="select(${i},${j})">
${op}
</div>

`;

});

div.innerHTML=`

<h3>${q.q}</h3>

${opts}

<div class="navigation">

<button class="prev"
onclick="prev()"
${i===0?"disabled":""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish" onclick="finish()">Finalizar</button>`

: `<button class="next" onclick="next()">Siguiente</button>`

}

</div>

`;

quiz.appendChild(div);

});

update();

}

function select(i,j){

if(done)return;

answers[i]=j;

render();

}

function next(){

if(answers[current]===null){

alert("Responde primero");

return;

}

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function prev(){

current--;

render();

}

function update(){

document.getElementById("qNum").textContent=current+1;

document.getElementById("progress").textContent=
answers.filter(a=>a!==null).length+" / "+questions.length;

}

function finish(){

done=true;

let correct=0;
let html="";



// CONTAR

questions.forEach((q,i)=>{

if(answers[i]===q.a){

correct++;

}

});



// PORCENTAJE

let porcentaje=Math.round(

(correct/questions.length)*100

);



// BOTS

const bots=[];

for(let i=1;i<=30;i++){

bots.push({

nombre:`Bot_${i}`,

nota:Math.floor(
Math.random()*71
)+30

});

}



// RANKING

const ranking=[

...bots,

{

nombre:"Tú",
nota:porcentaje,
usuario:true

}

];



ranking.sort(

(a,b)=>b.nota-a.nota

);



// PERCENTIL

let debajo=ranking.filter(

p=>porcentaje>p.nota

).length;



let iguales=ranking.filter(

p=>porcentaje===p.nota

).length;



let percentil=Math.round(

(

debajo+(0.5*iguales)

)

/ranking.length

*100

);



if(percentil<1){

percentil=1;

}

if(percentil>99){

percentil=99;

}



// NIVEL

let nivel="Muy bajo";

if(percentil>=90){

nivel="Excelente";

}

else if(percentil>=75){

nivel="Muy bueno";

}

else if(percentil>=60){

nivel="Bueno";

}

else if(percentil>=40){

nivel="Promedio";

}

else if(percentil>=20){

nivel="Bajo";

}



// REVIEW

questions.forEach((q,i)=>{

let estado="";

if(answers[i]===null){

estado="sin-responder";

}

else if(answers[i]===q.a){

estado="correcta";

}

else{

estado="incorrecta";

}



html+=`

<div class="review-item ${estado}">

<h3>
Pregunta ${i+1}
</h3>

<p style="margin-top:8px;">
${q.q}
</p>

<br>

<p>
<b>Tu respuesta:</b>

${
answers[i]!==null

?

q.o[answers[i]]

:

"Sin responder"

}
</p>

<p style="margin-top:6px;">
<b>Correcta:</b>

${q.o[q.a]}
</p>

<div class="explicacion">

${q.exp}

</div>

</div>

`;

});



// RANKING HTML

let rankingHTML="";

ranking.forEach((p,i)=>{

rankingHTML+=`

<div style="
display:flex;
justify-content:space-between;
padding:10px;
margin:6px 0;
background:${p.usuario ? "#cffafe" : "white"};
border-radius:10px;
">

<span>
#${i+1} - ${p.nombre}
</span>

<span>
${p.nota}%
</span>

</div>

`;

});



// MOSTRAR

document.getElementById("score").innerHTML=

`

<button class="toggle-ranking" onclick="toggleRanking()">
☰ Ranking
</button>

<div id="rankingPanel" class="ranking-panel">

<div class="ranking-content">

<h3 style="margin-bottom:15px;">
🏆 Ranking General
</h3>

${rankingHTML}

</div>

</div>

<div style="
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
">

<h2>
${correct}/${questions.length}
</h2>

<p style="
font-size:26px;
font-weight:bold;
margin-top:10px;
color:#0891b2;
">
${porcentaje}%
</p>

<div style="
display:flex;
flex-direction:column;
gap:12px;
margin-top:20px;
max-width:250px;
">

<div class="stat-box">
<span>Percentil</span><br>
<b>${percentil}%</b>
</div>

<div class="stat-box">
<span>Nivel</span><br>
<b>${nivel}</b>
</div>

</div>

</div>

`;



document.getElementById("review")
.innerHTML=html;



document.getElementById("resultado")
.style.display="block";



document.getElementById("resultado")
.scrollIntoView({

behavior:"smooth"

});



// PARTY

if(window.enviarResultadoFinal){

window.enviarResultadoFinal({

correctas:correct,
total:questions.length,
porcentaje

});

}



// REPINTAR

render();

}

function toggleRanking(){

document.getElementById("rankingPanel")
.classList.toggle("hidden");

}

function resetExam(){

current=0;

answers=new Array(questions.length).fill(null);

done=false;

document.getElementById("resultado")
.style.display="none";

render();

}

render();

</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

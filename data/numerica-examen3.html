<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 3</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#ecfeff,#cffafe,#a5f3fc);
  color:#0f766e;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:2.3rem;color:#0891b2;margin-bottom:10px;}

.stats-bar{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #67e8f9;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.question{
  display:none;
  background:#ecfeff;
  border:1px solid #67e8f9;
  border-radius:20px;
  padding:20px;
}

.question.active{display:block;}

.option{
  background:#cffafe;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
}

.option.selected{background:#0891b2;color:white;}
.option.correct-answer{background:#bbf7d0;}
.option.wrong-answer{background:#fecaca;}

.navigation{text-align:center;margin-top:15px;}

button{
  border:none;
  padding:10px 15px;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
}

.actions{text-align:center;margin-top:20px;}

.result{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#ecfeff;
  border-radius:15px;
}

.review-item{
  background:white;
  padding:10px;
  margin:10px 0;
  border-left:5px solid gray;
}

.correcta{border-left-color:green;}
.incorrecta{border-left-color:red;}
.sin-responder{border-left-color:orange;}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h1>🧠 Habilidad Numérica 3</h1>
    <p>Procedimientos y lógica</p>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <span>Pregunta</span><br>
      <b id="qNum">1</b> / 20
    </div>
    <div class="stat-box">
      <span>Progreso</span><br>
      <b id="progress">0 / 20</b>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="actions">
    <button onclick="finish()">Calificar</button>
    <button onclick="resetExam()">Reiniciar</button>
  </div>

  <div class="result" id="resultado">
    <h2>Resultado</h2>
    <p id="score"></p>
    <div id="review"></div>
  </div>
</div>

<script>
const questions = [

{q:"Si 13×18 + 7 = ?",o:["231","241","247","254","Ninguna"],a:1,exp:"13×18=234 → 234+7=241"},
{q:"Simplifica: 6x + 4x - 3x",o:["5x","6x","7x","8x","Ninguna"],a:2,exp:"(6+4-3)x=7x"},
{q:"(8/4) + (6/3)",o:["3","4","5","6","Ninguna"],a:1,exp:"2+2=4"},
{q:"25% de 80",o:["10","15","20","25","Ninguna"],a:2,exp:"0.25×80=20"},
{q:"Si x/4 = 5",o:["10","15","20","25","Ninguna"],a:2,exp:"x=20"},
{q:"Resto de 45 ÷ 6",o:["1","2","3","4","Ninguna"],a:2,exp:"45 ÷ 6 = 7 resto 3"},
{q:"9²",o:["72","81","90","99","Ninguna"],a:1,exp:"9×9=81"},
{q:"(5×3)+(2×4)",o:["19","21","23","25","Ninguna"],a:2,exp:"15+8=23"},
{q:"Si 2x = 14",o:["5","6","7","8","Ninguna"],a:2,exp:"x=7"},
{q:"(12/3)+(8/4)",o:["4","5","6","7","Ninguna"],a:2,exp:"4+2=6"},
{q:"36 ÷ 6",o:["4","5","6","7","Ninguna"],a:2,exp:"=6"},
{q:"3x + 6 = 15",o:["2","3","4","5","Ninguna"],a:1,exp:"3x=9 → x=3"},
{q:"10% de 200",o:["10","15","20","25","Ninguna"],a:2,exp:"=20"},
{q:"7 + 8 × 2",o:["30","28","23","22","Ninguna"],a:2,exp:"7+16=23"},
{q:"Si 5x = 25",o:["3","4","5","6","Ninguna"],a:2,exp:"x=5"},
{q:"(9/3)+(6/2)",o:["5","6","7","8","Ninguna"],a:1,exp:"3+3=6"},
{q:"100 - 45",o:["45","50","55","60","Ninguna"],a:2,exp:"=55"},
{q:"Si x + 9 = 20",o:["9","10","11","12","Ninguna"],a:2,exp:"x=11"},
{q:"(4×5)+(3×6)",o:["30","32","34","38","Ninguna"],a:3,exp:"20+18=38"},
{q:"81 ÷ 9",o:["7","8","9","10","Ninguna"],a:2,exp:"=9"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
const div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls+=" selected";
if(done){
if(j===q.a) cls+=" correct-answer";
if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}
opts+=`<div class="option${cls}" onclick="select(${i},${j})">${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<div class="navigation">
<button onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1
? `<button onclick="finish()">Finalizar</button>`
: `<button onclick="next()">Siguiente</button>`}
</div>`;

quiz.appendChild(div);
});

update();
}

function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}

function update(){
document.getElementById("qNum").textContent=current+1;
document.getElementById("progress").textContent=answers.filter(a=>a!==null).length+" / "+questions.length;
}

function finish(){
done=true;
let correct=0;
let html="";

questions.forEach((q,i)=>{
const user=answers[i];

let estado="sin-responder";
if(user===q.a){correct++;estado="correcta";}
else if(user!==null){estado="incorrecta";}

html+=`
<div class="review-item ${estado}">
<h4>Pregunta ${i+1}</h4>
<p><b>Correcta:</b> ${q.o[q.a]}</p>
<div class="explicacion">${q.exp}</div>
</div>`;
});

document.getElementById("score").innerHTML=`${correct} / ${questions.length}`;
document.getElementById("review").innerHTML=html;
document.getElementById("resultado").style.display="block";

render();
}

function resetExam(){
current=0;
answers=new Array(questions.length).fill(null);
done=false;
document.getElementById("resultado").style.display="none";
render();
}

render();
</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

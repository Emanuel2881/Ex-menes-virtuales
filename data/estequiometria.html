<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Examen Estequiometría PRO</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#fee2e2,#fecaca,#fca5a5);
color:#7f1d1d;
min-height:100vh;
padding:30px 15px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:25px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,.1);
}

.question{margin-bottom:20px}
.option{
background:#fecaca;
padding:12px;
margin:8px 0;
border-radius:10px;
cursor:pointer;
}

.option.selected{background:#b91c1c;color:white;}
.option.correct-answer{background:#16a34a;color:white;}
.option.wrong-answer{background:#991b1b;color:white;}

button{
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

.result{
display:none;
margin-top:20px;
padding:20px;
background:#fee2e2;
border-radius:15px;
}

.review-item{
background:white;
padding:10px;
margin:10px 0;
border-left:5px solid gray;
}

.correcta{border-left-color:green;}
.incorrecta{border-left-color:red;}
</style>
</head>

<body>

<div class="container">

<h1>🧪 Estequiometría PRO</h1>

<div id="quiz"></div>

<button onclick="finish()">Finalizar</button>

<div class="result" id="resultado">
<h2>Resultado</h2>
<p id="score"></p>
<div id="review"></div>
</div>

</div>

<script>

const NA = 6.02e23;

const questions = [

{q:"¿Cuántos moles hay en 3.01×10^23 moléculas?",o:["0.5 mol","1 mol","2 mol","0.25 mol"],a:0,exp:"3.01e23 / 6.02e23 = 0.5 mol"},
{q:"¿Cuántas moléculas hay en 2 mol?",o:["1.20×10^24","6.02×10^23","3.01×10^23","2×10^23"],a:0,exp:"2×6.02e23"},
{q:"¿Cuántos gramos hay en 1 mol de CO2?",o:["44 g","22 g","28 g","12 g"],a:0,exp:"Masa molar CO2 = 44"},
{q:"¿Cuántos moles hay en 88 g de CO2?",o:["2 mol","1 mol","0.5 mol","4 mol"],a:0,exp:"88/44=2"},
{q:"¿Cuántas partículas hay en 0.25 mol?",o:["1.51×10^23","6.02×10^23","3×10^23","2×10^23"],a:0,exp:"0.25×6.02e23"},

{q:"¿Cuántos gramos hay en 0.5 mol de H2O?",o:["9 g","18 g","36 g","4.5 g"],a:0,exp:"0.5×18"},
{q:"¿Cuántos moles hay en 9 g de H2O?",o:["0.5 mol","1 mol","2 mol","0.25 mol"],a:0,exp:"9/18"},
{q:"¿Cuántas moléculas hay en 0.1 mol?",o:["6.02×10^22","6.02×10^23","3×10^22","1×10^23"],a:0,exp:"0.1×6.02e23"},
{q:"¿Cuántos gramos hay en 2 mol de O2?",o:["64 g","32 g","16 g","48 g"],a:0,exp:"2×32"},
{q:"¿Cuántos moles hay en 16 g de O2?",o:["0.5 mol","1 mol","2 mol","0.25 mol"],a:0,exp:"16/32"},

{q:"¿Cuántas partículas hay en 3 mol?",o:["1.81×10^24","6.02×10^23","9×10^23","3×10^23"],a:0,exp:"3×6.02e23"},
{q:"¿Cuántos gramos hay en 0.25 mol de CO2?",o:["11 g","22 g","44 g","5.5 g"],a:0,exp:"0.25×44"},
{q:"¿Cuántos moles hay en 11 g de CO2?",o:["0.25 mol","0.5 mol","1 mol","2 mol"],a:0,exp:"11/44"},
{q:"¿Cuántas moléculas hay en 0.75 mol?",o:["4.52×10^23","6.02×10^23","3×10^23","2×10^23"],a:0,exp:"0.75×6.02e23"},
{q:"¿Cuántos gramos hay en 3 mol de H2O?",o:["54 g","18 g","36 g","72 g"],a:0,exp:"3×18"},

{q:"¿Cuántos moles hay en 54 g de H2O?",o:["3 mol","1 mol","2 mol","0.5 mol"],a:0,exp:"54/18"},
{q:"¿Cuántas partículas hay en 0.2 mol?",o:["1.20×10^23","6×10^22","2×10^23","3×10^22"],a:0,exp:"0.2×6.02e23"},
{q:"¿Cuántos gramos hay en 0.2 mol de O2?",o:["6.4 g","3.2 g","1.6 g","32 g"],a:0,exp:"0.2×32"},
{q:"¿Cuántos moles hay en 6.4 g de O2?",o:["0.2 mol","1 mol","0.5 mol","2 mol"],a:0,exp:"6.4/32"},
{q:"¿Cuántas moléculas hay en 5 mol?",o:["3.01×10^24","6×10^24","1×10^24","2×10^24"],a:0,exp:"5×6.02e23"},

// 🔥 RENDIMIENTO

{q:"Si el rendimiento teórico es 40 g y el real 30 g, ¿%?",o:["75%","80%","70%","60%"],a:0,exp:"30/40×100"},
{q:"Teórico 50 g, real 45 g",o:["90%","85%","80%","95%"],a:0,exp:"45/50×100"},
{q:"Teórico 80 g, real 60 g",o:["75%","70%","65%","80%"],a:0,exp:"60/80×100"},
{q:"Teórico 100 g, real 50 g",o:["50%","60%","40%","70%"],a:0,exp:"50/100×100"},
{q:"Teórico 20 g, real 15 g",o:["75%","80%","85%","70%"],a:0,exp:"15/20×100"},

{q:"Si rendimiento 80% y teórico 50 g, real?",o:["40 g","30 g","45 g","35 g"],a:0,exp:"0.8×50"},
{q:"Si rendimiento 50% y teórico 80 g",o:["40 g","30 g","20 g","60 g"],a:0,exp:"0.5×80"},
{q:"Si rendimiento 25% y teórico 100 g",o:["25 g","50 g","75 g","10 g"],a:0,exp:"0.25×100"},
{q:"Si rendimiento 90% y teórico 20 g",o:["18 g","16 g","15 g","19 g"],a:0,exp:"0.9×20"},
{q:"Si rendimiento 60% y teórico 70 g",o:["42 g","35 g","50 g","30 g"],a:0,exp:"0.6×70"},

// 🔥 ESTEQUIOMETRÍA

{q:"2H2 + O2 → 2H2O, ¿mol H2O con 2 mol H2?",o:["2 mol","1 mol","4 mol","0.5 mol"],a:0,exp:"Relación 2:2"},
{q:"¿mol O2 con 2 mol H2?",o:["1 mol","2 mol","0.5 mol","3 mol"],a:0,exp:"2:1"},
{q:"¿mol H2 necesarios para 4 mol H2O?",o:["4 mol","2 mol","1 mol","8 mol"],a:0,exp:"2:2"},
{q:"¿mol O2 para 4 mol H2O?",o:["2 mol","4 mol","1 mol","3 mol"],a:0,exp:"2:1"},
{q:"¿mol H2O con 1 mol O2?",o:["2 mol","1 mol","0.5 mol","3 mol"],a:0,exp:"1→2"},

{q:"N2 + 3H2 → 2NH3, ¿mol NH3 con 1 mol N2?",o:["2 mol","1 mol","3 mol","0.5 mol"],a:0,exp:"1→2"},
{q:"¿mol H2 necesarios para 2 mol NH3?",o:["3 mol","2 mol","1 mol","4 mol"],a:0,exp:"3:2"},
{q:"¿mol N2 necesarios para 4 mol NH3?",o:["2 mol","1 mol","4 mol","3 mol"],a:0,exp:"1:2"},
{q:"¿mol NH3 con 3 mol H2?",o:["2 mol","3 mol","1 mol","4 mol"],a:0,exp:"3→2"},
{q:"¿mol H2 con 1 mol N2?",o:["3 mol","2 mol","1 mol","4 mol"],a:0,exp:"1→3"},

{q:"C + O2 → CO2, ¿mol CO2 con 2 mol O2?",o:["2 mol","1 mol","3 mol","0.5 mol"],a:0,exp:"1:1"},
{q:"¿mol C necesarios para 3 mol CO2?",o:["3 mol","1 mol","2 mol","4 mol"],a:0,exp:"1:1"},
{q:"¿mol O2 necesarios para 5 mol CO2?",o:["5 mol","2 mol","3 mol","4 mol"],a:0,exp:"1:1"},
{q:"¿mol CO2 con 4 mol C?",o:["4 mol","2 mol","1 mol","5 mol"],a:0,exp:"1:1"},
{q:"¿mol C con 2 mol O2?",o:["2 mol","1 mol","3 mol","4 mol"],a:0,exp:"1:1"}

];


while(questions.length < 50){
 let base = questions.length + 1;

 questions.push({
  q:`Problema ${base}: cálculo combinado de moles y rendimiento`,
  o:["Resultado A","Resultado B","Resultado C","Resultado D"],
  a:Math.floor(Math.random()*4),
  exp:"Aplicar fórmula de conversión y rendimiento"
 });
}

let answers = new Array(questions.length).fill(null);
let done=false;

function render(){

const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{

let opts="";
q.o.forEach((op,j)=>{

let cls="";
if(answers[i]===j) cls+=" selected";

if(done){
 if(j===q.a) cls+=" correct-answer";
 if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}

opts+=`<div class="option ${cls}" onclick="select(${i},${j})">${op}</div>`;
});

quiz.innerHTML+=`
<div class="question">
<h3>${i+1}. ${q.q}</h3>
${opts}
</div>
`;
});
}

function select(i,j){
if(done)return;
answers[i]=j;
render();
}

function finish(){

done=true;

let correct=0;
let html="";

questions.forEach((q,i)=>{

const user=answers[i];

let estado="incorrecta";
if(user===q.a){correct++;estado="correcta";}

html+=`
<div class="review-item ${estado}">
<b>Pregunta ${i+1}</b><br>
Correcta: ${q.o[q.a]}<br>
Explicación: ${q.exp}
</div>
`;
});

document.getElementById("score").innerHTML=`${correct} / ${questions.length}`;
document.getElementById("review").innerHTML=html;
document.getElementById("resultado").style.display="block";

render();
}

render();

</script>

<!-- PARTY MODE -->
<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Estequiometría</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#ecfeff,#cffafe,#a5f3fc);color:#0f766e;min-height:100vh;padding:30px 15px}.container{max-width:950px;margin:auto;background:rgba(255,255,255,.95);padding:25px;border-radius:24px;box-shadow:0 12px 35px rgba(0,0,0,.08)}.header{text-align:center;margin-bottom:20px}.stats-bar{display:flex;gap:12px;justify-content:center;margin-bottom:20px}.stat-box{background:#fff;border:1px solid #67e8f9;border-radius:14px;padding:12px 18px;min-width:150px;text-align:center}.question{display:none;background:#ecfeff;border:1px solid #67e8f9;border-radius:20px;padding:20px}.question.active{display:block}.option{background:#cffafe;padding:12px;margin:10px 0;border-radius:12px;cursor:pointer}.option.selected{background:#0891b2;color:#fff}.option.correct-answer{background:#bbf7d0}.option.wrong-answer{background:#fecaca}.navigation{text-align:center;margin-top:15px}button{border:none;padding:10px 15px;border-radius:10px;margin:5px;cursor:pointer}.actions{text-align:center;margin-bottom:20px}.result{display:none;margin-top:20px;padding:20px;background:#ecfeff;border-radius:15px}.review-item{background:#fff;padding:10px;margin:10px 0;border-left:5px solid gray}.correcta{border-left-color:green}.incorrecta{border-left-color:red}.sin-responder{border-left-color:orange}</style>
</head>
<body>
<div class="container">
<div class="header"><h1>🧪 Estequiometría</h1><p>Simulador tipo examen</p></div>
<div class="actions">
<select id="modo"><option value="conversiones">Conversiones</option><option value="ecuaciones">Ecuaciones</option><option value="mixto" selected>Mixto</option></select>
<select id="cantidad"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="50">50</option></select>
<button onclick="iniciar()">Iniciar</button></div>
<div class="stats-bar"><div class="stat-box"><span>Pregunta</span><br><b id="qNum">0</b></div><div class="stat-box"><span>Progreso</span><br><b id="progress">0</b></div></div>
<div id="quiz"></div>
<div class="actions"><button onclick="finish()">Calificar</button><button onclick="resetExam()">Reiniciar</button></div>
<div class="result" id="resultado"><h2>Resultado</h2><p id="score"></p><div id="review"></div></div>
</div>
<script>
const bancoConversiones=[
{q:"¿Cuántos moles hay en 3.01×10^23 moléculas?",o:["0.5 mol","1 mol","2 mol","0.25 mol"],a:0,exp:"÷6.02e23"},
{q:"¿Cuántas moléculas hay en 1 mol?",o:["6.02×10^23","3×10^23","1×10^23","2×10^23"],a:0,exp:"×NA"},
{q:"¿Cuántos gramos hay en 2 mol de CO2?",o:["88 g","44 g","22 g","66 g"],a:0,exp:"2×44"},
{q:"¿Cuántos moles hay en 44 g de CO2?",o:["1 mol","2 mol","0.5 mol","4 mol"],a:0,exp:"44/44"},
{q:"¿Cuántas partículas hay en 0.5 mol?",o:["3.01×10^23","6×10^23","1×10^23","2×10^23"],a:0,exp:"0.5×NA"},
{q:"¿Cuántos gramos hay en 3 mol de H2O?",o:["54 g","18 g","36 g","72 g"],a:0,exp:"3×18"},
{q:"¿Cuántos moles hay en 18 g de H2O?",o:["1 mol","2 mol","0.5 mol","3 mol"],a:0,exp:"18/18"},
{q:"¿Cuántas moléculas hay en 0.25 mol?",o:["1.51×10^23","6×10^23","3×10^23","2×10^23"],a:0,exp:"0.25×NA"},
{q:"¿Cuántos gramos hay en 1 mol de O2?",o:["32 g","16 g","64 g","8 g"],a:0,exp:"32"},
{q:"¿Cuántos moles hay en 32 g de O2?",o:["1 mol","2 mol","0.5 mol","4 mol"],a:0,exp:"32/32"},
{q:"¿Cuántas partículas hay en 2 mol?",o:["1.20×10^24","6×10^23","2×10^23","3×10^23"],a:0,exp:"2×NA"},
{q:"¿Cuántos gramos hay en 0.5 mol de CO2?",o:["22 g","44 g","11 g","33 g"],a:0,exp:"0.5×44"},
{q:"¿Cuántos moles hay en 22 g de CO2?",o:["0.5 mol","1 mol","2 mol","0.25 mol"],a:0,exp:"22/44"},
{q:"¿Cuántas moléculas hay en 3 mol?",o:["1.81×10^24","6×10^23","9×10^23","3×10^23"],a:0,exp:"3×NA"},
{q:"¿Cuántos gramos hay en 4 mol de H2O?",o:["72 g","18 g","36 g","90 g"],a:0,exp:"4×18"},
{q:"¿Cuántos moles hay en 72 g de H2O?",o:["4 mol","1 mol","2 mol","3 mol"],a:0,exp:"72/18"},
{q:"¿Cuántas partículas hay en 0.1 mol?",o:["6.02×10^22","6×10^23","1×10^23","2×10^22"],a:0,exp:"0.1×NA"},
{q:"¿Cuántos gramos hay en 0.1 mol de O2?",o:["3.2 g","1.6 g","6.4 g","32 g"],a:0,exp:"0.1×32"},
{q:"¿Cuántos moles hay en 3.2 g de O2?",o:["0.1 mol","1 mol","0.5 mol","2 mol"],a:0,exp:"3.2/32"},
{q:"¿Cuántas moléculas hay en 4 mol?",o:["2.41×10^24","6×10^23","1×10^24","3×10^23"],a:0,exp:"4×NA"},
{q:"¿Cuántos gramos hay en 5 mol de CO2?",o:["220 g","44 g","110 g","55 g"],a:0,exp:"5×44"},
{q:"¿Cuántos moles hay en 220 g de CO2?",o:["5 mol","1 mol","2 mol","10 mol"],a:0,exp:"220/44"},
{q:"¿Cuántas partículas hay en 0.05 mol?",o:["3.01×10^22","6×10^22","1×10^22","2×10^22"],a:0,exp:"0.05×NA"},
{q:"¿Cuántos gramos hay en 0.05 mol de H2O?",o:["0.9 g","1.8 g","3.6 g","0.45 g"],a:0,exp:"0.05×18"},
{q:"¿Cuántos moles hay en 0.9 g de H2O?",o:["0.05 mol","0.1 mol","1 mol","0.5 mol"],a:0,exp:"0.9/18"},
{q:"¿Cuántas moléculas hay en 6 mol?",o:["3.61×10^24","6×10^23","1×10^24","2×10^24"],a:0,exp:"6×NA"},
{q:"¿Cuántos gramos hay en 6 mol de O2?",o:["192 g","32 g","96 g","64 g"],a:0,exp:"6×32"},
{q:"¿Cuántos moles hay en 192 g de O2?",o:["6 mol","2 mol","3 mol","1 mol"],a:0,exp:"192/32"},
{q:"¿Cuántas partículas hay en 0.3 mol?",o:["1.81×10^23","6×10^22","3×10^23","2×10^23"],a:0,exp:"0.3×NA"},
{q:"¿Cuántos gramos hay en 0.3 mol de CO2?",o:["13.2 g","44 g","22 g","6.6 g"],a:0,exp:"0.3×44"}
];

const bancoEcuaciones = [

{q:"En la reacción 2H2 + O2 → 2H2O, si reaccionan 2 mol de H2, ¿cuántos moles de H2O se forman?",o:["2 mol","1 mol","4 mol","0.5 mol"],a:0,exp:"2:2"},
{q:"En la reacción 2H2 + O2 → 2H2O, si reaccionan 2 mol de H2, ¿cuántos moles de O2 se necesitan?",o:["1 mol","2 mol","0.5 mol","3 mol"],a:0,exp:"2:1"},
{q:"En la reacción 2H2 + O2 → 2H2O, si se producen 4 mol de H2O, ¿cuántos moles de H2 reaccionaron?",o:["4 mol","2 mol","1 mol","8 mol"],a:0,exp:"2:2"},

{q:"En la reacción N2 + 3H2 → 2NH3, si reacciona 1 mol de N2, ¿cuántos moles de NH3 se producen?",o:["2 mol","1 mol","3 mol","0.5 mol"],a:0,exp:"1:2"},
{q:"En la reacción N2 + 3H2 → 2NH3, si se producen 2 mol de NH3, ¿cuántos moles de H2 se utilizaron?",o:["3 mol","2 mol","1 mol","4 mol"],a:0,exp:"3:2"},
{q:"En la reacción N2 + 3H2 → 2NH3, si reaccionan 6 mol de H2, ¿cuántos moles de NH3 se forman?",o:["4 mol","3 mol","2 mol","6 mol"],a:0,exp:"3→2"},

{q:"En la reacción C + O2 → CO2, si reaccionan 5 mol de O2, ¿cuántos moles de CO2 se forman?",o:["5 mol","2 mol","3 mol","4 mol"],a:0,exp:"1:1"},
{q:"En la reacción C + O2 → CO2, si se producen 3 mol de CO2, ¿cuántos moles de C reaccionaron?",o:["3 mol","1 mol","2 mol","4 mol"],a:0,exp:"1:1"},

{q:"En la reacción CH4 + 2O2 → CO2 + 2H2O, si reacciona 1 mol de CH4, ¿cuántos moles de CO2 se producen?",o:["1 mol","2 mol","0.5 mol","3 mol"],a:0,exp:"1:1"},
{q:"En la reacción CH4 + 2O2 → CO2 + 2H2O, si reacciona 1 mol de CH4, ¿cuántos moles de H2O se producen?",o:["2 mol","1 mol","3 mol","0.5 mol"],a:0,exp:"1:2"},
{q:"En la reacción CH4 + 2O2 → CO2 + 2H2O, si reaccionan 2 mol de O2, ¿cuántos moles de CO2 se forman?",o:["1 mol","2 mol","0.5 mol","3 mol"],a:0,exp:"2→1"},

{q:"En la reacción 2Na + Cl2 → 2NaCl, si reaccionan 2 mol de Na, ¿cuántos moles de NaCl se producen?",o:["2 mol","1 mol","3 mol","0.5 mol"],a:0,exp:"2:2"},
{q:"En la reacción 2Na + Cl2 → 2NaCl, si reaccionan 2 mol de Na, ¿cuántos moles de Cl2 se necesitan?",o:["1 mol","2 mol","0.5 mol","3 mol"],a:0,exp:"2:1"},

{q:"En la reacción 2KClO3 → 2KCl + 3O2, si reaccionan 2 mol de KClO3, ¿cuántos moles de O2 se producen?",o:["3 mol","2 mol","1 mol","4 mol"],a:0,exp:"2:3"},

{q:"En la reacción Fe2O3 + 3CO → 2Fe + 3CO2, si reacciona 1 mol de Fe2O3, ¿cuántos moles de Fe se producen?",o:["2 mol","1 mol","3 mol","4 mol"],a:0,exp:"1→2"},
{q:"En la reacción Fe2O3 + 3CO → 2Fe + 3CO2, si se producen 2 mol de Fe, ¿cuántos moles de CO reaccionaron?",o:["3 mol","2 mol","1 mol","4 mol"],a:0,exp:"3:2"},

{q:"En la reacción 2Al + 3Cl2 → 2AlCl3, si reaccionan 2 mol de Al, ¿cuántos moles de AlCl3 se producen?",o:["2 mol","1 mol","3 mol","4 mol"],a:0,exp:"2:2"},
{q:"En la reacción 2Al + 3Cl2 → 2AlCl3, si reaccionan 2 mol de Al, ¿cuántos moles de Cl2 se necesitan?",o:["3 mol","2 mol","1 mol","4 mol"],a:0,exp:"2:3"},

{q:"En la reacción H2 + Cl2 → 2HCl, si reacciona 1 mol de H2, ¿cuántos moles de HCl se producen?",o:["2 mol","1 mol","0.5 mol","3 mol"],a:0,exp:"1→2"},
{q:"En la reacción H2 + Cl2 → 2HCl, si se producen 2 mol de HCl, ¿cuántos moles de Cl2 reaccionaron?",o:["1 mol","2 mol","0.5 mol","3 mol"],a:0,exp:"2:1"}

];

let questions=[],current=0,answers=[],done=false;
function iniciar(){const cantidad=parseInt(document.getElementById("cantidad").value);const modo=document.getElementById("modo").value;let base=[];if(modo==="conversiones")base=bancoConversiones;else if(modo==="ecuaciones")base=bancoEcuaciones;else base=[...bancoConversiones,...bancoEcuaciones];questions=[...base].sort(()=>Math.random()-0.5).slice(0,cantidad);answers=new Array(questions.length).fill(null);current=0;done=false;document.getElementById("resultado").style.display="none";render();}
function render(){const quiz=document.getElementById("quiz");quiz.innerHTML="";questions.forEach((q,i)=>{const div=document.createElement("div");div.className="question"+(i===current?" active":"");let opts="";q.o.forEach((op,j)=>{let cls="";if(answers[i]===j)cls+=" selected";if(done){if(j===q.a)cls+=" correct-answer";if(answers[i]===j&&j!==q.a)cls+=" wrong-answer";}opts+=`<div class="option${cls}" onclick="select(${i},${j})">${op}</div>`;});div.innerHTML=`<h3>${q.q}</h3>${opts}<div class="navigation"><button onclick="prev()" ${i===0?"disabled":""}>Anterior</button>${i===questions.length-1?`<button onclick="finish()">Finalizar</button>`:`<button onclick="next()">Siguiente</button>`}</div>`;quiz.appendChild(div);});update();}
function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}
function update(){document.getElementById("qNum").textContent=current+1;document.getElementById("progress").textContent=answers.filter(a=>a!==null).length+" / "+questions.length;}
function finish(){done=true;let correct=0,html="";questions.forEach((q,i)=>{const user=answers[i];let estado="sin-responder";if(user===q.a){correct++;estado="correcta";}else if(user!==null){estado="incorrecta";}html+=`<div class="review-item ${estado}"><h4>Pregunta ${i+1}</h4><p><b>Correcta:</b> ${q.o[q.a]}</p><div>${q.exp}</div></div>`;});document.getElementById("score").innerHTML=`${correct} / ${questions.length}`;document.getElementById("review").innerHTML=html;document.getElementById("resultado").style.display="block";render();}
function resetExam(){iniciar();}
</script>
<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>
</body>
</html>

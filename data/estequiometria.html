<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Estequiometría PRO</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#ecfeff,#cffafe,#a5f3fc);
  color:#0f766e;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:2.3rem;color:#0891b2;margin-bottom:10px;}

.stats-bar{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #67e8f9;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.question{
  display:none;
  background:#ecfeff;
  border:1px solid #67e8f9;
  border-radius:20px;
  padding:20px;
}

.question.active{display:block;}

.option{
  background:#cffafe;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
}

.option.selected{background:#0891b2;color:white;}
.option.correct-answer{background:#bbf7d0;}
.option.wrong-answer{background:#fecaca;}

.navigation{text-align:center;margin-top:15px;}

button{
  border:none;
  padding:10px 15px;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
}

.actions{text-align:center;margin-bottom:20px;}

.result{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#ecfeff;
  border-radius:15px;
}

.review-item{
  background:white;
  padding:10px;
  margin:10px 0;
  border-left:5px solid gray;
}

.correcta{border-left-color:green;}
.incorrecta{border-left-color:red;}
.sin-responder{border-left-color:orange;}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧪 Estequiometría PRO</h1>
<p>Simulador tipo examen real</p>
</div>

<div class="actions">
<select id="cantidad">
<option value="10">10 preguntas</option>
<option value="20" selected>20 preguntas</option>
<option value="30">30 preguntas</option>
<option value="50">50 preguntas</option>
</select>
<button onclick="iniciar()">Iniciar examen</button>
</div>

<div class="stats-bar">
<div class="stat-box">
<span>Pregunta</span><br>
<b id="qNum">0</b>
</div>
<div class="stat-box">
<span>Progreso</span><br>
<b id="progress">0</b>
</div>
</div>

<div id="quiz"></div>

<div class="actions">
<button onclick="finish()">Calificar</button>
<button onclick="resetExam()">Reiniciar</button>
</div>

<div class="result" id="resultado">
<h2>Resultado</h2>
<p id="score"></p>
<div id="review"></div>
</div>

</div>

<script>

const banco = [

// EJEMPLO (puedes pegar aquí TODO tu banco definitivo)
{q:"¿Cuántos moles hay en 3.01×10^23 moléculas?",o:["0.5 mol","1 mol","2 mol","0.25 mol"],a:0,exp:"3.01e23 / 6.02e23"},
{q:"¿Cuántas moléculas hay en 2 mol?",o:["1.20×10^24","6.02×10^23","3.01×10^23","2×10^23"],a:0,exp:"2×6.02e23"},
{q:"Si el rendimiento teórico es 40 g y el real 30 g, ¿%?",o:["75%","80%","70%","60%"],a:0,exp:"30/40×100"},

];

// 🔥 AUTO COMPLETA HASTA 50
while(banco.length < 50){
 banco.push({
  q:"Pregunta generada "+(banco.length+1),
  o:["A","B","C","D"],
  a:Math.floor(Math.random()*4),
  exp:"Proceso estequiométrico"
 });
}

let questions=[];
let current=0;
let answers=[];
let done=false;

function iniciar(){

 const cantidad=parseInt(document.getElementById("cantidad").value);

 let mezcladas=[...banco].sort(()=>Math.random()-0.5);
 questions=mezcladas.slice(0,cantidad);

 current=0;
 answers=new Array(questions.length).fill(null);
 done=false;

 document.getElementById("resultado").style.display="none";

 render();
}

function render(){

const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
const div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls+=" selected";

if(done){
if(j===q.a) cls+=" correct-answer";
if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}

opts+=`<div class="option${cls}" onclick="select(${i},${j})">${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<div class="navigation">
<button onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1
? `<button onclick="finish()">Finalizar</button>`
: `<button onclick="next()">Siguiente</button>`}
</div>`;

quiz.appendChild(div);
});

update();
}

function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}

function update(){
document.getElementById("qNum").textContent=current+1;
document.getElementById("progress").textContent=
answers.filter(a=>a!==null).length+" / "+questions.length;
}

function finish(){

done=true;
let correct=0;
let html="";

questions.forEach((q,i)=>{
const user=answers[i];

let estado="sin-responder";
if(user===q.a){correct++;estado="correcta";}
else if(user!==null){estado="incorrecta";}

html+=`
<div class="review-item ${estado}">
<h4>Pregunta ${i+1}</h4>
<p><b>Correcta:</b> ${q.o[q.a]}</p>
<div>${q.exp}</div>
</div>`;
});

document.getElementById("score").innerHTML=`${correct} / ${questions.length}`;
document.getElementById("review").innerHTML=html;
document.getElementById("resultado").style.display="block";

render();
}

function resetExam(){iniciar();}

</script>

<!-- PARTY MODE -->
<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

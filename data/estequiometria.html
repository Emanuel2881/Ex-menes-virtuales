<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Examen de Estequiometría</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fee2e2,#fecaca,#fca5a5);color:#7f1d1d;min-height:100vh;padding:30px 15px}
.container{max-width:900px;margin:auto;background:#fff;padding:25px;border-radius:24px;box-shadow:0 12px 35px rgba(0,0,0,.1)}
.header{text-align:center;margin-bottom:20px}
.header h1{color:#b91c1c}
.exam{background:#fee2e2;padding:20px;border-radius:18px}
.pregunta{font-size:1.2rem;margin-bottom:15px}
.opciones button{display:block;width:100%;margin:8px 0;padding:12px;border:none;border-radius:10px;background:#dc2626;color:#fff;cursor:pointer}
.opciones button:hover{background:#b91c1c}
.info{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.9rem}
.progress{height:8px;background:#fecaca;border-radius:10px;margin-bottom:15px;overflow:hidden}
.bar{height:100%;background:#dc2626;width:0%}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🧪 Simulador de Examen</h1>
<p>Estequiometría</p>
</div>
<div class="exam">
<div class="info">
<span id="contador"></span>
<span id="puntaje"></span>
</div>
<div class="progress"><div id="barra" class="bar"></div></div>
<div id="pregunta" class="pregunta"></div>
<div id="opciones" class="opciones"></div>
<div id="final"></div>
</div>
</div>
<script>
let preguntas=[],i=0,score=0;
async function cargar(){
 const res=await fetch("../banco/quimica.json");
 const data=await res.json();
 preguntas=data.estequiometria;
 preguntas.sort(()=>Math.random()-0.5);
 mostrar();
}
function mostrar(){
 if(i>=preguntas.length){
  document.getElementById("pregunta").innerText="Examen finalizado";
  document.getElementById("opciones").innerHTML="";
  document.getElementById("final").innerHTML=`<h2>Puntaje: ${score}/${preguntas.length}</h2>`;
  return;
 }
 const p=preguntas[i];
 document.getElementById("pregunta").innerText=p.pregunta;
 document.getElementById("contador").innerText=`Pregunta ${i+1}/${preguntas.length}`;
 document.getElementById("puntaje").innerText=`Correctas: ${score}`;
 document.getElementById("barra").style.width=((i/preguntas.length)*100)+"%";
 const cont=document.getElementById("opciones");
 cont.innerHTML="";
 p.opciones.forEach((op,index)=>{
  const btn=document.createElement("button");
  btn.innerText=op;
  btn.onclick=()=>responder(index);
  cont.appendChild(btn);
 });
}
function responder(op){
 if(op===preguntas[i].correcta) score++;
 i++;
 mostrar();
}
cargar();
</script>
</body>
</html>

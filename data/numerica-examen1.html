<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 1</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
 
body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#eff6ff,#dbeafe,#bfdbfe);
  color:#1e3a8a;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:2.3rem;color:#1d4ed8;margin-bottom:10px;}
.header p{color:#1e40af;}

.stats-bar{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #93c5fd;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.question{
  display:none;
  background:#eff6ff;
  border:1px solid #93c5fd;
  border-radius:20px;
  padding:20px;
}

.question.active{display:block;}

.option{
  background:#dbeafe;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
}

.option.selected{background:#2563eb;color:white;}
.option.correct-answer{background:#bbf7d0;}
.option.wrong-answer{background:#fecaca;}

.navigation{text-align:center;margin-top:15px;}

button{
  border:none;
  padding:10px 15px;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
}

.next{background:#2563eb;color:white;}
.prev{background:#93c5fd;}
.finish{background:#1d4ed8;color:white;}

.actions{text-align:center;margin-top:20px;}

.result{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#eff6ff;
  border-radius:15px;
}

.review-item{
  background:white;
  padding:10px;
  margin:10px 0;
  border-left:5px solid gray;
}

.correcta{border-left-color:green;}
.incorrecta{border-left-color:red;}
.sin-responder{border-left-color:orange;}

.explicacion{
  margin-top:5px;
  font-size:0.9rem;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h1>🧠 Habilidad Numérica 1</h1>
    <p>Examen interactivo</p>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <span>Pregunta</span><br>
      <b id="qNum">1</b> / 24
    </div>
    <div class="stat-box">
      <span>Progreso</span><br>
      <b id="progress">0 / 24</b>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="actions">
    <button onclick="finish()">Calificar</button>
    <button onclick="resetExam()">Reiniciar</button>
  </div>

  <div class="result" id="resultado">
    <h2>Resultado</h2>
    <p id="score"></p>
    <div id="review"></div>
  </div>
</div>

<script>
const questions = [

{q:"2 es a 4 como 3 es a ?",o:["5","6","7","8"],a:1,exp:"Se multiplica por 2 → 3×2=6"},
{q:"10 es a 5 como 20 es a ?",o:["5","10","15","20"],a:1,exp:"Se divide entre 2 → 20÷2=10"},
{q:"5 es a 25 como 6 es a ?",o:["30","31","36","40"],a:2,exp:"Se eleva al cuadrado → 6²=36"},
{q:"Serie: 2, 5, 11, 23, ?",o:["35","45","47","49"],a:2,exp:"×2+1 → 23×2+1=47"},
{q:"Serie: 3, 6, 12, 24, ?",o:["36","42","48","54"],a:2,exp:"×2 → 48"},
{q:"20% de 150",o:["20","25","30","35"],a:2,exp:"0.2×150=30"},
{q:"Si 2x+4=14, ¿x?",o:["4","5","6","7"],a:1,exp:"2x=10 → x=5"},
{q:"(8×3)+(12÷4)",o:["24","26","27","30"],a:2,exp:"24+3=27"},
{q:"Promedio de 10, 20, 30",o:["15","20","25","30"],a:1,exp:"60/3=20"},
{q:"Área rectángulo 5×8",o:["30","35","40","45"],a:2,exp:"5×8=40"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
const div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls+=" selected";
if(done){
if(j===q.a) cls+=" correct-answer";
if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}
opts+=`<div class="option${cls}" onclick="select(${i},${j})">${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<div class="navigation">
<button class="prev" onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1
? `<button class="finish" onclick="finish()">Finalizar</button>`
: `<button class="next" onclick="next()">Siguiente</button>`}
</div>`;
quiz.appendChild(div);
});

update();
}

function select(i,j){if(done)return;answers[i]=j;render();}

function next(){
if(answers[current]===null){alert("Responde primero");return;}
current++;
render();
window.scrollTo({top:0,behavior:"smooth"});
}

function prev(){current--;render();}

function update(){
document.getElementById("qNum").textContent=current+1;
document.getElementById("progress").textContent=
answers.filter(a=>a!==null).length+" / "+questions.length;
}

function finish(){
done=true;
let correct=0;
let html="";

questions.forEach((q,i)=>{
if(answers[i]===q.a) correct++;

html+=`<div class="review-item">
<p>Correcta: ${q.o[q.a]}</p>
<div class="explicacion">${q.exp}</div>
</div>`;
});

let porcentaje=Math.round((correct/questions.length)*100);

document.getElementById("score").innerHTML=
`${correct}/${questions.length} (${porcentaje}%)`;

document.getElementById("review").innerHTML=html;
document.getElementById("resultado").style.display="block";

if(window.enviarResultadoFinal){
window.enviarResultadoFinal({
correctas:correct,
total:questions.length,
porcentaje
});
}

render();
}

// PARTY
window.mostrarResultadosParty = function(data){

const ranking=[...data].sort((a,b)=>b.porcentaje-a.porcentaje);

let html=`<div class="party-grid">`;

ranking.forEach((j,i)=>{
let medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"";

html+=`
<div class="party-card">
<h3>${medal} Jugador ${i+1}</h3>
<p>${j.correctas}/${j.total}</p>
<p>${j.porcentaje}%</p>
</div>`;
});

html+=`</div>`;
html+=`<div class="party-winner">🏆 Mejor: ${ranking[0].porcentaje}%</div>`;

document.getElementById("partyResultadoContenido").innerHTML=html;
document.getElementById("resultadoParty").style.display="block";
};

render();
</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

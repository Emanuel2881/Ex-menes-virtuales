<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 1</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#eff6ff,#dbeafe,#bfdbfe);
color:#1e3a8a;
min-height:100vh;
padding:30px 15px;
}

.container{
max-width:950px;
margin:auto;
background:rgba(255,255,255,0.95);
padding:25px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:2.3rem;
color:#1d4ed8;
margin-bottom:10px;
}

.header p{
color:#1e40af;
}

.stats-bar{
display:flex;
gap:12px;
justify-content:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.stat-box{
background:#fff;
border:1px solid #93c5fd;
border-radius:14px;
padding:12px 18px;
min-width:150px;
text-align:center;
}

.question{
display:none;
background:#eff6ff;
border:1px solid #93c5fd;
border-radius:20px;
padding:20px;
}

.question.active{
display:block;
}

.option{
background:#dbeafe;
padding:12px;
margin:10px 0;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#bfdbfe;
}

.option.selected{
background:#2563eb;
color:white;
}

.option.correct-answer{
background:#bbf7d0;
}

.option.wrong-answer{
background:#fecaca;
}

.navigation{
text-align:center;
margin-top:15px;
}

button{
border:none;
padding:10px 15px;
border-radius:10px;
margin:5px;
cursor:pointer;
}

.next{
background:#2563eb;
color:white;
}

.prev{
background:#93c5fd;
}

.finish{
background:#1d4ed8;
color:white;
}

.actions{
text-align:center;
margin-top:20px;
}

.result{
display:none;
margin-top:20px;
padding:20px;
background:#eff6ff;
border-radius:15px;
}

.review-item{
background:white;
padding:14px;
margin:12px 0;
border-left:5px solid gray;
border-radius:12px;
}

.correcta{
border-left-color:green;
}

.incorrecta{
border-left-color:red;
}

.sin-responder{
border-left-color:orange;
}

.explicacion{
margin-top:8px;
font-size:0.92rem;
color:#374151;
}

/* PANEL RANKING */

.ranking-panel{
position:fixed;
left:0;
top:0;
width:320px;
height:100vh;
background:white;
box-shadow:4px 0 20px rgba(0,0,0,0.1);
padding:20px;
overflow-y:auto;
z-index:999;
transition:transform 0.3s ease;
}

.ranking-panel.hidden{
transform:translateX(-100%);
}

.toggle-ranking{
position:fixed;
left:15px;
top:15px;
z-index:1000;
background:#2563eb;
color:white;
border:none;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.ranking-content{
margin-top:60px;
}

@media(max-width:768px){

.ranking-panel{
width:260px;
}

.container{
padding:18px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧠 Habilidad Numérica 1</h1>
<p>Examen interactivo</p>
</div>

<div class="stats-bar">

<div class="stat-box">
<span>Pregunta</span><br>
<b id="qNum">1</b> / 24
</div>

<div class="stat-box">
<span>Progreso</span><br>
<b id="progress">0 / 24</b>
</div>

</div>

<div id="quiz"></div>

<div class="actions">
<button onclick="finish()">Calificar</button>
<button onclick="location.reload()">Reiniciar</button>
</div>

<div class="result" id="resultado">

<h2 style="margin-bottom:20px;">
Resultado Final
</h2>

<p id="score"></p>

<div id="review"></div>

</div>

</div>

<script type="module">

let guardarResultadoExamen = null;
let calcularResultadoGlobal = null;

// Intenta importar de forma segura los módulos externos
try {
  const modulo = await import("./secuenciaExamenes.js");
  guardarResultadoExamen = modulo.guardarResultadoExamen;
  calcularResultadoGlobal = modulo.calcularResultadoGlobal;
} catch (e) {
  console.warn("Módulo secuenciaExamenes.js no detectado o ejecutado fuera de un servidor web. Modo standalone activo.", e);
}

const questions = [

{q:"Si 4x + 12 = 28, ¿cuál es el valor de x?",o:["2","3","4","5","Ninguna"],a:2,exp:"4x=16 → x=4"},
{q:"Serie: 3, 6, 12, 24, 48, ?",o:["72","84","96","100","Ninguna"],a:2,exp:"Se multiplica por 2 → 96"},
{q:"25% de 200",o:["25","40","50","60","Ninguna"],a:2,exp:"0.25×200=50"},
{q:"Si 7y - 5 = 30, ¿y?",o:["3","4","5","6","Ninguna"],a:2,exp:"7y=35 → y=5"},
{q:"Resto de 100 ÷ 9",o:["1","2","3","4","Ninguna"],a:0,exp:"9×11=99 → sobra 1"},
{q:"8/N = N/2",o:["2","3","4","5","Ninguna"],a:2,exp:"N²=16 → N=4"},
{q:"(3/4)+(5/8)",o:["11/8","1/2","7/8","9/8","Ninguna"],a:0,exp:"6/8 + 5/8 = 11/8"},
{q:"15% de 80",o:["10","12","14","16","Ninguna"],a:1,exp:"0.15×80=12"},
{q:"Serie: 5, 10, 20, 40, ?",o:["60","70","80","90","Ninguna"],a:2,exp:"×2 → 80"},
{q:"9 es el 30% de",o:["20","25","30","35","Ninguna"],a:2,exp:"9/0.3=30"},
{q:"2a + 3a + 5 = ?",o:["5a+5","6a+5","7a+5","8a","Ninguna"],a:0,exp:"5a+5"},
{q:"12/18 simplificado",o:["2/3","3/4","4/5","6/9","Ninguna"],a:0,exp:"÷6 → 2/3"},
{q:"x/5 = 9",o:["35","40","45","50","Ninguna"],a:2,exp:"x=45"},
{q:"¿Cuál es mayor?",o:["2/3","3/5","4/7","5/8","Ninguna"],a:0,exp:"2/3 ≈ 0.66 mayor"},
{q:"7×(5+3)",o:["40","48","56","64","Ninguna"],a:2,exp:"7×8=56"},
{q:"Serie: 1, 4, 9, 16, ?",o:["20","25","30","36","Ninguna"],a:1,exp:"Cuadrados → 25"},
{q:"Número divisible entre 2 y 5",o:["12","15","20","25","Ninguna"],a:2,exp:"20"},
{q:"6x = 42, ¿x?",o:["5","6","7","8","Ninguna"],a:2,exp:"x=7"},
{q:"(2/5)*(10/3)",o:["4/3","5/3","2","3","Ninguna"],a:0,exp:"=4/3"},
{q:"50% de 120",o:["40","50","60","70","Ninguna"],a:2,exp:"=60"},
{q:"Serie: 2, 6, 18, 54, ?",o:["72","96","162","180","Ninguna"],a:2,exp:"×3"},
{q:"x + 8 = 20",o:["10","11","12","13","Ninguna"],a:2,exp:"x=12"},
{q:"No divisible entre 3",o:["123","456","789","100","Ninguna"],a:3,exp:"100 no cumple"},
{q:"4m + 6m - 3m",o:["5m","6m","7m","8m","Ninguna"],a:2,exp:"=7m"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

const div=document.createElement("div");

div.className="question"+(i===current?" active":"");

let opts="";

q.o.forEach((op,j)=>{

let cls="";

if(answers[i]===j){

cls+=" selected";

}

if(done){

if(j===q.a){

cls+=" correct-answer";

}

if(answers[i]===j && j!==q.a){

cls+=" wrong-answer";

}

}

opts+=`

<div class="option${cls}" onclick="select(${i},${j})">
${op}
</div>

`;

});

div.innerHTML=`

<h3>${q.q}</h3>

${opts}

<div class="navigation">

<button class="prev"
onclick="prev()"
${i===0?"disabled":""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish" onclick="finish()">Finalizar</button>`

: `<button class="next" onclick="next()">Siguiente</button>`

}

</div>

`;

quiz.appendChild(div);

});

update();

}

function select(i,j){

if(done)return;

answers[i]=j;

render();

}

function next(){

if(answers[current]===null){

alert("Responde primero");

return;

}

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function prev(){

current--;

render();

}

function update(){

document.getElementById("qNum").textContent=current+1;

document.getElementById("progress").textContent=
answers.filter(a=>a!==null).length+" / "+questions.length;

}

function finish(){

done=true;

let correct=0;
let html="";

questions.forEach((q,i)=>{

if(answers[i]===q.a){

correct++;

}

});

let porcentaje=Math.round(
(correct/questions.length)*100
);

if (guardarResultadoExamen) {
  guardarResultadoExamen("numerica", correct, questions.length);
}

let percentil = porcentaje;
let nivel = "Evaluación Individual";
let ranking = [];

if (calcularResultadoGlobal) {
  const resultadoGlobal = calcularResultadoGlobal();
  if(resultadoGlobal){
    percentil = resultadoGlobal.usuario.percentil;
    nivel = resultadoGlobal.usuario.nivel;
    ranking = resultadoGlobal.ranking;
  }
}

questions.forEach((q,i)=>{

let estado="";

if(answers[i]===null){
estado="sin-responder";
}
else if(answers[i]===q.a){
estado="correcta";
}
else{
estado="incorrecta";
}

html+=`

<div class="review-item ${estado}">

<h3>
Pregunta ${i+1}
</h3>

<p style="margin-top:8px;">
${q.q}
</p>

<br>

<p>
<b>Tu respuesta:</b>

${
answers[i]!==null
?
q.o[answers[i]]
:
"Sin responder"
}
</p>

<p style="margin-top:6px;">
<b>Correcta:</b>
${q.o[q.a]}
</p>

<div class="explicacion">
${q.exp}
</div>

</div>

`;

});

let rankingHTML="";

ranking.forEach((p,i)=>{

rankingHTML+=`

<div style="
display:flex;
justify-content:space-between;
padding:10px;
margin:6px 0;
background:${p.esUsuario ? "#dbeafe" : "white"};
border-radius:10px;
">

<span>
#${i+1} - ${p.nombre}
</span>

<span>
${p.nota}%
</span>

</div>

`;

});

document.getElementById("score").innerHTML=

`

<button class="toggle-ranking" onclick="toggleRanking()">
☰ Ranking
</button>

<div id="rankingPanel" class="ranking-panel hidden">

<div class="ranking-content">

<h3 style="margin-bottom:15px;">
🏆 Ranking General
</h3>

${rankingHTML || '<p style="color:gray;">Completa ambas áreas para ver el ranking global.</p>'}

</div>

</div>

<div style="
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
">

<h2>
${correct}/${questions.length}
</h2>

<p style="
font-size:26px;
font-weight:bold;
margin-top:10px;
color:#1d4ed8;
">
${porcentaje}%
</p>

<div style="
display:flex;
flex-direction:column;
gap:12px;
margin-top:20px;
max-width:250px;
">

<div class="stat-box">
<span>Percentil</span><br>
<b>${percentil}%</b>
</div>

<div class="stat-box">
<span>Nivel</span><br>
<b>${nivel}</b>
</div>

</div>

</div>

`;

document.getElementById("review")
.innerHTML=html;

document.getElementById("resultado")
.style.display="block";

document.getElementById("resultado")
.scrollIntoView({
behavior:"smooth"
});

if(window.enviarResultadoFinal){

window.enviarResultadoFinal({
correctas:correct,
total:questions.length,
porcentaje
});

}

render();

}

function toggleRanking(){

document.getElementById("rankingPanel")
.classList.toggle("hidden");

}

window.select = select;
window.next = next;
window.prev = prev;
window.finish = finish;
window.toggleRanking = toggleRanking;

// Ejecutar primer renderizado garantizado
render();

</script>

</body>
</html>

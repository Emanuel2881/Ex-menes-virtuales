<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examen de Habilidad Numérica 1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.12);
      padding: 15px;
      border-radius: 15px;
    }

    .top-bar div {
      font-size: 1rem;
      font-weight: bold;
    }

    .progress-container {
      width: 100%;
      background: rgba(255,255,255,0.2);
      border-radius: 999px;
      overflow: hidden;
      height: 14px;
      margin-bottom: 25px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #ffd54f;
      transition: width 0.3s ease;
    }

    .question-card {
      display: none;
      background: rgba(255,255,255,0.12);
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }

    .question-card.active {
      display: block;
    }

    .question-number {
      font-size: 0.95rem;
      opacity: 0.8;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.2rem;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      background: rgba(255,255,255,0.15);
      border: 2px solid transparent;
      padding: 14px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .option:hover {
      background: rgba(255,255,255,0.22);
      transform: translateY(-2px);
    }

    .option.selected {
      border-color: #ffd54f;
      background: rgba(255, 213, 79, 0.2);
    }

    .option.correct {
      background: rgba(76, 175, 80, 0.25);
      border-color: #4caf50;
    }

    .option.incorrect {
      background: rgba(244, 67, 54, 0.25);
      border-color: #f44336;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .btn-secondary {
      background: #90caf9;
      color: #0d1b2a;
    }

    .btn-primary {
      background: #ffd54f;
      color: #222;
    }

    .btn-finish {
      background: #66bb6a;
      color: white;
    }

    button:hover {
      transform: scale(1.03);
    }

    .result-box {
      display: none;
      text-align: center;
      background: rgba(255,255,255,0.12);
      padding: 30px;
      border-radius: 20px;
      margin-top: 20px;
    }

    .result-box h2 {
      font-size: 2rem;
      margin-bottom: 15px;
    }

    .score {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .review-btn {
      margin-top: 15px;
      background: #ffb74d;
      color: #222;
    }

    .hidden {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px);}
      to { opacity: 1; transform: translateY(0);}
    }

    @media (max-width: 700px) {
      .question-text {
        font-size: 1.05rem;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🧠 Examen de Habilidad Numérica 1</h1>
    <p class="subtitle">Practica tipo admisión • MediGuía</p>

    <div class="top-bar">
      <div>Pregunta: <span id="currentQuestion">1</span>/<span id="totalQuestions">24</span></div>
      <div>Puntaje: <span id="scoreDisplay">0</span></div>
      <div>Respondidas: <span id="answeredCount">0</span></div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="quiz"></div>

    <div class="result-box" id="resultBox">
      <h2>🎉 Examen finalizado</h2>
      <p class="score">Tu puntaje: <span id="finalScore"></span></p>
      <p id="finalMessage"></p>
      <button class="review-btn" onclick="reviewAnswers()">Revisar respuestas</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "¿Qué cifra debería reemplazar a la F en esta división cuyo resultado es correcto? F73 ÷ F3 = 11",
        options: ["9", "8", "6", "4", "Ninguna de ellas"],
        answer: 3
      },
      {
        question: "Simplifica: 3x² + 7x − 9x + 10 =",
        options: ["−60x² + 10", "3x² − 63x + 10", "3x² − 2x + 10", "3x² − 16x + 10", "Ninguna de ellas"],
        answer: 2
      },
      {
        question: "¿Cuál es el resultado de: 5 − 12 =",
        options: ["−12 + 5", "12 − 5", "−(5 − 12)", "−(12 + 5)", "Ninguna de ellas"],
        answer: 0
      },
      {
        question: "¿Qué cifra debería ir en lugar de la P en esta suma cuyo resultado es correcto? 4PP4 + 4PP7 = 47671",
        options: ["9", "8", "3", "2", "Ninguna de ellas"],
        answer: 2
      },
      {
        question: "¿Cuál es el resto de dividir 2,480,739 entre 20?",
        options: ["1", "9", "29", "39", "Ninguna de ellas"],
        answer: 4
      },
      {
        question: "¿Qué número puede sustituir a la L para que la proporción sea correcta? 4/L = L/36",
        options: ["3", "9", "12", "18", "Ninguna de ellas"],
        answer: 2
      },
      {
        question: "Resuelve la operación de fracciones mostrada en el examen.",
        options: ["1/2", "3/4", "4/3", "3/2", "Ninguna de ellas"],
        answer: 0
      },
      {
        question: "El 30% del 50% de 300 es:",
        options: ["150", "90", "50", "45", "Ninguna de ellas"],
        answer: 3
      },
      {
        question: "¿Qué número debería sustituir a la K en esta división cuyo resultado es correcto? 11K8 ÷ 47 = K4",
        options: ["2", "3", "5", "6", "Ninguna de ellas"],
        answer: 0
      },
      {
        question: "4 = 10% de ____",
        options: ["0.4", "4", "40", "400", "Ninguna de ellas"],
        answer: 2
      },
      {
        question: "Simplifica: 16x² + 4y² + 3x² =",
        options: ["19x² + 4y²", "19x + 4y²", "23x²y²", "23xy", "Ninguna de ellas"],
        answer: 0
      },
      {
        question: "¿Qué número debe sustituir a la N para que la proporción sea correcta? 8/12 = N/6",
        options: ["16", "5", "4", "2", "Ninguna de ellas"],
        answer: 2
      },
      {
        question: "Si 2x² + 6x = 2x² + 3x + 5, entonces x =",
        options: ["−2.5", "−5/4", "−1", "0.6", "Ninguna de ellas"],
        answer: 4
      },
      {
        question: "¿Qué suma es MAYOR que uno?",
        options: ["1/5 + 3/4", "2/3 + 3/8", "8/12 + 1/3", "5/8 + 1/4", "Ninguna de ellas"],
        answer: 1
      },
      {
        question: "¿Qué cifra debe sustituir a la J en esta suma cuyo resultado es correcto? 24J4 + 2JJ7 = 54J1",
        options: ["0", "6", "8", "9", "Ninguna de ellas"],
        answer: 3
      },
      {
        question: "¿Qué número debería continuar la serie? 100, 9, 64, 7, ?",
        options: ["5", "36", "49", "8", "Ninguna de ellas"],
        answer: 2
      },
      {
        question: "¿Cuál es el número MÁS PEQUEÑO que es divisible exactamente entre 2, 4, 7 y 21?",
        options: ["1176", "168", "84", "42", "Ninguna de ellas"],
        answer: 2
      },
      {
        question: "¿Qué cifra debería sustituir a la N en esta resta cuyo resultado es correcto? 3N3N3 − 3NNN3 = 32700",
        options: ["1", "4", "5", "6", "Ninguna de ellas"],
        answer: 3
      },
      {
        question: "Resuelve: (15/21) ÷ (7/3)",
        options: ["15/49", "5/3", "15/7", "15", "Ninguna de ellas"],
        answer: 0
      },
      {
        question: "¿Cuál es el resultado de (84.189 × 1.99) ÷ 6.889 redondeado al entero más próximo?",
        options: ["28", "24", "20", "16", "Ninguna de ellas"],
        answer: 1
      },
      {
        question: "¿Qué cifra debe sustituir a la R en esta resta cuyo resultado es correcto? 3R33 − 9R9 = 2R54",
        options: ["0", "1", "6", "8", "Ninguna de ellas"],
        answer: 4
      },
      {
        question: "¿Qué número es divisible exactamente entre 3?",
        options: ["766", "768", "769", "976", "Ninguna de ellas"],
        answer: 1
      },
      {
        question: "Simplifica: y + x + 7x − 6y =",
        options: ["8x + 5y", "7x − 6y", "7x² − 6y²", "5y − 8x", "Ninguna de ellas"],
        answer: 4
      },
      {
        question: "¿Qué número continuaría la serie? 2400, 1200, 600, 300, ?",
        options: ["0", "100", "150", "200", "Ninguna de ellas"],
        answer: 2
      }
    ];

    const quizContainer = document.getElementById("quiz");
    const currentQuestionEl = document.getElementById("currentQuestion");
    const totalQuestionsEl = document.getElementById("totalQuestions");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const answeredCount = document.getElementById("answeredCount");
    const progressBar = document.getElementById("progressBar");
    const resultBox = document.getElementById("resultBox");
    const finalScore = document.getElementById("finalScore");
    const finalMessage = document.getElementById("finalMessage");

    let current = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let reviewed = false;

    totalQuestionsEl.textContent = questions.length;

    function renderQuiz() {
      quizContainer.innerHTML = "";

      questions.forEach((q, index) => {
        const card = document.createElement("div");
        card.className = "question-card";
        if (index === current) card.classList.add("active");

        let optionsHTML = "";
        q.options.forEach((option, i) => {
          optionsHTML += `
            <div class="option ${userAnswers[index] === i ? 'selected' : ''}" onclick="selectOption(${index}, ${i})">
              ${String.fromCharCode(65 + i)}. ${option}
            </div>
          `;
        });

        card.innerHTML = `
          <div class="question-number">Pregunta ${index + 1}</div>
          <div class="question-text">${q.question}</div>
          <div class="options">${optionsHTML}</div>
          <div class="buttons">
            <button class="btn-secondary" onclick="prevQuestion()" ${index === 0 ? "disabled" : ""}>⬅ Anterior</button>
            ${
              index === questions.length - 1
                ? `<button class="btn-finish" onclick="finishQuiz()">Finalizar</button>`
                : `<button class="btn-primary" onclick="nextQuestion()">Siguiente ➡</button>`
            }
          </div>
        `;

        quizContainer.appendChild(card);
      });

      updateTopBar();
    }

    function selectOption(questionIndex, optionIndex) {
      if (reviewed) return;
      userAnswers[questionIndex] = optionIndex;
      renderQuiz();
    }

    function nextQuestion() {
      if (current < questions.length - 1) {
        current++;
        renderQuiz();
      }
    }

    function prevQuestion() {
      if (current > 0) {
        current--;
        renderQuiz();
      }
    }

    function updateTopBar() {
      currentQuestionEl.textContent = current + 1;
      const answered = userAnswers.filter(ans => ans !== null).length;
      answeredCount.textContent = answered;
      progressBar.style.width = `${(answered / questions.length) * 100}%`;

      const score = userAnswers.reduce((acc, ans, i) => ans === questions[i].answer ? acc + 1 : acc, 0);
      scoreDisplay.textContent = score;
    }

    function finishQuiz() {
      const score = userAnswers.reduce((acc, ans, i) => ans === questions[i].answer ? acc + 1 : acc, 0);
      finalScore.textContent = `${score} / ${questions.length}`;

      let msg = "";
      if (score >= 20) {
        msg = "🔥 Muy buen nivel. Vas fuerte en habilidad numérica.";
      } else if (score >= 15) {
        msg = "💪 Vas bien, pero todavía hay espacio para subir más.";
      } else if (score >= 10) {
        msg = "📚 Nivel aceptable, pero toca reforzar bastante.";
      } else {
        msg = "🫠 Hay que practicar más, pero para eso estamos.";
      }

      finalMessage.textContent = msg;
      resultBox.style.display = "block";
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function reviewAnswers() {
      reviewed = true;
      const cards = document.querySelectorAll(".question-card");

      cards.forEach((card, qIndex) => {
        const options = card.querySelectorAll(".option");
        options.forEach((option, oIndex) => {
          option.onclick = null;
          option.classList.remove("selected");

          if (oIndex === questions[qIndex].answer) {
            option.classList.add("correct");
          }

          if (userAnswers[qIndex] === oIndex && oIndex !== questions[qIndex].answer) {
            option.classList.add("incorrect");
          }
        });
      });

      alert("Ahora puedes revisar cuáles correctas e incorrectas tuviste.");
      resultBox.scrollIntoView({ behavior: "smooth" });
    }

    renderQuiz();
  </script>
</body>
</html>

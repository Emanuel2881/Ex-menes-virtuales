<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habilidad Numérica 1</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family: Arial;
  background: linear-gradient(135deg,#eff6ff,#dbeafe,#bfdbfe);
  color:#1e3a8a;
  padding:30px;
}

.container{
  max-width:950px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
}

.question{display:none;}
.question.active{display:block;}

.option{
  background:#dbeafe;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  cursor:pointer;
}

.option.selected{background:#2563eb;color:white;}
.option.correct-answer{background:#bbf7d0;}
.option.wrong-answer{background:#fecaca;}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.result{display:none;margin-top:20px;}
.review-item{margin:10px 0;padding:10px;background:#f1f5f9;border-left:5px solid gray;}
.correcta{border-left-color:green;}
.incorrecta{border-left-color:red;}
.sin-responder{border-left-color:orange;}
</style>
</head>

<body>

<div class="container">
<h1>🧠 Habilidad Numérica 1</h1>

<div id="quiz"></div>

<button onclick="finish()">Calificar</button>
<button onclick="resetExam()">Reiniciar</button>

<div class="result" id="resultado">
<h2>Resultado</h2>
<p id="score"></p>
<div id="review"></div>
</div>
</div>

<script>
const questions = [

{q:"F73 ÷ F3 = 11 ¿F?",o:["2","4","6","8","Ninguna"],a:1,exp:"F=4"},
{q:"3x−9x+10+9y+2x",o:["−6x+9y+10","−4x+9y+10","4x+9y+10","14xy+10","Ninguna"],a:1,exp:"Combina términos"},
{q:"3x²−8x+10",o:["Ya está simplificada","−5x+10","−5x²+10","−24x³+10","Ninguna"],a:0,exp:"No hay términos semejantes"},
{q:"5−12",o:["−12+5","12−5","−(5−12)","−(12+5)","Ninguna"],a:0,exp:"Equivalente"},
{q:"12−5",o:["−5+12","−(12−5)","−(5+12)","5−12","Ninguna"],a:0,exp:"7"},
{q:"−12−5",o:["−(12+5)","12−5","−12+5","5−12","Ninguna"],a:0,exp:"-17"},
{q:"P+P+1=7",o:["2","3","4","5","Ninguna"],a:1,exp:"2P+1=7 → P=3"},
{q:"2P+1=7",o:["2","3","4","6","Ninguna"],a:1,exp:"P=3"},
{q:"2P+1−1=7−1",o:["2","3","4","6","Ninguna"],a:1,exp:"P=3"},
{q:"2480739 ÷ 20",o:["124036.95","124036.5","248073.9","12403.695","Ninguna"],a:0,exp:"Dividir entre 20"},
{q:"2.48 a fracción",o:["248/100","248/10","248/1000","8/24","Ninguna"],a:0,exp:"Mover decimal"},
{q:"248×10",o:["248","2480","24.8","2.48","Ninguna"],a:1,exp:"Multiplicar por 10"},
{q:"2480739 ÷ 20",o:["124036.9","124036.95","248073.9","12403.69","Ninguna"],a:1,exp:"Correcto"},
{q:"2480734 ÷ 2",o:["124036","...","...","124037","Ninguna"],a:4,exp:"Error original"},
{q:"124036 + 20/9 decimal",o:["124036.09","124036.9","124036.95","124036.5","Ninguna"],a:2,exp:"≈124036.95"},
{q:"√36 × √4",o:["10","24","12","144","Ninguna"],a:2,exp:"6×2=12"},
{q:"(1/2−1/4)/(1/2+1/3)",o:["6/5","1/4","3/10","10/3","Ninguna"],a:2,exp:"Operar"},
{q:"2/3 + 2/7",o:["4/10","5","4/21","5/4","Ninguna"],a:1,exp:"≈1.04"},
{q:"1/2 × 1/3",o:["5/2","1/6","6/5","2/3","Ninguna"],a:1,exp:"Multiplicar"},
{q:"1/2 − 1/4",o:["1/4","1/2","2/6","1/8","Ninguna"],a:0,exp:"=1/4"},
{q:"3/4 + 2/5",o:["6/8","4/13","8/15","4/23","Ninguna"],a:1,exp:"=23/20"},
{q:"(1/3+1/4)-(1/3+3/2)",o:["1/25","-1/25","4/13","3/11","Ninguna"],a:1,exp:"Negativo"},
{q:"30% de 50% de 300",o:["150","90","45","30","Ninguna"],a:2,exp:"=45"},
{q:"500→30%→70%→10%",o:["10.5","15","105","150","Ninguna"],a:0,exp:"Paso a paso"},
{q:"523 ÷ 10",o:["5.23","52.3","5230","0.523","Ninguna"],a:1,exp:"Mover decimal"},
{q:"520 ÷ 20",o:["260","26","2.6","0.26","Ninguna"],a:1,exp:"=26"},
{q:"53.4 × 100",o:["53.400","534","5340","0.534","Ninguna"],a:2,exp:"Mover decimal"},
{q:"11K8 ÷ 47 = K4",o:["1","2","3","4","Ninguna"],a:1,exp:"K=2"},
{q:"−47K+110+K=18",o:["1","2","3","4","Ninguna"],a:1,exp:"K=2"},
{q:"4 es 10% de",o:["0.4","4","40","400","Ninguna"],a:2,exp:"=40"},
{q:"10x²+4y²+3x²−14y²",o:["13x²−10y²","13x²+18y²","7x²−10y²","17x²y²","Ninguna"],a:0,exp:"Combinar"},
{q:"6/8 = 6/N",o:["4","6","8","12","Ninguna"],a:2,exp:"N=8"},
{q:"2x²+6x=2x²+3x+5",o:["3/5","-3/5","5","0","Ninguna"],a:0,exp:"x=3/5"},
{q:"Mayor a 1",o:["1/5+3/4","3/2+3/8","1/8+1/3","9/5+1/4","Ninguna"],a:1,exp:"=1.875"},
{q:"2x+8=24",o:["6","8","12","16","Ninguna"],a:1,exp:"x=8"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
const div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls+=" selected";
if(done){
if(j===q.a) cls+=" correct-answer";
if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}
opts+=`<div class="option${cls}" onclick="select(${i},${j})">${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<button onclick="prev()">Anterior</button>
<button onclick="next()">Siguiente</button>
`;

quiz.appendChild(div);
});
}

function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}

function finish(){
done=true;
let correct=0;
let html="";

questions.forEach((q,i)=>{
const user=answers[i];

let estado="sin-responder";
if(user===q.a){correct++;estado="correcta";}
else if(user!==null){estado="incorrecta";}

html+=`<div class="review-item ${estado}">
<h4>Pregunta ${i+1}</h4>
<p>Correcta: ${q.o[q.a]}</p>
<div>${q.exp}</div>
</div>`;
});

document.getElementById("score").innerHTML=`${correct}/${questions.length}`;
document.getElementById("review").innerHTML=html;
document.getElementById("resultado").style.display="block";

render();
}

function resetExam(){
current=0;
answers=new Array(questions.length).fill(null);
done=false;
document.getElementById("resultado").style.display="none";
render();
}

render();
</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>
</body>
</html>

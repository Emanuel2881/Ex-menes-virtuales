<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 2</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#fdf2f8,#fce7f3,#fbcfe8);
color:#9d174d;
min-height:100vh;
padding:30px 15px;
}

.container{
max-width:950px;
margin:auto;
background:rgba(255,255,255,0.95);
padding:25px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:2.3rem;
color:#be185d;
margin-bottom:10px;
}

.stats-bar{
display:flex;
gap:12px;
justify-content:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.stat-box{
background:#fff;
border:1px solid #f9a8d4;
border-radius:14px;
padding:12px 18px;
min-width:150px;
text-align:center;
}

.question{
display:none;
background:#fdf2f8;
border:1px solid #f9a8d4;
border-radius:20px;
padding:20px;
}

.question.active{
display:block;
}

.option{
background:#fce7f3;
padding:12px;
margin:10px 0;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#fbcfe8;
}

.option.selected{
background:#db2777;
color:white;
}

.option.correct-answer{
background:#bbf7d0;
}

.option.wrong-answer{
background:#fecaca;
}

.navigation{
text-align:center;
margin-top:15px;
}

button{
border:none;
padding:10px 15px;
border-radius:10px;
margin:5px;
cursor:pointer;
}

.next{
background:#db2777;
color:white;
}

.prev{
background:#f9a8d4;
}

.finish{
background:#be185d;
color:white;
}

.actions{
text-align:center;
margin-top:20px;
}

.result{
display:none;
margin-top:20px;
padding:20px;
background:#fdf2f8;
border-radius:15px;
}

.review-item{
background:white;
padding:14px;
margin:12px 0;
border-left:5px solid gray;
border-radius:12px;
}

.correcta{
border-left-color:green;
}

.incorrecta{
border-left-color:red;
}

.sin-responder{
border-left-color:orange;
}

.explicacion{
margin-top:8px;
font-size:0.92rem;
color:#374151;
}

/* PANEL RANKING */

.ranking-panel{
position:fixed;
left:0;
top:0;
width:320px;
height:100vh;
background:white;
box-shadow:4px 0 20px rgba(0,0,0,0.1);
padding:20px;
overflow-y:auto;
z-index:999;
transition:transform 0.3s ease;
}

.ranking-panel.hidden{
transform:translateX(-100%);
}

.toggle-ranking{
position:fixed;
left:15px;
top:15px;
z-index:1000;
background:#db2777;
color:white;
border:none;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.ranking-content{
margin-top:60px;
}

@media(max-width:768px){

.ranking-panel{
width:260px;
}

.container{
padding:18px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧠 Habilidad Numérica 2</h1>
<p>Sucesiones y ecuaciones</p>
</div>

<div class="stats-bar">

<div class="stat-box">
<span>Pregunta</span><br>
<b id="qNum">1</b> / 20
</div>

<div class="stat-box">
<span>Progreso</span><br>
<b id="progress">0 / 20</b>
</div>

</div>

<div id="quiz"></div>

<div class="actions">
<button onclick="finish()">Calificar</button>
<button onclick="resetExam()">Reiniciar</button>
</div>

<div class="result" id="resultado">

<h2 style="margin-bottom:20px;">
Resultado Final
</h2>

<p id="score"></p>

<div id="review"></div>

</div>

</div>

<script>

const questions = [

{q:"Serie: 1, 3, 5, 7, 9, ?",o:["10","11","12","13","Ninguna"],a:1,exp:"+2"},
{q:"Serie: 5, 10, 30, 60, 180, 360, ?",o:["540","720","1080","1440","Ninguna"],a:2,exp:"×2,×3 alternado"},
{q:"Serie: 3, 10, 17, 24, 31, ?",o:["36","38","40","42","Ninguna"],a:1,exp:"+7"},
{q:"Serie: 2, 6, 18, 54, ?",o:["108","162","216","324","Ninguna"],a:1,exp:"×3"},
{q:"Serie: 1, 4, 16, 64, ?",o:["128","192","256","512","Ninguna"],a:2,exp:"×4"},
{q:"5 + x = 12",o:["5","6","7","8","Ninguna"],a:2,exp:"x=7"},
{q:"x - 7 = 38",o:["40","42","45","50","Ninguna"],a:1,exp:"x=45"},
{q:"24 ÷ y = 3",o:["6","7","8","9","Ninguna"],a:2,exp:"y=8"},
{q:"400 - x = 100",o:["200","250","300","350","Ninguna"],a:2,exp:"x=300"},
{q:"3x = 33",o:["9","10","11","12","Ninguna"],a:2,exp:"x=11"},
{q:"x + 14 = 62",o:["40","42","48","50","Ninguna"],a:2,exp:"x=48"},
{q:"100 - 76 = x",o:["20","22","24","26","Ninguna"],a:2,exp:"x=24"},
{q:"54 + y = 65",o:["9","10","11","12","Ninguna"],a:2,exp:"y=11"},
{q:"73x = 146",o:["1","2","3","4","Ninguna"],a:1,exp:"x=2"},
{q:"y ÷ 2 = 40",o:["60","70","80","90","Ninguna"],a:2,exp:"y=80"},
{q:"64 = 2x + 8",o:["24","26","28","30","Ninguna"],a:2,exp:"x=28"},
{q:"15 + x = 27",o:["10","11","12","13","Ninguna"],a:2,exp:"x=12"},
{q:"99 ÷ x = 9",o:["9","10","11","12","Ninguna"],a:2,exp:"x=11"},
{q:"2y + 1 = 17",o:["6","7","8","9","Ninguna"],a:2,exp:"y=8"},
{q:"280x = 28",o:["0.1","0.2","0.3","0.4","Ninguna"],a:0,exp:"x=0.1"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

const div=document.createElement("div");

div.className="question"+(i===current?" active":"");

let opts="";

q.o.forEach((op,j)=>{

let cls="";

if(answers[i]===j){

cls+=" selected";

}

if(done){

if(j===q.a){

cls+=" correct-answer";

}

if(answers[i]===j && j!==q.a){

cls+=" wrong-answer";

}

}

opts+=`

<div class="option${cls}" onclick="select(${i},${j})">
${op}
</div>

`;

});

div.innerHTML=`

<h3>${q.q}</h3>

${opts}

<div class="navigation">

<button class="prev"
onclick="prev()"
${i===0?"disabled":""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish" onclick="finish()">Finalizar</button>`

: `<button class="next" onclick="next()">Siguiente</button>`

}

</div>

`;

quiz.appendChild(div);

});

update();

}

function select(i,j){

if(done)return;

answers[i]=j;

render();

}

function next(){

if(answers[current]===null){

alert("Responde primero");

return;

}

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function prev(){

current--;

render();

}

function update(){

document.getElementById("qNum").textContent=current+1;

document.getElementById("progress").textContent=
answers.filter(a=>a!==null).length+" / "+questions.length;

}

function finish(){

done=true;

let correct=0;
let html="";



// CONTAR

questions.forEach((q,i)=>{

if(answers[i]===q.a){

correct++;

}

});



// PORCENTAJE

let porcentaje=Math.round(

(correct/questions.length)*100

);



// BOTS

const bots=[];

for(let i=1;i<=30;i++){

bots.push({

nombre:`Bot_${i}`,

nota:Math.floor(
Math.random()*71
)+30

});

}



// RANKING

const ranking=[

...bots,

{

nombre:"Tú",
nota:porcentaje,
usuario:true

}

];



ranking.sort(

(a,b)=>b.nota-a.nota

);



// PERCENTIL

let debajo=ranking.filter(

p=>porcentaje>p.nota

).length;



let iguales=ranking.filter(

p=>porcentaje===p.nota

).length;



let percentil=Math.round(

(

debajo+(0.5*iguales)

)

/ranking.length

*100

);



if(percentil<1){

percentil=1;

}

if(percentil>99){

percentil=99;

}



// NIVEL

let nivel="Muy bajo";

if(percentil>=90){

nivel="Excelente";

}

else if(percentil>=75){

nivel="Muy bueno";

}

else if(percentil>=60){

nivel="Bueno";

}

else if(percentil>=40){

nivel="Promedio";

}

else if(percentil>=20){

nivel="Bajo";

}



// REVIEW

questions.forEach((q,i)=>{

let estado="";

if(answers[i]===null){

estado="sin-responder";

}

else if(answers[i]===q.a){

estado="correcta";

}

else{

estado="incorrecta";

}



html+=`

<div class="review-item ${estado}">

<h3>
Pregunta ${i+1}
</h3>

<p style="margin-top:8px;">
${q.q}
</p>

<br>

<p>
<b>Tu respuesta:</b>

${
answers[i]!==null

?

q.o[answers[i]]

:

"Sin responder"

}
</p>

<p style="margin-top:6px;">
<b>Correcta:</b>

${q.o[q.a]}
</p>

<div class="explicacion">

${q.exp}

</div>

</div>

`;

});



// RANKING HTML

let rankingHTML="";

ranking.forEach((p,i)=>{

rankingHTML+=`

<div style="
display:flex;
justify-content:space-between;
padding:10px;
margin:6px 0;
background:${p.usuario ? "#fce7f3" : "white"};
border-radius:10px;
">

<span>
#${i+1} - ${p.nombre}
</span>

<span>
${p.nota}%
</span>

</div>

`;

});



// MOSTRAR

document.getElementById("score").innerHTML=

`

<button class="toggle-ranking" onclick="toggleRanking()">
☰ Ranking
</button>

<div id="rankingPanel" class="ranking-panel">

<div class="ranking-content">

<h3 style="margin-bottom:15px;">
🏆 Ranking General
</h3>

${rankingHTML}

</div>

</div>

<div style="
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
">

<h2>
${correct}/${questions.length}
</h2>

<p style="
font-size:26px;
font-weight:bold;
margin-top:10px;
color:#be185d;
">
${porcentaje}%
</p>

<div style="
display:flex;
flex-direction:column;
gap:12px;
margin-top:20px;
max-width:250px;
">

<div class="stat-box">
<span>Percentil</span><br>
<b>${percentil}%</b>
</div>

<div class="stat-box">
<span>Nivel</span><br>
<b>${nivel}</b>
</div>

</div>

</div>

`;



document.getElementById("review")
.innerHTML=html;



document.getElementById("resultado")
.style.display="block";



document.getElementById("resultado")
.scrollIntoView({

behavior:"smooth"

});



// PARTY

if(window.enviarResultadoFinal){

window.enviarResultadoFinal({

correctas:correct,
total:questions.length,
porcentaje

});

}



// REPINTAR

render();

}

function toggleRanking(){

document.getElementById("rankingPanel")
.classList.toggle("hidden");

}

function resetExam(){

current=0;

answers=new Array(questions.length).fill(null);

done=false;

document.getElementById("resultado")
.style.display="none";

render();

}

window.mostrarResultadosParty = function(data){

const ranking=[...data].sort((a,b)=>b.porcentaje-a.porcentaje);

let html=`<div class="party-grid">`;

ranking.forEach((j,i)=>{

let medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"";

html+=`

<div class="party-card">

<h3>
${medal} Jugador ${i+1}
</h3>

<p>
${j.correctas}/${j.total}
</p>

<p>
${j.porcentaje}%
</p>

</div>

`;

});

html+=`</div>`;

html+=`

<div class="party-winner">

🏆 Mejor:
${ranking[0].porcentaje}%

</div>

`;

document.getElementById("partyResultadoContenido")
.innerHTML=html;

document.getElementById("resultadoParty")
.style.display="block";

};

render();

</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen de Habilidad Numérica 2</title>

<style>
body{
  font-family: Arial;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
  background:rgba(255,255,255,0.08);
  padding:25px;
  border-radius:20px;
}

h1{text-align:center;margin-bottom:15px;}

.question{
  display:none;
  margin-bottom:20px;
}

.question.active{display:block;}

.option{
  background:rgba(255,255,255,0.1);
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  cursor:pointer;
}

.option.selected{background:#ffd54f;color:black;}

button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  margin-top:15px;
  cursor:pointer;
}

.next{background:#ffd54f;}
.prev{background:#90caf9;}
.finish{background:#66bb6a;color:white;}

.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🧠 Examen Numérica 2</h1>

<div class="top">
<div>Pregunta <span id="qNum">1</span>/31</div>
<div>Puntaje: <span id="score">0</span></div>
</div>

<div id="quiz"></div>

</div>

<script>

const questions = [

},

},
{

},
{
q:"¿Qué número sustituye a K? 11K8 ÷ 47 = K4",
o:["2","3","5","6","Ninguna"],
a:0
},
{
q:"4 = 10% de ___",
o:["0.4","4","40","400","Ninguna"],
a:2
},
{
q:"Simplifica: 16x² + 4y² + 3x²",
o:["19x²+4y²","23x²y²","19x+4y²","Ninguna","Otra"],
a:0
},
{
q:"8/12 = N/6 → N = ?",
o:["16","5","4","2","Ninguna"],
a:2
},
{
q:"¿Qué suma es mayor que 1?",
o:["1/5+3/4","2/3+3/8","8/12+1/3","5/8+1/4","Ninguna"],
a:1
},
{
q:"Serie: 100, 9, 64, 7, ?",

},
{
q:"Número divisible entre 2,4,7,21",
o:["1176","168","84","42","Ninguna"],
a:2
},
{
q:"Número divisible entre 3",
o:["766","768","769","976","Ninguna"],
a:1
},
{
q:"Serie: 2400,1200,600,300,?",
o:["0","100","150","200","Ninguna"],
a:2
},

// extra para completar nivel examen

{
q:"15/21 ÷ 7/3 =",
o:["15/49","5/3","15/7","15","Ninguna"],
a:0
},
{
q:"Resultado aproximado: (84.189×1.99)/6.889",
o:["28","24","20","16","Ninguna"],
a:1
},
{
q:"Simplifica: y + x + 7x − 6y",
o:["8x+5y","7x−6y","5y−8x","Ninguna","Otra"],
a:3
},
{
q:"Si 2x²+6x = 2x²+3x+5 → x=?",
o:["-2.5","-5/4","-1","0.6","Ninguna"],
a:4
},
{
q:"Resto de dividir 1000 entre 9",
o:["1","9","0","7","Ninguna"],
a:0
},
{
q:"Si x+3=11 → x=?",
o:["5","6","7","8","Ninguna"],
a:2
},
{
q:"20% de 250 =",
o:["20","25","50","75","Ninguna"],
a:2
},
{
q:"10×23 =",
o:["200","210","230","240","Ninguna"],
a:2
},
{
q:"8×4 =",
o:["24","28","32","36","Ninguna"],
a:2
},
{
q:"√49 =",
o:["5","6","7","8","Ninguna"],
a:2
},
{
q:"25% de 400 =",
o:["50","75","100","125","Ninguna"],
a:2
},
{
q:"Serie: 2,4,8,16,?",
o:["18","24","32","64","Ninguna"],
a:2
},
{
q:"15×3 =",
o:["30","35","45","50","Ninguna"],
a:2
},
{
q:"9×9 =",
o:["72","81","90","99","Ninguna"],
a:1
},
{
q:"100÷4 =",
o:["20","25","30","40","Ninguna"],
a:1
},
{
q:"12×12 =",
o:["124","144","154","164","Ninguna"],
a:1
},
{
q:"18×5 =",
o:["80","85","90","95","Ninguna"],
a:2
}

];

let current=0;
let answers=new Array(questions.length).fill(null);

const quiz=document.getElementById("quiz");

function render(){
quiz.innerHTML="";

questions.forEach((q,i)=>{
let div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
opts+=`<div class="option ${answers[i]===j?"selected":""}" onclick="select(${i},${j})">${String.fromCharCode(65+j)}. ${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<button class="prev" onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1?
`<button class="finish" onclick="finish()">Finalizar</button>`:
`<button class="next" onclick="next()">Siguiente</button>`}
`;

quiz.appendChild(div);
});

update();
}

function select(i,j){
answers[i]=j;
render();
}

function next(){current++;render();}
function prev(){current--;render();}

function update(){
document.getElementById("qNum").innerText=current+1;
let score=answers.reduce((acc,a,i)=>a===questions[i].a?acc+1:acc,0);
document.getElementById("score").innerText=score;
}

function finish(){
let score=answers.reduce((acc,a,i)=>a===questions[i].a?acc+1:acc,0);
alert("Tu puntaje: "+score+"/"+questions.length);
}

render();

</script>

</body>
</html>

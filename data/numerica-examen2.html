<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 2</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#fdf2f8,#fce7f3,#fbcfe8);
  color:#9d174d;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:2.3rem;color:#be185d;margin-bottom:10px;}

.stats-bar{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #f9a8d4;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.question{
  display:none;
  background:#fdf2f8;
  border:1px solid #f9a8d4;
  border-radius:20px;
  padding:20px;
}

.question.active{display:block;}

.option{
  background:#fce7f3;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
}

.option.selected{background:#db2777;color:white;}
.option.correct-answer{background:#bbf7d0;}
.option.wrong-answer{background:#fecaca;}

.navigation{text-align:center;margin-top:15px;}

button{
  border:none;
  padding:10px 15px;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
}

.actions{text-align:center;margin-top:20px;}

.result{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#fdf2f8;
  border-radius:15px;
}

.review-item{
  background:white;
  padding:10px;
  margin:10px 0;
  border-left:5px solid gray;
}

.correcta{border-left-color:green;}
.incorrecta{border-left-color:red;}
.sin-responder{border-left-color:orange;}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h1>🧠 Habilidad Numérica 2</h1>
    <p>Sucesiones y ecuaciones</p>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <span>Pregunta</span><br>
      <b id="qNum">1</b> / 20
    </div>
    <div class="stat-box">
      <span>Progreso</span><br>
      <b id="progress">0 / 20</b>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="actions">
    <button onclick="finish()">Calificar</button>
    <button onclick="resetExam()">Reiniciar</button>
  </div>

  <div class="result" id="resultado">
    <h2>Resultado</h2>
    <p id="score"></p>
    <div id="review"></div>
  </div>
</div>

<script>
const questions = [

{q:"Serie: 1, 3, 5, 7, 9, ?",o:["10","11","12","13","Ninguna"],a:1,exp:"+2"},
{q:"Serie: 5, 10, 30, 60, 180, 360, ?",o:["540","720","1080","1440","Ninguna"],a:2,exp:"×2,×3 alternado"},
{q:"Serie: 3, 10, 17, 24, 31, ?",o:["36","38","40","42","Ninguna"],a:1,exp:"+7"},
{q:"Serie: 2, 6, 18, 54, ?",o:["108","162","216","324","Ninguna"],a:1,exp:"×3"},
{q:"Serie: 1, 4, 16, 64, ?",o:["128","192","256","512","Ninguna"],a:2,exp:"×4"},
{q:"5 + x = 12",o:["5","6","7","8","Ninguna"],a:2,exp:"x=7"},
{q:"x - 7 = 38",o:["40","42","45","50","Ninguna"],a:1,exp:"x=45"},
{q:"24 ÷ y = 3",o:["6","7","8","9","Ninguna"],a:2,exp:"y=8"},
{q:"400 - x = 100",o:["200","250","300","350","Ninguna"],a:2,exp:"x=300"},
{q:"3x = 33",o:["9","10","11","12","Ninguna"],a:2,exp:"x=11"},
{q:"x + 14 = 62",o:["40","42","48","50","Ninguna"],a:2,exp:"x=48"},
{q:"100 - 76 = x",o:["20","22","24","26","Ninguna"],a:2,exp:"x=24"},
{q:"54 + y = 65",o:["9","10","11","12","Ninguna"],a:2,exp:"y=11"},
{q:"73x = 146",o:["1","2","3","4","Ninguna"],a:1,exp:"x=2"},
{q:"y ÷ 2 = 40",o:["60","70","80","90","Ninguna"],a:2,exp:"y=80"},
{q:"64 = 2x + 8",o:["24","26","28","30","Ninguna"],a:2,exp:"x=28"},
{q:"15 + x = 27",o:["10","11","12","13","Ninguna"],a:2,exp:"x=12"},
{q:"99 ÷ x = 9",o:["9","10","11","12","Ninguna"],a:0,exp:"x=11"},
{q:"2y + 1 = 17",o:["6","7","8","9","Ninguna"],a:2,exp:"y=8"},
{q:"280x = 28",o:["0.1","0.2","0.3","0.4","Ninguna"],a:0,exp:"x=0.1"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
const div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls+=" selected";
if(done){
if(j===q.a) cls+=" correct-answer";
if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}
opts+=`<div class="option${cls}" onclick="select(${i},${j})">${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<div class="navigation">
<button onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1
? `<button onclick="finish()">Finalizar</button>`
: `<button onclick="next()">Siguiente</button>`}
</div>`;

quiz.appendChild(div);
});

update();
}

function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}

function update(){
document.getElementById("qNum").textContent=current+1;
document.getElementById("progress").textContent=answers.filter(a=>a!==null).length+" / "+questions.length;
}

function finish(){
done=true;
let correct=0;
let html="";

questions.forEach((q,i)=>{
const user=answers[i];

let estado="sin-responder";
if(user===q.a){correct++;estado="correcta";}
else if(user!==null){estado="incorrecta";}

html+=`
<div class="review-item ${estado}">
<h4>Pregunta ${i+1}</h4>
<p><b>Correcta:</b> ${q.o[q.a]}</p>
</div>`;
});

document.getElementById("score").innerHTML=`${correct} / ${questions.length}`;
document.getElementById("review").innerHTML=html;
document.getElementById("resultado").style.display="block";

render();
}

function resetExam(){
current=0;
answers=new Array(questions.length).fill(null);
done=false;
document.getElementById("resultado").style.display="none";
render();
}

render();
</script>
  
<script // ===============================
// 🎮 MODO PARTY - COMPARADOR
// ===============================

window.mostrarResultadosParty = function(data){

  const contenedor = document.getElementById("partyResultadoContenido");
  if(!contenedor) return;

  // ordenar por porcentaje (mayor a menor)
  data.sort((a,b)=> b.porcentaje - a.porcentaje);

  let html = `<div class="party-grid">`;

  data.forEach((jugador,i)=>{
    let medalla = "";

    if(i === 0) medalla = "🥇";
    else if(i === 1) medalla = "🥈";
    else if(i === 2) medalla = "🥉";

    html += `
      <div class="party-card">
        <h3>${medalla} Jugador ${i+1}</h3>
        <p><strong>Puntaje:</strong> ${jugador.correctas}/${jugador.total}</p>
        <p><strong>Porcentaje:</strong> ${jugador.porcentaje}%</p>
      </div>
    `;
  });

  html += `</div>`;

  const ganador = data[0];

  html += `
    <div class="party-winner">
      🏆 Ganador: ${ganador.porcentaje}% de aciertos
    </div>
  `;

  contenedor.innerHTML = html;

  document.getElementById("resultadoParty").style.display = "block";
};
</script>
<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

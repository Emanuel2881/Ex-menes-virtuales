<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 5</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#fff7ed,#ffedd5,#fed7aa);
  color:#9a3412;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:2.3rem;color:#ea580c;margin-bottom:10px;}

.stats-bar{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #fdba74;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.question{
  display:none;
  background:#fff7ed;
  border:1px solid #fdba74;
  border-radius:20px;
  padding:20px;
}

.question.active{display:block;}

.option{
  background:#ffedd5;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
}

.option.selected{background:#ea580c;color:white;}
.option.correct-answer{background:#bbf7d0;}
.option.wrong-answer{background:#fecaca;}

.navigation{text-align:center;margin-top:15px;}

button{
  border:none;
  padding:10px 15px;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
}

.actions{text-align:center;margin-top:20px;}

.result{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#fff7ed;
  border-radius:15px;
}

.review-item{
  background:white;
  padding:10px;
  margin:10px 0;
  border-left:5px solid gray;
}

.correcta{border-left-color:green;}
.incorrecta{border-left-color:red;}
.sin-responder{border-left-color:orange;}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h1>🧠 Habilidad Numérica 5</h1>
    <p>Relaciones y patrones numéricos</p>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <span>Pregunta</span><br>
      <b id="qNum">1</b> / 20
    </div>
    <div class="stat-box">
      <span>Progreso</span><br>
      <b id="progress">0 / 20</b>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="actions">
    <button onclick="finish()">Calificar</button>
    <button onclick="resetExam()">Reiniciar</button>
  </div>

  <div class="result" id="resultado">
    <h2>Resultado</h2>
    <p id="score"></p>
    <div id="review"></div>
  </div>
</div>

<script>
const questions = [

{q:"2 es a 4 como 3 es a ?",o:["5","6","7","8","Ninguna"],a:1,exp:"Se multiplica por 2: 3 × 2 = 6"},
{q:"10 es a 5 como 20 es a ?",o:["5","10","15","20","Ninguna"],a:1,exp:"Se divide entre 2: 20 ÷ 2 = 10"},
{q:"5 es a 25 como 6 es a ?",o:["30","31","36","40","Ninguna"],a:2,exp:"Se eleva al cuadrado: 6² = 36"},
{q:"8 es a 4 como 16 es a ?",o:["6","8","10","12","Ninguna"],a:1,exp:"Se divide entre 2: 16 ÷ 2 = 8"},
{q:"3 es a 9 como 4 es a ?",o:["12","13","14","16","Ninguna"],a:0,exp:"Se multiplica por 3: 4 × 3 = 12"},
{q:"7 es a 14 como 9 es a ?",o:["16","17","18","19","Ninguna"],a:2,exp:"Se multiplica por 2: 9 × 2 = 18"},
{q:"100 es a 50 como 60 es a ?",o:["20","25","30","35","Ninguna"],a:2,exp:"Se divide entre 2: 60 ÷ 2 = 30"},
{q:"4 es a 16 como 5 es a ?",o:["20","21","25","30","Ninguna"],a:2,exp:"Se eleva al cuadrado: 5² = 25"},
{q:"9 es a 3 como 81 es a ?",o:["9","12","18","27","Ninguna"],a:0,exp:"Se divide entre 3: 81 ÷ 9 = 9"},
{q:"6 es a 36 como 7 es a ?",o:["42","43","49","56","Ninguna"],a:2,exp:"Se eleva al cuadrado: 7² = 49"},
{q:"12 es a 6 como 18 es a ?",o:["8","9","10","12","Ninguna"],a:1,exp:"Se divide entre 2: 18 ÷ 2 = 9"},
{q:"15 es a 45 como 20 es a ?",o:["50","55","60","65","Ninguna"],a:2,exp:"Se multiplica por 3: 20 × 3 = 60"},
{q:"2 es a 8 como 3 es a ?",o:["9","12","15","18","Ninguna"],a:1,exp:"Se multiplica por 4: 3 × 4 = 12"},
{q:"5 es a 10 como 7 es a ?",o:["12","13","14","15","Ninguna"],a:2,exp:"Se multiplica por 2: 7 × 2 = 14"},
{q:"8 es a 64 como 6 es a ?",o:["30","32","34","36","Ninguna"],a:3,exp:"Se eleva al cuadrado: 6² = 36"},
{q:"7 es a 21 como 9 es a ?",o:["25","27","29","30","Ninguna"],a:1,exp:"Se multiplica por 3: 9 × 3 = 27"},
{q:"10 es a 100 como 12 es a ?",o:["120","124","144","150","Ninguna"],a:2,exp:"Se eleva al cuadrado: 12² = 144"},
{q:"3 es a 27 como 4 es a ?",o:["64","81","32","48","Ninguna"],a:0,exp:"Se eleva al cubo: 4³ = 64"},
{q:"6 es a 3 como 15 es a ?",o:["5","6","7","8","Ninguna"],a:0,exp:"Se divide entre 2: 15 ÷ 3 = 5"},
{q:"20 es a 4 como 30 es a ?",o:["5","6","7","8","Ninguna"],a:1,exp:"Se divide entre 5: 30 ÷ 5 = 6"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
const div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls+=" selected";
if(done){
if(j===q.a) cls+=" correct-answer";
if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}
opts+=`<div class="option${cls}" onclick="select(${i},${j})">${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<div class="navigation">
<button onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1
? `<button onclick="finish()">Finalizar</button>`
: `<button onclick="next()">Siguiente</button>`}
</div>`;

quiz.appendChild(div);
});

update();
}

function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}

function update(){
document.getElementById("qNum").textContent=current+1;
document.getElementById("progress").textContent=answers.filter(a=>a!==null).length+" / "+questions.length;
}

function finish(){
done=true;
let correct=0;
let html="";

questions.forEach((q,i)=>{
const user=answers[i];

let estado="sin-responder";
if(user===q.a){correct++;estado="correcta";}
else if(user!==null){estado="incorrecta";}

html+=`
<div class="review-item ${estado}">
<h4>Pregunta ${i+1}</h4>
<p><b>Correcta:</b> ${q.o[q.a]}</p>
<div class="explicacion">${q.exp}</div>
</div>`;
});

document.getElementById("score").innerHTML=`${correct} / ${questions.length}`;
document.getElementById("review").innerHTML=html;
document.getElementById("resultado").style.display="block";

render();
}

function resetExam(){
current=0;
answers=new Array(questions.length).fill(null);
done=false;
document.getElementById("resultado").style.display="none";
render();
}

render();
</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

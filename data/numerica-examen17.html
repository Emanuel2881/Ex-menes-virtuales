}

.prev{

}

.finish{

.actions{
text-align:center;
margin-top:20px;
}

.result{

padding:20px;
background:#ecfeff;
border-radius:15px;
}

.review-item{

padding:14px;

.correcta{

.incorrecta{

.explicacion{

/* PANEL RANKING */

left:0;
top:0;

height:100vh;
background:white;

padding:20px;
overflow-y:auto;
z-index:999;
transition:transform 0.3s ease;
}

.ranking-panel.hidden{
transform:translateX(-100%);

.toggle-ranking{
position:fixed;
left:15px;
top:15px;
z-index:1000;
background:#0891b2;
color:white;
border:none;
padding:10px 15px;
border-radius:12px;
cursor:pointer;

}

.ranking-content{
margin-top:60px;

@media(max-width:768px){

.container{
padding:18px;

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

const div=document.createElement("div");

div.className="question"+(i===current?" active":"");

let opts="";

q.o.forEach((op,j)=>{

let cls="";

if(answers[i]===j){

cls+=" selected";

}

if(done){

if(j===q.a){

cls+=" correct-answer";

}

if(answers[i]===j && j!==q.a){

cls+=" wrong-answer";

}

}

opts+=`

<div class="option${cls}" onclick="select(${i},${j})">
${op}
</div>

`;

});

div.innerHTML=`

<h3>${q.q}</h3>

${opts}

<div class="navigation">

<button class="prev"
onclick="prev()"
${i===0?"disabled":""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish" onclick="finish()">Finalizar</button>`

: `<button class="next" onclick="next()">Siguiente</button>`

}

</div>

`;

quiz.appendChild(div);

});

update();

}

function select(i,j){

if(done)return;

answers[i]=j;

render();

}

function next(){

if(answers[current]===null){

alert("Responde primero");

return;

}

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function prev(){

current--;

render();

}

function update(){

document.getElementById("qNum").textContent=current+1;

document.getElementById("progress").textContent=
answers.filter(a=>a!==null).length+" / "+questions.length;

}

function finish(){

done=true;

let correct=0;
let html="";



// CONTAR

questions.forEach((q,i)=>{

if(answers[i]===q.a){

correct++;

}

});



// PORCENTAJE

let porcentaje=Math.round(

(correct/questions.length)*100

);



// BOTS

const bots=[];

for(let i=1;i<=30;i++){

bots.push({

nombre:`Bot_${i}`,

nota:Math.floor(
Math.random()*71
)+30

});

}



// RANKING

const ranking=[

...bots,

{

nombre:"Tú",
nota:porcentaje,
usuario:true

}

];



ranking.sort(

(a,b)=>b.nota-a.nota

);



// PERCENTIL

let debajo=ranking.filter(

p=>porcentaje>p.nota

).length;



let iguales=ranking.filter(

p=>porcentaje===p.nota

).length;



let percentil=Math.round(

(

debajo+(0.5*iguales)

)

/ranking.length

*100

);



if(percentil<1){

percentil=1;

}

if(percentil>99){

percentil=99;

}



// NIVEL

let nivel="Muy bajo";

if(percentil>=90){

nivel="Excelente";

}

else if(percentil>=75){

nivel="Muy bueno";

}

else if(percentil>=60){

nivel="Bueno";

}

else if(percentil>=40){

nivel="Promedio";

}

else if(percentil>=20){

nivel="Bajo";

}



// REVIEW

questions.forEach((q,i)=>{

let estado="";

if(answers[i]===null){

estado="sin-responder";

}

else if(answers[i]===q.a){

estado="correcta";

}

else{

estado="incorrecta";

}



html+=`

<div class="review-item ${estado}">

<h3>
Pregunta ${i+1}
</h3>

<p style="margin-top:8px;">
${q.q}
</p>

<br>

<p>
<b>Tu respuesta:</b>

${
answers[i]!==null

?

q.o[answers[i]]

:

"Sin responder"

}
</p>

<p style="margin-top:6px;">
<b>Correcta:</b>

${q.o[q.a]}
</p>

<div class="explicacion">

${q.exp}

</div>

</div>

`;

});



// RANKING HTML

let rankingHTML="";

ranking.forEach((p,i)=>{

rankingHTML+=`

<div style="
display:flex;
justify-content:space-between;
padding:10px;
margin:6px 0;
background:${p.usuario ? "#cffafe" : "white"};
border-radius:10px;
">

<span>
#${i+1} - ${p.nombre}
</span>

<span>
${p.nota}%
</span>

</div>

`;

});



// MOSTRAR

document.getElementById("score").innerHTML=

`

<button class="toggle-ranking" onclick="toggleRanking()">
☰ Ranking
</button>

<div id="rankingPanel" class="ranking-panel">

<div class="ranking-content">

<h3 style="margin-bottom:15px;">
🏆 Ranking General
</h3>

</div>

</div>

<div style="

padding:20px;

margin-bottom:20px;
">

<h2>
${correct}/${questions.length}
</h2>

<p style="
font-size:26px;
font-weight:bold;
margin-top:10px;
color:#0891b2;
">
${porcentaje}%
</p>

<div style="
display:flex;
flex-direction:column;
gap:12px;
margin-top:20px;
max-width:250px;
">

<div class="stat-box">
<span>Percentil</span><br>
<b>${percentil}%</b>
</div>

<div class="stat-box">
<span>Nivel</span><br>
<b>${nivel}</b>
</div>

</div>

</div>

`;



document.getElementById("review")
.innerHTML=html;



document.getElementById("resultado")
.style.display="block";



document.getElementById("resultado")
.scrollIntoView({

behavior:"smooth"

});



// PARTY

if(window.enviarResultadoFinal){

window.enviarResultadoFinal({

correctas:correct,
total:questions.length,
porcentaje

});

}



// REPINTAR

render();

}

function toggleRanking(){

document.getElementById("rankingPanel")
.classList.toggle("hidden");

}

function resetExam(){

current=0;

answers=new Array(questions.length).fill(null);

done=false;

document.getElementById("resultado")
.style.display="none";

render();

}

render();

</script>

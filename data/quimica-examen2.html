  const respuestasCorrectas = {

  const textosCorrectos = {

    q21:"C. 2H₂ + O₂ → 2H₂O",
    q22:"B. El carbono se oxida y el hierro se reduce",
    q23:"C. Reducción",
    q24:"D. Oxidación",
    q25:"B. Ácido clorhídrico",
    q26:"D. Comidas picantes",
    q27:"B. Electrón de valencia",

  const explicaciones = {
    q1:"La masa y el volumen dependen de cuánta materia hay, por eso son propiedades extensivas.",
    q2:"El cambio de sólido a líquido por efecto del calor se llama fusión.",
    q3:"El agua está formada por dos elementos distintos, hidrógeno y oxígeno, así que es un compuesto.",
    q4:"Si está formado por átomos de una sola especie, se considera un elemento.",
    q5:"La unidad más pequeña que conserva las propiedades de un elemento es el átomo.",
    q6:"Cuando dos no metales comparten electrones forman un enlace covalente.",
    q7:"Metal + no metal normalmente forma un enlace iónico por transferencia de electrones.",
    q8:"Los fertilizantes aportan nutrientes químicos que ayudan al crecimiento de las plantas.",
    q9:"Si se percibe con los sentidos y no se mide numéricamente, es una propiedad cualitativa.",
    q10:"Los elementos químicos están organizados por número atómico creciente en la tabla periódica.",
    q11:"Los halógenos tienen 7 electrones de valencia, por eso pertenecen al mismo grupo.",
    q12:"Los bioelementos principales de los seres vivos son C, H, O, N, P y S.",
    q13:"Los electrones son las partículas que participan directamente en los enlaces químicos.",
    q14:"La valencia indica la capacidad de combinación de un átomo con otros elementos.",
    q15:"El enlace que mantiene unidos a los metales entre sí es el enlace metálico.",
    q16:"Los electrones de la última capa se llaman electrones de valencia.",
    q17:"Los materiales conductores tienen electrones libres o móviles en su estructura.",
    q18:"Con col morada, el color verde suele indicar una disolución básica.",
    q19:"Toda ecuación química tiene reactivos al inicio y productos al final.",
    q20:"Si una reacción libera calor o luz, se clasifica como exotérmica.",
    q21:"La ecuación correcta debe tener el mismo número de átomos de cada elemento en ambos lados.",
    q22:"En esa reacción el carbono pasa a CO₂, así que se oxida, mientras el hierro se reduce al quedar libre.",
    q23:"Ganar electrones es reducción.",
    q24:"Perder electrones es oxidación.",
    q25:"El principal ácido del jugo gástrico es el ácido clorhídrico.",
    q26:"Las comidas picantes suelen provocar acidez con más frecuencia.",
    q27:"El electrón ubicado en el nivel principal más alto es un electrón de valencia.",
    q28:"Cambio de olor, color y textura al hornear indica formación de nuevas sustancias, o sea un cambio químico.",
    q29:"En tu clave original la correcta está marcada como cambio del color, así la dejé para que coincida con tu examen.",
    q30:"El elemento con 13 protones es el aluminio, símbolo Al."
  };

  let examenIniciado = false;
  let examenFinalizado = false;

  function actualizarProgreso() {
    const total = Object.keys(respuestasCorrectas).length;
    const respondidas = document.querySelectorAll('input[type="radio"]:checked').length;
    document.getElementById("progress").textContent = `${respondidas} / ${total}`;
  }

  function bloquearExamen(estado) {
    const form = document.getElementById("quizForm");
    const inputs = form.querySelectorAll('input[type="radio"]');
    const botones = form.querySelectorAll("button");

    if (estado) {
      form.classList.add("bloqueado");
    } else {
      form.classList.remove("bloqueado");
    }

    inputs.forEach(input => {
      input.disabled = estado;
    });

    botones.forEach(btn => {
      if (!btn.classList.contains("btn-secondary")) {
        btn.disabled = estado;
      }
    });
  }

  function iniciarExamen() {
    if (examenFinalizado) return;

    examenIniciado = true;

    document.getElementById("setupMsg").textContent = "Examen en curso.";
    const botonInicio = document.querySelector(".btn-start");
    botonInicio.disabled = true;
    botonInicio.textContent = "Examen en curso";

    bloquearExamen(false);
    actualizarProgreso();
  }

  function limpiarEstadosVisuales() {
    document.querySelectorAll(".question").forEach(q => {
      q.classList.remove("correcta", "incorrecta", "sin-responder");
    });
  }

  function calificarExamen() {
    if (!examenIniciado) {
      document.getElementById("setupMsg").textContent = "Primero debes presionar “Iniciar examen”.";
      return;
    }

    if (examenFinalizado) return;

    examenFinalizado = true;

    let total = Object.keys(respuestasCorrectas).length;
    let correctas = 0;
    let incorrectas = 0;
    let sinResponder = 0;
    let respondidas = 0;
    let revisionHTML = "";

    limpiarEstadosVisuales();

    for (let pregunta in respuestasCorrectas) {
      const seleccionada = document.querySelector(`input[name="${pregunta}"]:checked`);
      const primerInput = document.querySelector(`input[name="${pregunta}"]`);
      const bloquePregunta = primerInput.closest(".question");
      const numero = pregunta.replace("q", "");

      if (seleccionada) {
        respondidas++;
        const textoMarcado = seleccionada.parentElement.textContent.trim();

        if (seleccionada.value === respuestasCorrectas[pregunta]) {
          correctas++;
          bloquePregunta.classList.add("correcta");

          revisionHTML += `
            <div class="review-item correcta">
              <h4>Pregunta ${numero}: ✅ Correcta</h4>
              <p><strong>Tu respuesta:</strong> ${textoMarcado}</p>
              <div class="explicacion"><strong>Retroalimentación:</strong> ${explicaciones[pregunta]}</div>
            </div>
          `;
        } else {
          incorrectas++;
          bloquePregunta.classList.add("incorrecta");

          revisionHTML += `
            <div class="review-item incorrecta">
              <h4>Pregunta ${numero}: ❌ Incorrecta</h4>
              <p><strong>Tu respuesta:</strong> ${textoMarcado}</p>
              <p><strong>Respuesta correcta:</strong> ${textosCorrectos[pregunta]}</p>
              <div class="explicacion"><strong>Retroalimentación:</strong> ${explicaciones[pregunta]}</div>
            </div>
          `;
        }
      } else {
        sinResponder++;
        bloquePregunta.classList.add("sin-responder");

        revisionHTML += `
          <div class="review-item sin-responder">
            <h4>Pregunta ${numero}: ⚠️ Sin responder</h4>
            <p><strong>Respuesta correcta:</strong> ${textosCorrectos[pregunta]}</p>
            <div class="explicacion"><strong>Retroalimentación:</strong> ${explicaciones[pregunta]}</div>
          </div>
        `;
      }
    }

    const porcentaje = ((correctas / total) * 100).toFixed(1);

    if (typeof window.enviarResultadoFinal === "function") {
      window.enviarResultadoFinal({
        correctas,
        incorrectas,
        sinResponder,
        total,
        porcentaje: Number(porcentaje)
      });
    }

    document.getElementById("puntajeTexto").innerHTML = `
      Respondiste <strong>${respondidas}</strong> de <strong>${total}</strong> preguntas.<br>
      Obtuviste <strong>${correctas}</strong> correctas de <strong>${total}</strong>.<br>
      Tu nota fue: <strong>${porcentaje}%</strong>
    `;

    document.getElementById("revision").innerHTML = `
      <div class="review-summary">
        <div class="summary-box">
          <h4>Correctas</h4>
          <p>${correctas}</p>
        </div>
        <div class="summary-box">
          <h4>Incorrectas</h4>
          <p>${incorrectas}</p>
        </div>
        <div class="summary-box">
          <h4>Sin responder</h4>
          <p>${sinResponder}</p>
        </div>
      </div>
      ${revisionHTML}
    `;

    document.getElementById("resultado").style.display = "block";
    document.getElementById("resultado").scrollIntoView({ behavior: "smooth" });

    bloquearExamen(true);
    document.querySelector(".btn-secondary").disabled = false;
  }

  function reiniciarExamen() {
    document.getElementById("quizForm").reset();
    document.getElementById("resultado").style.display = "none";
    document.getElementById("resultadoParty").style.display = "none";
    document.getElementById("revision").innerHTML = "";
    document.getElementById("puntajeTexto").innerHTML = "";
    document.getElementById("setupMsg").textContent = "Presiona “Iniciar examen” para comenzar.";

    const botonInicio = document.querySelector(".btn-start");
    botonInicio.disabled = false;
    botonInicio.textContent = "Iniciar examen";

    examenIniciado = false;
    examenFinalizado = false;

    actualizarProgreso();
    limpiarEstadosVisuales();
    bloquearExamen(true);

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  document.querySelectorAll('input[type="radio"]').forEach(input => {
    input.addEventListener("change", actualizarProgreso);
  });

  window.addEventListener("load", () => {
    actualizarProgreso();
    bloquearExamen(true);
  });
</script>

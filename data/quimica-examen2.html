<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Química - Examen 2</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #ecfeff, #f0f9ff, #cffafe);
  color:#0f172a;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:1000px;
  margin:0 auto;
  background:#ffffff;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
  overflow:hidden;
}

.header{
  background: linear-gradient(135deg, #0891b2, #06b6d4);
  color:white;
  padding:30px 25px;
  text-align:center;
}

.header h1{
  font-size: clamp(1.9rem, 4vw, 2.8rem);
  margin-bottom:10px;
}

.header p{
  opacity:0.95;
}

.top-link{
  display:inline-block;
  margin-top:12px;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.content{
  padding:25px;
}

.stats-bar{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.stat-box{
  background:#f8feff;
  border:1px solid #bae6fd;
  border-radius:16px;
  padding:12px 18px;
  min-width:180px;
  text-align:center;
}

.stat-label{
  display:block;
  color:#0f766e;
  margin-bottom:5px;
}

.stat-value{
  font-size:1.1rem;
  font-weight:bold;
}

.question{
  background:#f8feff;
  border:1px solid #bae6fd;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
}

.question h3{
  font-size:1.05rem;
  line-height:1.5;
  margin-bottom:14px;
  color:#0f766e;
}

.option{
  display:block;
  margin:10px 0;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s ease;
  border:1px solid transparent;
  background:white;
}

.option:hover{
  background:#ecfeff;
  border-color:#67e8f9;
}

.option input{
  margin-right:10px;
  accent-color:#06b6d4;
}

.buttons{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-top:25px;
}

button{
  border:none;
  border-radius:14px;
  padding:13px 22px;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

.btn-primary{
  background:#0891b2;
  color:white;
}

.btn-secondary{
  background:#cffafe;
  color:#0f766e;
}

.result{
  margin-top:25px;
  padding:20px;
  border-radius:18px;
  background:#f0fdfa;
  border:1px solid #99f6e4;
  display:none;
}

.review-item{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

.explicacion{
  margin-top:10px;
  background:#f8fafc;
  padding:10px;
  border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧪 Química - Examen 2</h1>
<p>Propiedades, enlaces y reacciones químicas</p>

<a class="top-link" href="../quimica.html">
← Volver a química
</a>
</div>

<div class="content">

<div class="stats-bar">

<div class="stat-box">
<span class="stat-label">Preguntas</span>
<span class="stat-value">20</span>
</div>

<div class="stat-box">
<span class="stat-label">Progreso</span>
<span class="stat-value" id="progress">0 / 20</span>
</div>

</div>

<form id="quizForm">

<div id="quiz"></div>

<div class="buttons">

<button type="button"
class="btn-primary"
onclick="calificarExamen()">
Calificar examen
</button>

<button type="button"
class="btn-secondary"
onclick="reiniciarExamen()">
Reiniciar
</button>

</div>

<div class="result" id="resultado">

<h2>Resultado</h2>

<p id="puntajeTexto"></p>

<div id="revision"></div>

</div>

</form>

</div>

</div>

<script>

const questions = [

{
q:"¿Cuál es una propiedad extensiva?",
o:["Densidad","Masa y volumen","Color","Punto de ebullición"],
a:1,
exp:"La masa y volumen dependen de la cantidad de materia."
},

{
q:"¿Cómo se llama el paso de sólido a líquido?",
o:["Evaporación","Condensación","Sublimación","Fusión"],
a:3,
exp:"Ese cambio de estado se llama fusión."
},

{
q:"El agua es un:",
o:["Compuesto","Elemento","Átomo","Ion"],
a:0,
exp:"Está formada por hidrógeno y oxígeno."
},

{
q:"Una sustancia formada por un solo tipo de átomo es:",
o:["Elemento","Compuesto","Mezcla","Solución"],
a:0,
exp:"Eso define a un elemento."
},

{
q:"La unidad más pequeña de un elemento es:",
o:["Átomo","Mol","Protón","Neutrón"],
a:0,
exp:"El átomo conserva propiedades del elemento."
},

{
q:"Entre dos no metales se forma enlace:",
o:["Iónico","Covalente","Metálico","Nuclear"],
a:1,
exp:"Comparten electrones."
},

{
q:"Metal + no metal produce enlace:",
o:["Metálico","Covalente","Polar","Iónico"],
a:3,
exp:"Hay transferencia de electrones."
},

{
q:"Los fertilizantes sirven para:",
o:["Dar color","Secar plantas","Aportar nutrientes","Eliminar minerales"],
a:2,
exp:"Ayudan al crecimiento vegetal."
},

{
q:"Una propiedad percibida con sentidos es:",
o:["Extensiva","Cuantitativa","Propiedad cualitativa","Numérica"],
a:2,
exp:"No requiere medición."
},

{
q:"Los elementos se organizan en:",
o:["Lista química","Sistema orbital","Tabla periódica","Configuración"],
a:2,
exp:"La tabla periódica los ordena."
},

{
q:"Los halógenos tienen:",
o:["1 electrón","2 electrones","7 electrones de valencia","8 protones"],
a:2,
exp:"Pertenecen al grupo 17."
},

{
q:"Los bioelementos principales son:",
o:["Na y Cl","Ca y Mg","C, H, O, N, P, S","K y Fe"],
a:2,
exp:"Son esenciales para vida."
},

{
q:"¿Qué partículas participan en enlaces?",
o:["Protones","Electrones","Neutrones","Núcleos"],
a:1,
exp:"Los electrones participan directamente."
},

{
q:"La valencia indica:",
o:["Peso","Volumen","Capacidad de combinación","Número de neutrones"],
a:2,
exp:"Indica cómo se combina un átomo."
},

{
q:"Entre metales existe enlace:",
o:["Iónico","Covalente","Metálico","Polar"],
a:2,
exp:"Comparten electrones móviles."
},

{
q:"Los electrones externos se llaman:",
o:["Internos","De valencia","Neutrones","Orbitales"],
a:1,
exp:"Participan en reacciones."
},

{
q:"Los conductores eléctricos:",
o:["Tienen electrones libres","No tienen protones","Son líquidos","Son neutros"],
a:0,
exp:"Los electrones móviles conducen electricidad."
},

{
q:"Con col morada, verde indica solución:",
o:["Ácida","Neutra","Transparente","Básica"],
a:3,
exp:"El verde indica base."
},

{
q:"Una ecuación química contiene:",
o:["Solo productos","Solo reactivos","Reactivos y productos","Solo números"],
a:2,
exp:"Toda reacción tiene ambos."
},

{
q:"Una reacción que libera calor es:",
o:["Exotérmica","Endotérmica","Nuclear","Reversible"],
a:0,
exp:"Libera energía."
}

];

let answers = new Array(questions.length).fill(null);

const quiz = document.getElementById("quiz");

function actualizarProgreso(){

const respondidas =
answers.filter(a=>a!==null).length;

document.getElementById("progress").textContent =
`${respondidas} / ${questions.length}`;

}

function render(){

quiz.innerHTML = "";

questions.forEach((q,i)=>{

let opciones = "";

q.o.forEach((op,j)=>{

opciones += `
<label class="option">

<input type="radio"
name="q${i}"
value="${j}"
${answers[i]===j ? "checked" : ""}
onchange="selectOption(${i},${j})">

${String.fromCharCode(65+j)}. ${op}

</label>
`;

});

quiz.innerHTML += `

<div class="question">

<h3>${i+1}. ${q.q}</h3>

${opciones}

</div>

`;

});

actualizarProgreso();

}

function selectOption(i,j){

answers[i] = j;

actualizarProgreso();

}

function calificarExamen(){

let correctas = 0;

let revisionHTML = "";

questions.forEach((q,i)=>{

if(answers[i] === q.a){

correctas++;

revisionHTML += `
<div class="review-item">

<h4>
Pregunta ${i+1}: ✅ Correcta
</h4>

<div class="explicacion">
${q.exp}
</div>

</div>
`;

}else{

revisionHTML += `
<div class="review-item">

<h4>
Pregunta ${i+1}: ❌ Incorrecta
</h4>

<p>
<strong>Respuesta correcta:</strong>
${q.o[q.a]}
</p>

<div class="explicacion">
${q.exp}
</div>

</div>
`;

}

});

const porcentaje =
((correctas/questions.length)*100)
.toFixed(1);

document.getElementById("puntajeTexto")
.innerHTML = `

Obtuviste
<strong>${correctas}</strong>

de

<strong>${questions.length}</strong>

correctas.<br>

Nota final:
<strong>${porcentaje}%</strong>

`;

document.getElementById("revision")
.innerHTML = revisionHTML;

document.getElementById("resultado")
.style.display = "block";

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

function reiniciarExamen(){

location.reload();

}

render();

</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

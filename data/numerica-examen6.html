<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Numérica 6</title>

<style>
body{
  font-family: Arial;
  background: linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  color:white;
  padding:20px;
}
.container{
  max-width:900px;
  margin:auto;
  background:rgba(255,255,255,0.08);
  padding:25px;
  border-radius:20px;
}
.question{display:none;}
.question.active{display:block;}

.option{
  background:rgba(255,255,255,0.1);
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  cursor:pointer;
}
.option.selected{
  background:#ffd54f;
  color:black;
}

button{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.next{background:#ffd54f;}
.prev{background:#90caf9;}
.finish{background:#66bb6a;color:white;}

.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}
</style>
</head>

<body>

<div class="container">
<h1>🧠 Examen Numérica 6</h1>

<div class="top">
<div>Pregunta <span id="qNum">1</span>/15</div>
<div>Puntaje: <span id="score">0</span></div>
</div>

<div id="quiz"></div>

</div>

<script>

const questions = [

{
q:"¿Qué cifra reemplaza a F en: F73 ÷ F3 = 11?",
o:["9","8","6","4","Ninguna"],
a:3
},
{
q:"¿Cuál es el resto de dividir 2,480,739 entre 20?",
o:["1","9","29","39","Ninguna"],
a:4
},
{
q:"¿Qué número sustituye a L? 4/L = L/36",
o:["3","9","12","18","Ninguna"],
a:2
},
{
q:"¿Qué número sustituye a N? 8/12 = N/6",
o:["16","5","4","2","Ninguna"],
a:2
},
{
q:"¿Qué suma es mayor que 1?",
o:["1/5 + 3/4","2/3 + 3/8","8/12 + 1/3","5/8 + 1/4","Ninguna"],
a:1
},
{
q:"Serie: 100, 9, 64, 7, ?",
o:["5","36","49","8","Ninguna"],
a:2
},
{
q:"Número más pequeño divisible entre 2, 4, 7 y 21",
o:["1176","168","84","42","Ninguna"],
a:2
},
{
q:"Número divisible entre 3",
o:["766","768","796","976","Ninguna"],
a:1
},
{
q:"(15/21) ÷ (7/3) =",
o:["15/49","5/3","15/7","15","Ninguna"],
a:0
},
{
q:"4 = 10% de ___",
o:["0.4","4","40","400","Ninguna"],
a:2
},
{
q:"El 30% del 50% de 300 es:",
o:["150","90","50","45","Ninguna"],
a:3
},
{
q:"Serie: 2400,1200,600,300,?",
o:["0","100","150","200","Ninguna"],
a:2
},
{
q:"¿Qué número sigue? 3,6,12,24,48,?",
o:["60","72","96","108","Ninguna"],
a:2
},
{
q:"¿Qué número falta? 81,27,9,?,1",
o:["5","4","3","6","Ninguna"],
a:2
},
{
q:"¿Qué valor satisface x + 3 = 11?",
o:["5","6","7","8","Ninguna"],
a:2
}

];

let current=0;
let answers=new Array(questions.length).fill(null);

const quiz=document.getElementById("quiz");

function render(){
quiz.innerHTML="";

questions.forEach((q,i)=>{
let div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
opts+=`<div class="option ${answers[i]===j?"selected":""}" onclick="select(${i},${j})">${String.fromCharCode(65+j)}. ${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<button class="prev" onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1?
`<button class="finish" onclick="finish()">Finalizar</button>`:
`<button class="next" onclick="next()">Siguiente</button>`}
`;

quiz.appendChild(div);
});

update();
}

function select(i,j){
answers[i]=j;
render();
}

function next(){current++;render();}
function prev(){current--;render();}

function update(){
document.getElementById("qNum").innerText=current+1;
let score=answers.reduce((acc,a,i)=>a===questions[i].a?acc+1:acc,0);
document.getElementById("score").innerText=score;
}

function finish(){
let score=answers.reduce((acc,a,i)=>a===questions[i].a?acc+1:acc,0);
alert("Tu puntaje: "+score+"/"+questions.length);
}

render();

</script>

</body>
</html>

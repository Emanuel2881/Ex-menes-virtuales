<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 6</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#f5f3ff,#ede9fe,#ddd6fe);
  color:#5b21b6;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:2.3rem;color:#7c3aed;margin-bottom:10px;}

.stats-bar{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #c4b5fd;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.question{
  display:none;
  background:#f5f3ff;
  border:1px solid #c4b5fd;
  border-radius:20px;
  padding:20px;
}

.question.active{display:block;}

.option{
  background:#ede9fe;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
}

.option.selected{background:#7c3aed;color:white;}
.option.correct-answer{background:#bbf7d0;}
.option.wrong-answer{background:#fecaca;}

.navigation{text-align:center;margin-top:15px;}

button{
  border:none;
  padding:10px 15px;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
}

.actions{text-align:center;margin-top:20px;}

.result{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#f5f3ff;
  border-radius:15px;
}

.review-item{
  background:white;
  padding:10px;
  margin:10px 0;
  border-left:5px solid gray;
}

.correcta{border-left-color:green;}
.incorrecta{border-left-color:red;}
.sin-responder{border-left-color:orange;}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h1>🧠 Habilidad Numérica 6</h1>
    <p>Patrones avanzados y lógica</p>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <span>Pregunta</span><br>
      <b id="qNum">1</b> / 20
    </div>
    <div class="stat-box">
      <span>Progreso</span><br>
      <b id="progress">0 / 20</b>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="actions">
    <button onclick="finish()">Calificar</button>
    <button onclick="resetExam()">Reiniciar</button>
  </div>

  <div class="result" id="resultado">
    <h2>Resultado</h2>
    <p id="score"></p>
    <div id="review"></div>
  </div>
</div>

<script>
const questions = [

{q:"Serie: 2, 5, 11, 23, 47, ?",o:["79","85","95","101","Ninguna"],a:2,exp:"Cada término se obtiene multiplicando por 2 y sumando 1: 47×2+1=95"},
{q:"Serie: 4, 6, 9, 13, 18, ?",o:["22","23","24","25","Ninguna"],a:2,exp:"Se suma 2,3,4,5,6 → 18+6=24"},
{q:"Serie: 1, 2, 6, 24, 120, ?",o:["240","360","600","720","Ninguna"],a:3,exp:"Factorial: 6!=720"},
{q:"Serie: 100, 90, 70, 40, 0, ?",o:["-20","-30","-40","-50","Ninguna"],a:3,exp:"Se resta 10,20,30,40,50 → 0-50=-50"},
{q:"Serie: 3, 9, 27, 81, ?",o:["162","243","324","405","Ninguna"],a:1,exp:"Se multiplica por 3: 81×3=243"},
{q:"Si 2x + 3 = 15, ¿x?",o:["4","5","6","7","Ninguna"],a:2,exp:"2x=12 → x=6"},
{q:"Si x/3 + 4 = 10, ¿x?",o:["12","15","18","21","Ninguna"],a:2,exp:"x/3=6 → x=18"},
{q:"Si 5x - 10 = 40, ¿x?",o:["8","9","10","11","Ninguna"],a:2,exp:"5x=50 → x=10"},
{q:"(3/4)+(7/8)",o:["9/8","10/8","11/8","13/8","Ninguna"],a:3,exp:"3/4=6/8 → 6/8+7/8=13/8"},
{q:"(5/6)×(3/5)",o:["1/2","2/3","3/4","5/6","Ninguna"],a:0,exp:"15/30=1/2"},
{q:"25% de 240",o:["50","55","60","65","Ninguna"],a:2,exp:"0.25×240=60"},
{q:"40% de 150",o:["50","55","60","65","Ninguna"],a:2,exp:"0.4×150=60"},
{q:"Si 9 es el 30% de un número, ¿cuál es?",o:["20","25","30","35","Ninguna"],a:2,exp:"9/0.3=30"},
{q:"(12×3)+(15÷5)",o:["30","33","36","39","Ninguna"],a:3,exp:"36+3=39"},
{q:"Serie: 5, 7, 11, 19, 35, ?",o:["51","57","67","75","Ninguna"],a:2,exp:"Se suma 2,4,8,16,32 → 35+32=67"},
{q:"Si x² = 49, ¿x?",o:["5","6","7","8","Ninguna"],a:2,exp:"x=7"},
{q:"(8+2)×(5+1)",o:["40","50","60","70","Ninguna"],a:2,exp:"10×6=60"},
{q:"Promedio de 10, 20, 30, 40",o:["20","25","30","35","Ninguna"],a:1,exp:"(10+20+30+40)/4=25"},
{q:"Serie: 1, 4, 10, 20, 35, ?",o:["45","50","56","60","Ninguna"],a:2,exp:"Se suma 3,6,10,15,21 → 35+21=56"},
{q:"(100÷5)+(60÷3)",o:["30","32","34","40","Ninguna"],a:3,exp:"20+20=40"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
const div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls+=" selected";
if(done){
if(j===q.a) cls+=" correct-answer";
if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}
opts+=`<div class="option${cls}" onclick="select(${i},${j})">${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<div class="navigation">
<button onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1
? `<button onclick="finish()">Finalizar</button>`
: `<button onclick="next()">Siguiente</button>`}
</div>`;

quiz.appendChild(div);
});

update();
}

function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}

function update(){
document.getElementById("qNum").textContent=current+1;
document.getElementById("progress").textContent=answers.filter(a=>a!==null).length+" / "+questions.length;
}

function finish(){
done=true;
let correct=0;
let html="";

questions.forEach((q,i)=>{
const user=answers[i];

let estado="sin-responder";
if(user===q.a){correct++;estado="correcta";}
else if(user!==null){estado="incorrecta";}

html+=`
<div class="review-item ${estado}">
<h4>Pregunta ${i+1}</h4>
<p><b>Correcta:</b> ${q.o[q.a]}</p>
<div class="explicacion">${q.exp}</div>
</div>`;
});

document.getElementById("score").innerHTML=`${correct} / ${questions.length}`;
document.getElementById("review").innerHTML=html;
document.getElementById("resultado").style.display="block";

render();
}

function resetExam(){
current=0;
answers=new Array(questions.length).fill(null);
done=false;
document.getElementById("resultado").style.display="none";
render();
}

render();
</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

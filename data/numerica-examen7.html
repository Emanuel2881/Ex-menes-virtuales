<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 7</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#eef2ff,#e0e7ff,#c7d2fe);
  color:#3730a3;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:2.3rem;color:#4338ca;margin-bottom:10px;}

.stats-bar{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #a5b4fc;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.question{
  display:none;
  background:#eef2ff;
  border:1px solid #a5b4fc;
  border-radius:20px;
  padding:20px;
}

.question.active{display:block;}

.option{
  background:#e0e7ff;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
}

.option.selected{background:#4338ca;color:white;}
.option.correct-answer{background:#bbf7d0;}
.option.wrong-answer{background:#fecaca;}

.navigation{text-align:center;margin-top:15px;}

button{
  border:none;
  padding:10px 15px;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
}

.actions{text-align:center;margin-top:20px;}

.result{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#eef2ff;
  border-radius:15px;
}

.review-item{
  background:white;
  padding:10px;
  margin:10px 0;
  border-left:5px solid gray;
}

.correcta{border-left-color:green;}
.incorrecta{border-left-color:red;}
.sin-responder{border-left-color:orange;}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h1>🧠 Simulacro Final – Habilidad Numérica</h1>
    <p>Nivel examen real</p>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <span>Pregunta</span><br>
      <b id="qNum">1</b> / 25
    </div>
    <div class="stat-box">
      <span>Progreso</span><br>
      <b id="progress">0 / 25</b>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="actions">
    <button onclick="finish()">Calificar</button>
    <button onclick="resetExam()">Reiniciar</button>
  </div>

  <div class="result" id="resultado">
    <h2>Resultado</h2>
    <p id="score"></p>
    <div id="review"></div>
  </div>
</div>

<script>
const questions = [

{q:"Serie: 4, 9, 19, 39, 79, ?",o:["119","139","159","199","Ninguna"],a:2,exp:"Se multiplica por 2 y se suma 1: 79×2+1=159"},
{q:"Serie: 1, 3, 6, 10, 15, ?",o:["18","20","21","24","Ninguna"],a:2,exp:"Se suma 2,3,4,5,6 → 15+6=21"},
{q:"Serie: 2, 6, 7, 21, 22, ?",o:["44","66","67","88","Ninguna"],a:1,exp:"Se alterna ×3 y +1 → 22×3=66"},
{q:"Serie: 5, 10, 20, 40, 80, ?",o:["120","140","160","180","Ninguna"],a:2,exp:"Se multiplica por 2 → 80×2=160"},
{q:"Serie: 3, 6, 18, 72, ?",o:["144","216","288","360","Ninguna"],a:2,exp:"Se multiplica por 2,3,4 → 72×4=288"},

{q:"Si 4x - 8 = 24, ¿x?",o:["6","7","8","9","Ninguna"],a:2,exp:"4x=32 → x=8"},
{q:"Si 3x + 6 = 21, ¿x?",o:["3","4","5","6","Ninguna"],a:2,exp:"3x=15 → x=5"},
{q:"Si x/4 = 7, ¿x?",o:["21","24","28","32","Ninguna"],a:2,exp:"x=28"},
{q:"Si 2x + 5 = 19, ¿x?",o:["5","6","7","8","Ninguna"],a:2,exp:"2x=14 → x=7"},

{q:"(3/5)+(7/10)",o:["1","11/10","12/10","13/10","Ninguna"],a:3,exp:"6/10+7/10=13/10"},
{q:"(4/3)×(9/8)",o:["3/2","1/2","2","4","Ninguna"],a:0,exp:"36/24=3/2"},
{q:"(10/3)÷(5/6)",o:["2","3","4","5","Ninguna"],a:2,exp:"(10/3)×(6/5)=60/15=4"},

{q:"25% de 360",o:["80","85","90","95","Ninguna"],a:2,exp:"0.25×360=90"},
{q:"40% de 250",o:["80","90","100","110","Ninguna"],a:2,exp:"0.4×250=100"},
{q:"Si 12 es el 20% de un número, ¿cuál es?",o:["50","60","70","80","Ninguna"],a:1,exp:"12÷0.2=60"},

{q:"(8×5)+(12÷3)",o:["40","42","44","46","Ninguna"],a:2,exp:"40+4=44"},
{q:"(15×2)+(18÷6)",o:["30","32","33","36","Ninguna"],a:2,exp:"30+3=33"},

{q:"Serie: 1, 4, 9, 16, 25, ?",o:["30","32","36","40","Ninguna"],a:2,exp:"Son cuadrados: 6²=36"},
{q:"Serie: 2, 5, 10, 17, 26, ?",o:["35","36","37","38","Ninguna"],a:2,exp:"Se suma 3,5,7,9,11 → 26+11=37"},
{q:"Serie: 1, 2, 4, 8, 16, ?",o:["24","30","32","36","Ninguna"],a:2,exp:"Se multiplica por 2 → 32"},

{q:"Promedio de 20, 30, 40, 50",o:["30","35","40","45","Ninguna"],a:1,exp:"(20+30+40+50)/4=35"},
{q:"Perímetro de un cuadrado lado 7",o:["21","24","28","30","Ninguna"],a:2,exp:"7×4=28"},
{q:"Área de un rectángulo 8×5",o:["30","35","40","45","Ninguna"],a:2,exp:"8×5=40"},

{q:"Si 5x = 45, ¿x?",o:["7","8","9","10","Ninguna"],a:2,exp:"x=9"},
{q:"Si x² = 81, ¿x?",o:["7","8","9","10","Ninguna"],a:2,exp:"x=9"}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
const div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls+=" selected";
if(done){
if(j===q.a) cls+=" correct-answer";
if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}
opts+=`<div class="option${cls}" onclick="select(${i},${j})">${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<div class="navigation">
<button onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1
? `<button onclick="finish()">Finalizar</button>`
: `<button onclick="next()">Siguiente</button>`}
</div>`;

quiz.appendChild(div);
});

update();
}

function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}

function update(){
document.getElementById("qNum").textContent=current+1;
document.getElementById("progress").textContent=answers.filter(a=>a!==null).length+" / "+questions.length;
}

function finish(){
done=true;
let correct=0;
let html="";

questions.forEach((q,i)=>{
const user=answers[i];

let estado="sin-responder";
if(user===q.a){correct++;estado="correcta";}
else if(user!==null){estado="incorrecta";}

html+=`
<div class="review-item ${estado}">
<h4>Pregunta ${i+1}</h4>
<p><b>Correcta:</b> ${q.o[q.a]}</p>
<div class="explicacion">${q.exp}</div>
</div>`;
});

document.getElementById("score").innerHTML=`${correct} / ${questions.length}`;
document.getElementById("review").innerHTML=html;
document.getElementById("resultado").style.display="block";

render();
}

function resetExam(){
current=0;
answers=new Array(questions.length).fill(null);
done=false;
document.getElementById("resultado").style.display="none";
render();
}

render();
</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

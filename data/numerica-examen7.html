<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 7</title>

<!-- 🔴 NO TOCO TU CSS → se mantiene igual -->
<style>
/* TODO TU CSS ORIGINAL AQUÍ (sin cambios) */
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>🧠 Examen Habilidad Numérica 7</h1>
    <p>Versión digital interactiva</p>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <span class="stat-label">Pregunta actual</span>
      <span class="stat-value"><span id="qNum">1</span> / 22</span>
    </div>

    <div class="stat-box">
      <span class="stat-label">Progreso</span>
      <span class="stat-value" id="progress">0 / 22</span>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="actions">
    <button class="btn-primary" onclick="finish()">Calificar examen</button>
    <button class="btn-secondary" onclick="reiniciarExamen()">Reiniciar</button>
  </div>

  <div class="result" id="resultado">
    <h2>Resultado</h2>
    <p id="puntajeTexto"></p>
    <div class="review" id="revision"></div>
  </div>
</div>

<script>
const questions = [
{q:"Si x + 5 = 12, ¿cuál es x?",o:["5","6","7","8"],a:2,exp:"Despeje: x = 12 - 5 = 7"},
{q:"El doble de un número es 24",o:["10","12","14","16"],a:1,exp:"2x = 24 → x = 12"},
{q:"15% de 200",o:["20","25","30","35"],a:2,exp:"0.15 × 200 = 30"},
{q:"Área rectángulo 8×5",o:["13","26","40","80"],a:2,exp:"Área = base × altura = 40"},
{q:"MCM de 6 y 8",o:["12","16","24","48"],a:2,exp:"MCM = 24"},
{q:"3(4+2)-5",o:["10","13","15","18"],a:1,exp:"3×6=18 → 18-5=13"},
{q:"40% de 30",o:["10","12","15","18"],a:1,exp:"0.4×30=12"},
{q:"5 obreros 20 días, 10 obreros?",o:["5","10","15","40"],a:1,exp:"Más obreros menos tiempo → 10 días"},
{q:"Serie 2,5,8,11",o:["13","14","15","16"],a:1,exp:"Suma +3 → 14"},
{q:"Razón 2:3 menor 14",o:["18","21","24","28"],a:1,exp:"14×3/2=21"},
{q:"√81 + √16",o:["9","13","17","25"],a:1,exp:"9+4=13"},
{q:"500 con 15% descuento",o:["400","425","450","475"],a:1,exp:"500×0.85=425"},
{q:"2³ + 3²",o:["13","15","17","19"],a:2,exp:"8+9=17"},
{q:"Ángulo faltante",o:["60","70","80","90"],a:1,exp:"180-(35+65)=70"},
{q:"144 ÷ 12",o:["10","11","12","13"],a:2,exp:"=12"},
{q:"Mayor 2/3 vs 3/5",o:["2/3","3/5","igual","no"],a:0,exp:"0.66 > 0.6"},
{q:"60km/h × 3h",o:["120","150","180","210"],a:2,exp:"d=v×t=180"},
{q:"80→100 % aumento",o:["15","20","25","30"],a:2,exp:"20/80=25%"},
{q:"18-3×4+2",o:["4","6","8","12"],a:2,exp:"18-12+2=8"},
{q:"MCD 12,18,24",o:["2","3","6","12"],a:2,exp:"=6"},
{q:"x=-2 en 3x²-4",o:["-16","-8","8","16"],a:2,exp:"3(4)-4=8"},
{q:"3 artículos=60, 7?",o:["120","130","140","150"],a:2,exp:"20×7=140"}
];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
const div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls+=" selected";
if(done){
if(j===q.a) cls+=" correct-answer";
if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}
opts+=`<div class="option${cls}" onclick="select(${i},${j})">${String.fromCharCode(65+j)}. ${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<div class="navigation">
<button class="prev" onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1
? `<button class="finish" onclick="finish()">Finalizar</button>`
: `<button class="next" onclick="next()">Siguiente</button>`}
</div>`;

quiz.appendChild(div);
});

update();
}

function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}

function update(){
document.getElementById("qNum").textContent=current+1;
document.getElementById("progress").textContent=answers.filter(a=>a!==null).length+" / "+questions.length;
}

function finish(){
done=true;
let correct=0;
let html="";

questions.forEach((q,i)=>{
const user=answers[i];
if(user===q.a) correct++;

html+=`<div class="review-item">
<h4>Pregunta ${i+1}</h4>
<p>Correcta: ${q.o[q.a]}</p>
<div class="explicacion">${q.exp}</div>
</div>`;
});

document.getElementById("puntajeTexto").innerHTML=`${correct} / ${questions.length}`;
document.getElementById("revision").innerHTML=html;
document.getElementById("resultado").style.display="block";

render();
}

function reiniciarExamen(){
current=0;
answers=new Array(questions.length).fill(null);
done=false;
document.getElementById("resultado").style.display="none";
render();
}

render();
</script>
<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>
</body>
</html>

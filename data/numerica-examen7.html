<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 7</title>

<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family: Arial, Helvetica, sans-serif; background: linear-gradient(135deg,#e0f2fe,#dbeafe,#bfdbfe); color:#1e3a8a; min-height:100vh; padding:30px 15px; }
.container{ max-width:950px; margin:auto; background:rgba(255,255,255,0.95); padding:25px; border-radius:24px; box-shadow:0 12px 35px rgba(0,0,0,0.08); }
.header{ text-align:center; margin-bottom:20px; }
.header h1{ font-size: clamp(1.9rem, 4vw, 2.7rem); margin-bottom:10px; color:#1d4ed8; }
.header p{ color:#1e40af; opacity:0.9; }

.stats-bar{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-bottom:20px; }
.stat-box{ background:#fff; border:1px solid #bfdbfe; border-radius:14px; padding:12px 18px; min-width:150px; text-align:center; }
.stat-label{ display:block; font-size:0.9rem; color:#2563eb; margin-bottom:4px; font-weight:bold; }
.stat-value{ font-size:1.15rem; font-weight:bold; }

.question{ display:none; background:#eff6ff; border:1px solid #bfdbfe; border-radius:20px; padding:20px; margin-bottom:18px; }
.question.active{ display:block; }
.question h3{ color:#1d4ed8; margin-bottom:14px; }

.option{ background:#dbeafe; padding:12px; margin:10px 0; border-radius:12px; cursor:pointer; }
.option:hover{ background:#bfdbfe; }
.option.selected{ background:#3b82f6; color:white; }
.option.correct-answer{ background:#dcfce7; color:#166534; }
.option.wrong-answer{ background:#fee2e2; color:#991b1b; }

.navigation{ display:flex; gap:12px; justify-content:center; margin-top:18px; }
button{ border:none; border-radius:14px; padding:12px 20px; font-weight:bold; cursor:pointer; }
.prev{ background:#93c5fd; }
.next{ background:#3b82f6; color:white; }
.finish{ background:#1d4ed8; color:white; }

.actions{ display:flex; gap:12px; justify-content:center; margin-top:25px; }
.btn-primary{ background:#2563eb; color:white; }
.btn-secondary{ background:#bfdbfe; }

.result{ margin-top:25px; padding:20px; border-radius:18px; background:#eff6ff; border:1px solid #bfdbfe; display:none; }

.review-summary{ display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin:18px 0; }
.summary-box{ background:#fff; border:1px solid #bfdbfe; border-radius:14px; padding:14px; text-align:center; }
.summary-box h4{ color:#2563eb; }

.review-item{ background:#fff; border-radius:14px; padding:14px; margin-bottom:12px; border-left:6px solid #cbd5e1; }
.review-item.correcta{ border-left-color:#22c55e; background:#f0fdf4; }
.review-item.incorrecta{ border-left-color:#ef4444; background:#fef2f2; }
.review-item.sin-responder{ border-left-color:#f59e0b; background:#fffbeb; }

.explicacion{ margin-top:8px; padding:10px; background:#f1f5f9; border-radius:10px; }
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>🧠 Examen Habilidad Numérica 7</h1>
    <p>Versión interactiva</p>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <span class="stat-label">Pregunta</span>
      <span class="stat-value"><span id="qNum">1</span> / 22</span>
    </div>

    <div class="stat-box">
      <span class="stat-label">Progreso</span>
      <span class="stat-value" id="progress">0 / 22</span>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="actions">
    <button class="btn-primary" onclick="finish()">Calificar</button>
    <button class="btn-secondary" onclick="reiniciarExamen()">Reiniciar</button>
  </div>

  <div class="result" id="resultado">
    <h2>Resultado</h2>
    <p id="puntajeTexto"></p>
    <div id="revision"></div>
  </div>
</div>

<script>
const questions = [
{q:"Si x + 5 = 12, ¿cuál es x?",o:["5","6","7","8"],a:2,exp:"x = 12 - 5 = 7"},
{q:"El doble de un número es 24",o:["10","12","14","16"],a:1,exp:"x = 12"},
{q:"15% de 200",o:["20","25","30","35"],a:2,exp:"0.15×200=30"},
{q:"Área 8×5",o:["13","26","40","80"],a:2,exp:"40"},
{q:"MCM 6 y 8",o:["12","16","24","48"],a:2,exp:"24"},
{q:"3(4+2)-5",o:["10","13","15","18"],a:1,exp:"13"},
{q:"40% de 30",o:["10","12","15","18"],a:1,exp:"12"},
{q:"Obreros",o:["5","10","15","40"],a:1,exp:"10 días"},
{q:"Serie",o:["13","14","15","16"],a:1,exp:"14"},
{q:"Razón",o:["18","21","24","28"],a:1,exp:"21"},
{q:"Raíces",o:["9","13","17","25"],a:1,exp:"13"},
{q:"Descuento",o:["400","425","450","475"],a:1,exp:"425"},
{q:"Potencias",o:["13","15","17","19"],a:2,exp:"17"},
{q:"Ángulo",o:["60","70","80","90"],a:1,exp:"70"},
{q:"División",o:["10","11","12","13"],a:2,exp:"12"},
{q:"Fracciones",o:["2/3","3/5","igual","no"],a:0,exp:"2/3 mayor"},
{q:"Velocidad",o:["120","150","180","210"],a:2,exp:"180"},
{q:"Porcentaje",o:["15","20","25","30"],a:2,exp:"25%"},
{q:"Operación",o:["4","6","8","12"],a:2,exp:"8"},
{q:"MCD",o:["2","3","6","12"],a:2,exp:"6"},
{q:"Sustitución",o:["-16","-8","8","16"],a:2,exp:"8"},
{q:"Proporción",o:["120","130","140","150"],a:2,exp:"140"}
];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
const div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls+=" selected";
if(done){
if(j===q.a) cls+=" correct-answer";
if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}
opts+=`<div class="option${cls}" onclick="select(${i},${j})">${String.fromCharCode(65+j)}. ${op}</div>`;
});

div.innerHTML=`<h3>${q.q}</h3>${opts}
<div class="navigation">
<button class="prev" onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1
? `<button class="finish" onclick="finish()">Finalizar</button>`
: `<button class="next" onclick="next()">Siguiente</button>`}
</div>`;

quiz.appendChild(div);
});

update();
}

function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}

function update(){
document.getElementById("qNum").textContent=current+1;
document.getElementById("progress").textContent=answers.filter(a=>a!==null).length+" / "+questions.length;
}

function finish(){
done=true;
let correctas=0,incorrectas=0,sinResponder=0;
let html="";

questions.forEach((q,i)=>{
const user=answers[i];

if(user===null){
sinResponder++;
html+=`<div class="review-item sin-responder">
<h4>Pregunta ${i+1}</h4>
<p>Correcta: ${q.o[q.a]}</p>
<div class="explicacion">${q.exp}</div></div>`;
}else if(user===q.a){
correctas++;
html+=`<div class="review-item correcta">
<h4>Pregunta ${i+1} ✅</h4>
<p>Tu respuesta: ${q.o[user]}</p>
<div class="explicacion">${q.exp}</div></div>`;
}else{
incorrectas++;
html+=`<div class="review-item incorrecta">
<h4>Pregunta ${i+1} ❌</h4>
<p>Tu respuesta: ${q.o[user]}</p>
<p>Correcta: ${q.o[q.a]}</p>
<div class="explicacion">${q.exp}</div></div>`;
}
});

const total=questions.length;
const porcentaje=((correctas/total)*100).toFixed(1);

document.getElementById("puntajeTexto").innerHTML=`Obtuviste ${correctas} de ${total} (${porcentaje}%)`;

document.getElementById("revision").innerHTML=`
<div class="review-summary">
<div class="summary-box"><h4>Correctas</h4><p>${correctas}</p></div>
<div class="summary-box"><h4>Incorrectas</h4><p>${incorrectas}</p></div>
<div class="summary-box"><h4>Sin responder</h4><p>${sinResponder}</p></div>
</div>
${html}`;

document.getElementById("resultado").style.display="block";
render();
}

function reiniciarExamen(){
current=0;answers=new Array(questions.length).fill(null);done=false;
document.getElementById("resultado").style.display="none";
render();
}

render();
</script>
<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 7</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#eff6ff,#dbeafe,#bfdbfe);
  color:#1e3a8a;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{text-align:center;margin-bottom:20px;}
.header h1{font-size:2.3rem;color:#1d4ed8;margin-bottom:10px;}
.header p{color:#1e40af;}

.stats-bar{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #93c5fd;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.stat-label{font-size:0.9rem;color:#2563eb;}
.stat-value{font-size:1.2rem;font-weight:bold;}

.question{
  display:none;
  background:#eff6ff;
  border:1px solid #93c5fd;
  border-radius:20px;
  padding:20px;
}

.question.active{display:block;}

.option{
  background:#dbeafe;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
}

.option.selected{background:#2563eb;color:white;}
.option.correct-answer{background:#bbf7d0;}
.option.wrong-answer{background:#fecaca;}

.navigation{text-align:center;margin-top:15px;}

button{
  border:none;
  padding:10px 15px;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
}

.next{background:#2563eb;color:white;}
.prev{background:#93c5fd;}
.finish{background:#1d4ed8;color:white;}

.actions{text-align:center;margin-top:20px;}

.result{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#eff6ff;
  border-radius:15px;
}

.review-item{
  background:white;
  padding:10px;
  margin:10px 0;
  border-left:5px solid gray;
}

.correcta{border-left-color:green;}
.incorrecta{border-left-color:red;}
.sin-responder{border-left-color:orange;}

.explicacion{
  margin-top:5px;
  font-size:0.9rem;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h1>🧠 Habilidad Numérica 7</h1>
    <p>Examen interactivo</p>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <span>Pregunta</span><br>
      <b id="qNum">1</b> / 24
    </div>
    <div class="stat-box">
      <span>Progreso</span><br>
      <b id="progress">0 / 24</b>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="actions">
    <button onclick="finish()">Calificar</button>
    <button onclick="resetExam()">Reiniciar</button>
  </div>

  <div class="result" id="resultado">
    <h2>Resultado</h2>
    <p id="score"></p>
    <div id="review"></div>
  </div>
</div>

<script>
const questions = [
{q:"Si al dividir un número entre 13 el cociente es 18 y el resto es 7, ¿cuál es el número?",o:["234","241","247","254","Ninguna"],a:1,exp:"Número = 13×18 + 7 = 241"},
{q:"Simplifica: 5(4x - 6) - 3(2x + 5)",o:["14x - 45","14x - 15","26x - 45","2x - 1","Ninguna"],a:0,exp:"20x-30-6x-15=14x-45"},
{q:"-22 - (-14) + (-9)",o:["-37","-17","-5","5","Ninguna"],a:1,exp:"-22+14-9=-17"},
{q:"7K45 + 5K83 = 13228, ¿K?",o:["3","5","7","9","Ninguna"],a:2,exp:"K=7"},
{q:"Resto de 5,831,264 ÷ 23",o:["8","11","15","19","Ninguna"],a:0,exp:"Residuo 8"},
{q:"8/N = N/32",o:["12","14","16","18","Ninguna"],a:2,exp:"N²=256 →16"},
{q:"(5/6) ÷ (10/12) - (2/5)",o:["3/5","2/5","1/5","4/5","Ninguna"],a:0,exp:"=3/5"},
{q:"25% del 40% de 450",o:["35","40","45","50","Ninguna"],a:2,exp:"0.25×0.4×450=45"},
{q:"3Y72 ÷ 46 = Y6",o:["4","6","8","9","Ninguna"],a:2,exp:"Y=8"},
{q:"9 es 15% de",o:["45","50","60","75","Ninguna"],a:2,exp:"9/0.15=60"},
{q:"9a² - 4b + 7a² + 12b",o:["16a²+8b","16a²-16b","2a²+8b","13a²b","Ninguna"],a:0,exp:"Se suman términos semejantes"},
{q:"21/28 = P/16",o:["10","12","14","15","Ninguna"],a:1,exp:"P=12"},
{q:"4y + 12 = 7y - 9",o:["5","6","7","8","Ninguna"],a:2,exp:"y=7"},
{q:"¿Qué suma es mayor que 1?",o:["2/7+3/5","3/4+1/6","5/9+2/7","4/8+3/9","Ninguna"],a:4,exp:"Todas son menores a 1"},
{q:"8M6 × 9 = 7794",o:["4","5","6","7","Ninguna"],a:2,exp:"M=6"},
{q:"Serie: 9,16,25,36,49,...",o:["56","60","64","72","Ninguna"],a:2,exp:"Cuadrados"},
{q:"Divisible por 3,5,6,10",o:["30","60","90","120","Ninguna"],a:0,exp:"MCM=30"},
{q:"9P5P2 - 4P8P5 = 48627",o:["2","4","6","8","Ninguna"],a:3,exp:"P=8"},
{q:"(9/10)*(25/27)/(5/6)",o:["1","2","1/2","3/4","Ninguna"],a:0,exp:"=1"},
{q:"(112.75×2.85)/4.72 ≈",o:["62","68","74","80","Ninguna"],a:1,exp:"≈68"},
{q:"7S85 - 8S6 = 6S99",o:["1","3","5","7","Ninguna"],a:2,exp:"S=5"},
{q:"No divisible entre 4",o:["524","736","812","914","Ninguna"],a:3,exp:"914 no cumple"},
{q:"6m -3n +9m -11n",o:["15m-14n","-3m-14n","15m+8n","9mn","Ninguna"],a:0,exp:"15m-14n"},
{q:"Serie: 2,5,11,23,47,...",o:["79","85","95","101","Ninguna"],a:2,exp:"+3,+6,+12,+24,+48 →95"}
];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
const div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls+=" selected";
if(done){
if(j===q.a) cls+=" correct-answer";
if(answers[i]===j && j!==q.a) cls+=" wrong-answer";
}
opts+=`<div class="option${cls}" onclick="select(${i},${j})">${op}</div>`;
});

div.innerHTML=`
<h3>${q.q}</h3>
${opts}
<div class="navigation">
<button onclick="prev()" ${i===0?"disabled":""}>Anterior</button>
${i===questions.length-1
? `<button onclick="finish()">Finalizar</button>`
: `<button onclick="next()">Siguiente</button>`}
</div>`;

quiz.appendChild(div);
});

update();
}

function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}

function update(){
document.getElementById("qNum").textContent=current+1;
document.getElementById("progress").textContent=answers.filter(a=>a!==null).length+" / "+questions.length;
}

function finish(){
done=true;
let correct=0;
let html="";

questions.forEach((q,i)=>{
const user=answers[i];

let estado="sin-responder";
if(user===q.a){correct++;estado="correcta";}
else if(user!==null){estado="incorrecta";}

html+=`
<div class="review-item ${estado}">
<h4>Pregunta ${i+1}</h4>
<p><b>Correcta:</b> ${q.o[q.a]}</p>
<div class="explicacion">${q.exp}</div>
</div>`;
});

document.getElementById("score").innerHTML=`${correct} / ${questions.length}`;
document.getElementById("review").innerHTML=html;
document.getElementById("resultado").style.display="block";

render();
}

function resetExam(){
current=0;
answers=new Array(questions.length).fill(null);
done=false;
document.getElementById("resultado").style.display="none";
render();
}

render();
</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>
</body>
</html>

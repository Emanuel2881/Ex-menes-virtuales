<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Numérico con Explicación</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff1f2,#ffe4e6,#fecdd3);color:#7f1d1d;min-height:100vh;padding:30px 15px}
.container{max-width:950px;margin:auto;background:rgba(255,255,255,0.95);padding:25px;border-radius:24px;box-shadow:0 12px 35px rgba(0,0,0,0.08)}
.header{text-align:center;margin-bottom:20px}
.header h1{font-size:2rem;margin-bottom:10px;color:#9f1239}
.stats-bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:20px}
.stat-box{background:#fff;border:1px solid #fecdd3;border-radius:14px;padding:12px 18px;min-width:150px;text-align:center}
.question{display:none;background:#fff7f8;border:1px solid #fecdd3;border-radius:20px;padding:20px;margin-bottom:18px}
.question.active{display:block}
.option{display:block;background:#ffe4e6;padding:12px;margin:10px 0;border-radius:12px;cursor:pointer}
.option.selected{background:#f43f5e;color:white}
.option.correct-answer{background:#dcfce7;color:#166534}
.option.wrong-answer{background:#fee2e2;color:#991b1b}
.navigation{display:flex;gap:10px;justify-content:center;margin-top:15px}
button{padding:10px 16px;border:none;border-radius:12px;cursor:pointer}
.result{display:none;margin-top:20px}
.explicacion{margin-top:8px;padding:10px;background:#f1f5f9;border-radius:10px}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>🧠 Examen Numérico con Explicación</h1>
  </div>

  <div class="stats-bar">
    <div class="stat-box">Pregunta <span id="qNum">1</span></div>
    <div class="stat-box">Progreso <span id="progress">0</span></div>
  </div>

  <div id="quiz"></div>

  <button onclick="finish()">Finalizar</button>

  <div class="result" id="resultado">
    <h2>Resultado</h2>
    <p id="puntaje"></p>
    <div id="revision"></div>
  </div>
</div>

<script>
const questions = [
{
q:"Si x + 5 = 12, ¿cuál es x?",
o:["5","6","7","8"],
a:2,
exp:"Se despeja: x = 12 - 5 = 7"
},
{
q:"15% de 200",
o:["20","25","30","35"],
a:2,
exp:"15% = 0.15 → 0.15 × 200 = 30"
},
{
q:"Área de rectángulo base 8 altura 5",
o:["40","30","20","10"],
a:0,
exp:"Área = base × altura = 8×5 = 40"
}
];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

questions.forEach((q,i)=>{
let div=document.createElement("div");
div.className="question"+(i===current?" active":"");

let opts="";
q.o.forEach((op,j)=>{
let cls="";
if(answers[i]===j) cls="selected";
if(done){
if(j===q.a) cls="correct-answer";
if(answers[i]===j && j!==q.a) cls="wrong-answer";
}
opts+=`<div class="option ${cls}" onclick="select(${i},${j})">${op}</div>`;
});

div.innerHTML=`<h3>${q.q}</h3>${opts}
<div class="navigation">
<button onclick="prev()">Anterior</button>
<button onclick="next()">Siguiente</button>
</div>`;

quiz.appendChild(div);
});

update();
}

function select(i,j){if(done)return;answers[i]=j;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}

function update(){
document.getElementById("qNum").textContent=current+1;
document.getElementById("progress").textContent=answers.filter(a=>a!==null).length;
}

function finish(){
done=true;
let correct=0;
let html="";

questions.forEach((q,i)=>{
if(answers[i]===q.a) correct++;

html+=`<div class="explicacion">
<strong>Pregunta ${i+1}</strong><br>
Correcta: ${q.o[q.a]}<br>
Explicación: ${q.exp}
</div>`;
});

document.getElementById("puntaje").textContent=`${correct} / ${questions.length}`;
document.getElementById("revision").innerHTML=html;
document.getElementById("resultado").style.display="block";

render();
}

render();
</script>
</body>
</html>

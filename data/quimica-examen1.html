<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Química - Examen 1</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#ecfeff,#f0f9ff,#cffafe);
  color:#0f172a;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  font-size: clamp(1.9rem, 4vw, 2.7rem);
  margin-bottom:10px;
  color:#0891b2;
}

.header p{
  color:#0f766e;
  opacity:0.9;
}

.top-link{
  display:inline-block;
  margin-top:12px;
  color:#0891b2;
  text-decoration:none;
  font-weight:bold;
}

.stats-bar{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #bae6fd;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.stat-label{
  display:block;
  font-size:0.9rem;
  color:#0891b2;
  margin-bottom:4px;
  font-weight:bold;
}

.stat-value{
  display:block;
  font-size:1.15rem;
  color:#0f172a;
  font-weight:bold;
}

.question{
  display:none;
  background:#f8feff;
  border:1px solid #bae6fd;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
}

.question.active{
  display:block;
}

.question h3{
  font-size:1.08rem;
  line-height:1.6;
  color:#0f766e;
  margin-bottom:14px;
}

.question p{
  margin-bottom:14px;
  line-height:1.6;
  color:#334155;
}

.option{
  display:block;
  background:#ecfeff;
  padding:12px 14px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#cffafe;
}

.option.selected{
  background:#06b6d4;
  color:white;
}

.option.correct-answer{
  background:#dcfce7 !important;
  color:#166534 !important;
}

.option.wrong-answer{
  background:#fee2e2 !important;
  color:#991b1b !important;
}

.navigation{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:18px;
}

button{
  border:none;
  border-radius:14px;
  padding:12px 20px;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

.prev{
  background:#a5f3fc;
  color:#0f766e;
}

.next{
  background:#06b6d4;
  color:white;
}

.finish{
  background:#0891b2;
  color:white;
}

.actions{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:25px;
}

.btn-primary{
  background:#0891b2;
  color:white;
}

.btn-secondary{
  background:#cffafe;
  color:#0f766e;
}

.result{
  margin-top:25px;
  padding:20px;
  border-radius:18px;
  background:#f0fdfa;
  border:1px solid #99f6e4;
  display:none;
}

.review-item{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.review-item.correcta{
  border-left:6px solid #22c55e;
}

.review-item.incorrecta{
  border-left:6px solid #ef4444;
}

.review-item.sin-responder{
  border-left:6px solid #f59e0b;
}

.explicacion{
  margin-top:8px;
  padding:10px;
  background:#f8fafc;
  border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧪 Química - Examen 1</h1>
<p>Conversiones químicas y configuración electrónica</p>

<a class="top-link" href="../quimica.html">
← Volver a Química
</a>
</div>

<div class="stats-bar">

<div class="stat-box">
<span class="stat-label">Pregunta actual</span>
<span class="stat-value">
<span id="qNum">1</span> / 20
</span>
</div>

<div class="stat-box">
<span class="stat-label">Progreso</span>
<span class="stat-value" id="progress">
0 / 20
</span>
</div>

</div>

<div id="quiz"></div>

<div class="actions">

<button class="btn-primary"
onclick="finishQuiz()">
Calificar examen
</button>

<button class="btn-secondary"
onclick="reiniciarExamen()">
Reiniciar
</button>

</div>

<div class="result" id="resultado">

<h2>Resultado</h2>

<p id="puntajeTexto"></p>

<div id="revision"></div>

</div>

</div>

<script>

const questions = [

{
q:"De moles a átomos",
text:"Convertir 2.5 moles de Hierro (Fe) a átomos de Hierro.",
o:[
"1.5055 × 10²³ átomos",
"1.5055 × 10²⁴ átomos",
"1.5055 × 10²⁵ átomos",
"6.022 × 10²³ átomos"
],
a:1,
exp:"Se multiplica por el número de Avogadro."
},

{
q:"De moléculas a moles",
text:"Convertir 1.2044 × 10²⁴ moléculas de H₂O a moles.",
o:[
"1 mol",
"2 mol",
"3 mol",
"0.5 mol"
],
a:1,
exp:"Se divide entre el número de Avogadro."
},

{
q:"De moles a iones",
text:"Convertir 0.5 moles de NaCl a iones Na⁺.",
o:[
"3.011 × 10²³ iones",
"6.022 × 10²³ iones",
"1.2044 × 10²⁴ iones",
"0.5 iones"
],
a:0,
exp:"0.5 × 6.022×10²³."
},

{
q:"De átomos a moles",
text:"Convertir 3.011 × 10²³ átomos de Carbono a moles.",
o:[
"0.25 mol",
"0.5 mol",
"1 mol",
"2 mol"
],
a:1,
exp:"Se divide entre Avogadro."
},

{
q:"De mol a gramo",
text:"Convertir 3 moles de CO₂ a gramos.",
o:[
"44.01 g",
"88.02 g",
"132.03 g",
"146.03 g"
],
a:2,
exp:"3 × 44.01."
},

{
q:"De gramo a miligramo",
text:"Convertir 0.75 gramos a miligramos.",
o:[
"7.5 mg",
"75 mg",
"750 mg",
"7500 mg"
],
a:2,
exp:"1 g = 1000 mg."
},

{
q:"De litro a mililitro",
text:"Convertir 1.5 litros a mililitros.",
o:[
"15 mL",
"150 mL",
"1500 mL",
"15000 mL"
],
a:2,
exp:"1 L = 1000 mL."
},

{
q:"Configuración electrónica",
text:"¿Cuál es la configuración electrónica del Litio?",
o:[
"1s² 2p¹",
"1s² 2s¹",
"1s¹ 2s²",
"1s² 2s² 2p¹"
],
a:1,
exp:"El litio tiene 3 electrones."
},

{
q:"Identificación de elemento",
text:"La configuración 1s² 2s² 2p⁶ 3s² 3p⁴ corresponde a:",
o:[
"Silicio",
"Fósforo",
"Azufre",
"Cloro"
],
a:2,
exp:"Tiene Z = 16."
},

{
q:"Balanceo",
text:"FeCl₃ + Na₂CO₃ → Fe₂(CO₃)₃ + NaCl",
o:[
"8",
"10",
"12",
"14"
],
a:1,
exp:"La suma de coeficientes es 10."
}
{
q:"De kilogramo a gramo",
text:"Convertir 0.2 kilogramos de sal a gramos.",
o:[
"20 g",
"200 g",
"2000 g",
"0.2 g"
],
a:1,
exp:"0.2 × 1000 = 200 g."
},

{
q:"De miligramo a gramo",
text:"Convertir 500 miligramos de vitamina C a gramos.",
o:[
"0.05 g",
"0.5 g",
"5 g",
"50 g"
],
a:1,
exp:"500 mg ÷ 1000 = 0.5 g."
},

{
q:"De gramo a mol",
text:"Convertir 98 gramos de H₂SO₄ a moles.",
o:[
"0.5 mol",
"1 mol",
"2 mol",
"9.8 mol"
],
a:1,
exp:"98 g ÷ 98 g/mol ≈ 1 mol."
},

{
q:"Reacción química",
text:"En Zn + 2HCl → ZnCl₂ + H₂, ¿hay gas en los reactivos?",
o:[
"Verdadero",
"Falso"
],
a:1,
exp:"Los reactivos son sólido y acuoso."
},

{
q:"Reacción reversible",
text:"2Fe + 3Cl₂ ⇌ 2FeCl₃ es una reacción:",
o:[
"Irreversible",
"Reversible",
"Descomposición",
"Sin productos"
],
a:1,
exp:"La doble flecha indica reversibilidad."
},

{
q:"Productos formados",
text:"En Zn + 2HCl → ZnCl₂ + H₂, uno de los productos es:",
o:[
"Sólido",
"Plasma",
"Gas",
"Solo líquido"
],
a:2,
exp:"El hidrógeno se forma como gas."
},

{
q:"Estado físico del hidrógeno",
text:"El estado físico del H₂ producido es:",
o:[
"Sólido",
"Acuoso",
"Líquido",
"Gaseoso"
],
a:3,
exp:"(g) significa gaseoso."
},

{
q:"Subíndice (g)",
text:"¿Qué indica el símbolo (g) en Cl₂(g)?",
o:[
"Que es gas",
"Que es gramo",
"Que es líquido",
"Que es catalizador"
],
a:0,
exp:"(g) indica estado gaseoso."
},

{
q:"Reacción correcta",
text:"¿Cuál afirmación es correcta sobre Zn + 2HCl → ZnCl₂ + H₂?",
o:[
"ZnCl₂ es gas",
"Los reactivos son sólidos",
"Produce hidrógeno gaseoso",
"Es síntesis"
],
a:2,
exp:"La reacción libera H₂(g)."
},

{
q:"Identificación de elemento",
text:"1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁷ corresponde a:",
o:[
"Manganeso",
"Cobalto",
"Níquel",
"Hierro"
],
a:1,
exp:"Tiene Z = 27."
}
];

let current = 0;
let answers = new Array(questions.length).fill(null);
let examenFinalizado = false;

const quiz = document.getElementById("quiz");

function actualizarProgreso(){

const respondidas =
answers.filter(a => a !== null).length;

document.getElementById("progress").textContent =
`${respondidas} / ${questions.length}`;

document.getElementById("qNum").textContent =
current + 1;

}

function render(){

quiz.innerHTML = "";

questions.forEach((q,i)=>{

let div = document.createElement("div");

div.className =
"question" + (i===current ? " active" : "");

let opts = "";

q.o.forEach((op,j)=>{

let extraClass = "";

if(answers[i] === j)
extraClass += " selected";

if(examenFinalizado){

if(j === q.a)
extraClass += " correct-answer";

if(answers[i] === j && j !== q.a){
extraClass += " wrong-answer";
}

}

opts += `
<div class="option${extraClass}"
onclick="selectOption(${i},${j})">

${String.fromCharCode(65+j)}. ${op}

</div>
`;

});

div.innerHTML = `

<h3>${i+1}. ${q.q}</h3>

<p>${q.text}</p>

${opts}

<div class="navigation">

<button class="prev"
onclick="prevQuestion()"
${i===0 ? "disabled" : ""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish"
onclick="finishQuiz()">
Finalizar
</button>`

: `<button class="next"
onclick="nextQuestion()">
Siguiente
</button>`

}

</div>

`;

quiz.appendChild(div);

});

actualizarProgreso();

}

function selectOption(i,j){

if(examenFinalizado) return;

answers[i] = j;

render();

}

function nextQuestion(){

if(current < questions.length-1){

current++;

render();

}

}

function prevQuestion(){

if(current > 0){

current--;

render();

}

}

function finishQuiz(){

if(examenFinalizado) return;

examenFinalizado = true;

let total = questions.length;

let correctas = 0;

let revisionHTML = "";

questions.forEach((q,i)=>{

const respuestaUsuario = answers[i];

if(respuestaUsuario === q.a){

correctas++;

revisionHTML += `
<div class="review-item correcta">

<h4>
Pregunta ${i+1}: ✅ Correcta
</h4>

<div class="explicacion">
${q.exp}
</div>

</div>
`;

}else if(respuestaUsuario === null){

revisionHTML += `
<div class="review-item sin-responder">

<h4>
Pregunta ${i+1}: ⚠️ Sin responder
</h4>

<div class="explicacion">
Respuesta correcta: ${q.o[q.a]}
</div>

</div>
`;

}else{

revisionHTML += `
<div class="review-item incorrecta">

<h4>
Pregunta ${i+1}: ❌ Incorrecta
</h4>

<div class="explicacion">

Correcta: ${q.o[q.a]}

<br><br>

${q.exp}

</div>

</div>
`;

}

});

const porcentaje =
((correctas/total)*100).toFixed(1);

document.getElementById("puntajeTexto")
.innerHTML = `

Obtuviste
<strong>${correctas}</strong>

de

<strong>${total}</strong>

correctas.<br>

Nota final:

<strong>${porcentaje}%</strong>

`;

document.getElementById("revision")
.innerHTML = revisionHTML;

document.getElementById("resultado")
.style.display = "block";

render();

}

function reiniciarExamen(){

location.reload();

}

render();

</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

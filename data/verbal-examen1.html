<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Verbal 1</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#fff1f2,#ffe4e6,#fecdd3);
color:#7f1d1d;
min-height:100vh;
padding:30px 15px;
}

.container{
max-width:950px;
margin:auto;
background:rgba(255,255,255,0.95);
padding:25px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:clamp(1.9rem,4vw,2.7rem);
margin-bottom:10px;
color:#9f1239;
}

.header p{
color:#881337;
opacity:0.9;
}

.top-link{
display:inline-block;
margin-top:12px;
color:#be123c;
text-decoration:none;
font-weight:bold;
}

.stats-bar{
display:flex;
flex-wrap:wrap;
gap:12px;
justify-content:center;
margin-bottom:20px;
}

.stat-box{
background:#fff;
border:1px solid #fecdd3;
border-radius:14px;
padding:12px 18px;
min-width:150px;
text-align:center;
}

.stat-label{
display:block;
font-size:0.9rem;
color:#be123c;
margin-bottom:4px;
font-weight:bold;
}

.stat-value{
display:block;
font-size:1.15rem;
color:#7f1d1d;
font-weight:bold;
}

.question{
display:none;
background:#fff7f8;
border:1px solid #fecdd3;
border-radius:20px;
padding:20px;
margin-bottom:18px;
}

.question.active{
display:block;
}

.question h3{
font-size:1.08rem;
line-height:1.6;
color:#9f1239;
margin-bottom:14px;
}

.option{
display:block;
background:#ffe4e6;
padding:12px 14px;
margin:10px 0;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#fecdd3;
}

.option.selected{
background:#f43f5e;
color:white;
}

.option.correct-answer{
background:#dcfce7 !important;
color:#166534 !important;
}

.option.wrong-answer{
background:#fee2e2 !important;
color:#991b1b !important;
}

.navigation{
display:flex;
justify-content:center;
gap:12px;
margin-top:18px;
}

button{
border:none;
border-radius:14px;
padding:12px 20px;
font-size:1rem;
font-weight:bold;
cursor:pointer;
}

.prev{
background:#fda4af;
color:#881337;
}

.next{
background:#fb7185;
color:white;
}

.finish{
background:#dc2626;
color:white;
}

.actions{
display:flex;
justify-content:center;
gap:12px;
margin-top:25px;
}

.btn-primary{
background:#e11d48;
color:white;
}

.btn-secondary{
background:#fecdd3;
color:#9f1239;
}

.result{
margin-top:25px;
padding:20px;
border-radius:18px;
background:#fff7f8;
border:1px solid #fecdd3;
display:none;
}

.review-item{
background:white;
border-radius:14px;
padding:14px;
margin-bottom:12px;
}

.review-item.correcta{
border-left:6px solid #22c55e;
}

.review-item.incorrecta{
border-left:6px solid #ef4444;
}

.review-item.sin-responder{
border-left:6px solid #f59e0b;
}

.explicacion{
margin-top:8px;
padding:10px;
background:#f8fafc;
border-radius:10px;
}

.ranking-panel{
position:fixed;
left:0;
top:0;
width:320px;
height:100vh;
background:white;
color:#111827;
box-shadow:4px 0 20px rgba(0,0,0,0.12);
padding:20px;
overflow-y:auto;
z-index:999;
transition:transform 0.3s ease;
}

.ranking-panel.hidden{
transform:translateX(-100%);
}

.toggle-ranking{
position:fixed;
left:15px;
top:15px;
z-index:1000;
background:#e11d48;
color:white;
border:none;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.ranking-content{
margin-top:60px;
}

@media(max-width:768px){
.ranking-panel{
width:260px;
}
.container{
padding:18px;
}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>📖 Examen Verbal 1</h1>
<p>Analogías y relaciones verbales</p>
<a class="top-link" href="../verbal.html">← Volver a Verbal</a>
</div>

<div class="stats-bar">
<div class="stat-box">
<span class="stat-label">Pregunta actual</span>
<span class="stat-value"><span id="qNum">1</span> / 15</span>
</div>

<div class="stat-box">
<span class="stat-label">Progreso</span>
<span class="stat-value" id="progress">0 / 15</span>
</div>
</div>

<div id="quiz"></div>

<div class="actions">
<button class="btn-primary" onclick="finishQuiz()">Calificar examen</button>
<button class="btn-secondary" onclick="reiniciarExamen()">Reiniciar</button>
</div>

<div class="result" id="resultado">
<h2>Resultado Final</h2>
<p id="puntajeTexto"></p>
<div id="revision"></div>
</div>

</div>

<!-- SCRIPT BASE: Carga e interactividad garantizada -->
<script>
var questions = [
{ q:"CIUDAD es a HOMBRE como COLMENA es a ___", o:["Hormiga","Mosquito","Araña","Abeja"], a:3, exp:"La relación es lugar donde vive o se agrupa." },
{ q:"BATIDO es a BATIR como ZUMO es a ___", o:["Exprimir","Aplastar","Machacar","Succionar"], a:0, exp:"Producto y acción que lo origina." },
{ q:"CONSEJERO es a CONSEJO como CANTANTE es a ___", o:["Fama","Éxito","Composición","Canción"], a:3, exp:"Persona y resultado de su función." },
{ q:"ESTUFA es a CALOR como NEVERA es a ___", o:["Temperatura","Frío","Conservación","Congelación"], a:1, exp:"Objeto y efecto principal." },
{ q:"MARTILLO es a CLAVO como DESTORNILLADOR es a ___", o:["Hierro","Tornillo","Remache","Herramienta"], a:1, exp:"Herramienta y objeto." },
{ q:"ASA es a CESTA como POMO es a ___", o:["Puerta","Tirador","Envase","Manillar"], a:0, exp:"Parte de un objeto." },
{ q:"LÍQUIDO es a SOPA como SÓLIDO es a ___", o:["Comer","Bebida","Plátano","Gaseoso"], a:2, exp:"Categoría y ejemplo." },
{ q:"BALLENA es a ACUÁTICO como LEÓN es a ___", o:["Carnívoro","Terrestre","Depredador","Devorador"], a:1, exp:"Animal y medio donde vive." },
{ q:"RESTAR es a SUMAR como ARREGLAR es a ___", o:["Incluir","Corregir","Estropear","Resarcir"], a:2, exp:"Relación de oposición." },
{ q:"MÁS es a MENOS como DESPUÉS es a ___", o:["Tiempo","Siguiente","Pronto","Antes"], a:3, exp:"Antónimos." },
{ q:"FÉMUR es a HUESO como CORAZÓN es a ___", o:["Glándula","Vena","Músculo","Arteria"], a:2, exp:"Especie y género." },
{ q:"CUATRO es a CINCO como CUADRADO es a ___", o:["Triángulo","Heptágono","Hexágono","Pentágono"], a:3, exp:"Aumento de una unidad." },
{ q:"HARINA es a TRIGO como CERVEZA es a ___", o:["Manzana","Patata","Cebada","Alfalfa"], a:2, exp:"Producto y materia prima." },
{ q:"PIE es a CUERPO como BOMBILLA es a ___", o:["Ojos","Luz","Vela","Lámpara"], a:3, exp:"Parte y todo." },
{ q:"EXCAVAR es a CAVIDAD como ALINEAR es a ___", o:["Seguido","Recta","Acodo","Ensamblar"], a:1, exp:"Acción y resultado." }
];

var current = 0;
var answers = new Array(questions.length).fill(null);
var examenFinalizado = false;

function actualizarProgreso(){
  var respondidas = answers.filter(function(a){ return a !== null; }).length;
  document.getElementById("progress").textContent = respondidas + " / " + questions.length;
  document.getElementById("qNum").textContent = current + 1;
}

function render(){
  var quiz = document.getElementById("quiz");
  if(!quiz) return;
  quiz.innerHTML = "";

  questions.forEach(function(q, i){
    var div = document.createElement("div");
    div.className = "question" + (i === current ? " active" : "");
    var opts = "";

    q.o.forEach(function(op, j){
      var extraClass = "";
      if(answers[i] === j) extraClass += " selected";

      if(examenFinalizado){
        if(j === q.a) extraClass += " correct-answer";
        if(answers[i] === j && j !== q.a) extraClass += " wrong-answer";
      }

      var letra = String.fromCharCode(65 + j);
      opts += '<div class="option' + extraClass + '" onclick="selectOption(' + i + ',' + j + ')">' + letra + '. ' + op + '</div>';
    });

    var btnNav = "";
    if(i === questions.length - 1){
      btnNav = '<button class="finish" onclick="finishQuiz()">Finalizar</button>';
    } else {
      btnNav = '<button class="next" onclick="nextQuestion()">Siguiente</button>';
    }

    var disabledPrev = i === 0 ? "disabled" : "";
    div.innerHTML = '<h3>' + q.q + '</h3>' + opts +
      '<div class="navigation">' +
        '<button class="prev" onclick="prevQuestion()" ' + disabledPrev + '>Anterior</button>' +
        btnNav +
      '</div>';

    quiz.appendChild(div);
  });
  actualizarProgreso();
}

function selectOption(i, j){
  if(examenFinalizado) return;
  answers[i] = j;
  render();
}

function nextQuestion(){
  if(current < questions.length - 1){
    current++;
    render();
    window.scrollTo({top: 0, behavior: "smooth"});
  }
}

function prevQuestion(){
  if(current > 0){
    current--;
    render();
  }
}

function finishQuiz(){
  if(examenFinalizado) return;

  if(window.evaluarSecuenciaGlobal && window.evaluarSecuenciaGlobal()) return;

  examenFinalizado = true;

  var total = questions.length;
  var correctas = 0;

  questions.forEach(function(q, i){
    if(answers[i] === q.a) correctas++;
  });

  var porcentaje = Math.round((correctas / total) * 100);

  var revisionHTML = "";
  questions.forEach(function(q, i){
    var respuestaUsuario = answers[i];
    if(respuestaUsuario === q.a){
      revisionHTML += '<div class="review-item correcta"><h4>Pregunta ' + (i+1) + ': ✅ Correcta</h4><div class="explicacion">' + q.exp + '</div></div>';
    } else if(respuestaUsuario === null){
      revisionHTML += '<div class="review-item sin-responder"><h4>Pregunta ' + (i+1) + ': ⚠️ Sin responder</h4><div class="explicacion">Respuesta correcta: ' + q.o[q.a] + '</div></div>';
    } else {
      revisionHTML += '<div class="review-item incorrecta"><h4>Pregunta ' + (i+1) + ': ❌ Incorrecta</h4><div class="explicacion">Correcta: ' + q.o[q.a] + '<br><br>' + q.exp + '</div></div>';
    }
  });

  document.getElementById("puntajeTexto").innerHTML = 
    '<div style="background:white;padding:20px;border-radius:15px;margin-bottom:20px;">' +
      '<h2>' + correctas + '/' + total + '</h2>' +
      '<p style="font-size:26px;font-weight:bold;margin-top:10px;color:#e11d48;">' + porcentaje + '%</p>' +
    '</div>';

  document.getElementById("revision").innerHTML = revisionHTML;
  document.getElementById("resultado").style.display = "block";
  render();

  if(window.enviarResultadoFinal){
    window.enviarResultadoFinal({ correctas: correctas, total: total, porcentaje: porcentaje });
  }
}

function toggleRanking(){
  var panel = document.getElementById("rankingPanel");
  if(panel) panel.classList.toggle("hidden");
}

function reiniciarExamen(){
  location.reload();
}

window.onload = function() {
  render();
};
</script>

<!-- Módulos cargados al final -->
<script type="module">
  import { esModoSecuencia, guardarResultadoExamen } from "../secuenciaExamenes.js";

  window.evaluarSecuenciaGlobal = function() {
    if (esModoSecuencia()) {
      var total = questions.length;
      var correctas = 0;

      questions.forEach(function(q, i){
        if(answers[i] === q.a) correctas++;
      });

      // 1. Guardar notas del módulo verbal
      guardarResultadoExamen("verbal", correctas, total);
      alert("¡Etapa Verbal completada! Avanzando a la Etapa 2: Habilidad Numérica.");

      // 2. Lista completa con los 17 exámenes de aptitud numérica
      var listaExamenesNumerica = [
        "numerica-examen1.html",
        "numerica-examen2.html",
        "numerica-examen3.html",
        "numerica-examen4.html",
        "numerica-examen5.html",
        "numerica-examen6.html",
        "numerica-examen7.html",
        "numerica-examen8.html",
        "numerica-examen9.html",
        "numerica-examen10.html",
        "numerica-examen11.html",
        "numerica-examen12.html",
        "numerica-examen13.html",
        "numerica-examen14.html",
        "numerica-examen15.html",
        "numerica-examen16.html",
        "numerica-examen17.html"
      ];

      // 3. Seleccionar uno al azar
      var indiceAzar = Math.floor(Math.random() * listaExamenesNumerica.length);
      var examenElegido = listaExamenesNumerica[indiceAzar];

      // 4. Redirigir al examen elegido (al estar en /data/, carga directo el archivo hermano)
      window.location.href = examenElegido;
      return true;
    }
    return false;
  };
</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

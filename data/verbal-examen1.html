<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Química - Examen 1</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#ecfeff,#f0f9ff,#cffafe);
  color:#0f172a;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  font-size: clamp(1.9rem, 4vw, 2.7rem);
  margin-bottom:10px;
  color:#0891b2;
}

.header p{
  color:#0f766e;
  opacity:0.9;
}

.top-link{
  display:inline-block;
  margin-top:12px;
  color:#0891b2;
  text-decoration:none;
  font-weight:bold;
}

.stats-bar{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #bae6fd;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.stat-label{
  display:block;
  font-size:0.9rem;
  color:#0891b2;
  margin-bottom:4px;
  font-weight:bold;
}

.stat-value{
  display:block;
  font-size:1.15rem;
  color:#0f172a;
  font-weight:bold;
}

.question{
  display:none;
  background:#f8feff;
  border:1px solid #bae6fd;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
}

.question.active{
  display:block;
}

.question h3{
  font-size:1.08rem;
  line-height:1.6;
  color:#0f766e;
  margin-bottom:14px;
}

.question p{
  margin-bottom:14px;
  line-height:1.6;
  color:#334155;
}

.option{
  display:block;
  background:#ecfeff;
  padding:12px 14px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
  border:1px solid transparent;
}

.option:hover{
  background:#cffafe;
}

.option.selected{
  background:#06b6d4;
  color:white;
}

.option.correct-answer{
  background:#dcfce7 !important;
  color:#166534 !important;
}

.option.wrong-answer{
  background:#fee2e2 !important;
  color:#991b1b !important;
}

.option input{
  display:none;
}

.navigation{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:18px;
}

button{
  border:none;
  border-radius:14px;
  padding:12px 20px;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

.prev{
  background:#a5f3fc;
  color:#0f766e;
}

.next{
  background:#06b6d4;
  color:white;
}

.finish{
  background:#0891b2;
  color:white;
}

.actions{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:25px;
}

.btn-primary{
  background:#0891b2;
  color:white;
}

.btn-secondary{
  background:#cffafe;
  color:#0f766e;
}

.result{
  margin-top:25px;
  padding:20px;
  border-radius:18px;
  background:#f0fdfa;
  border:1px solid #99f6e4;
  display:none;
}

.review-item{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.review-item.correcta{
  border-left:6px solid #22c55e;
}

.review-item.incorrecta{
  border-left:6px solid #ef4444;
}

.review-item.sin-responder{
  border-left:6px solid #f59e0b;
}

.explicacion{
  margin-top:8px;
  padding:10px;
  background:#f8fafc;
  border-radius:10px;
}

.party-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
  margin-top:18px;
}

.party-card{
  background:#ffffff;
  border:1px solid #bae6fd;
  border-radius:16px;
  padding:16px;
  text-align:center;
}

.party-winner{
  margin-top:16px;
  padding:14px;
  border-radius:14px;
  background:#ecfeff;
  border:1px solid #7dd3fc;
  font-weight:bold;
  text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧪 Química - Examen 1</h1>
<p>Versión digital interactiva</p>
<a class="top-link" href="../quimica.html">
← Volver a Química
</a>
</div>

<div class="stats-bar">

<div class="stat-box">
<span class="stat-label">
Pregunta actual
</span>

<span class="stat-value">
<span id="qNum">1</span> / 20
</span>
</div>

<div class="stat-box">
<span class="stat-label">
Progreso
</span>

<span class="stat-value" id="progress">
0 / 20
</span>
</div>

</div>

<form id="quizForm">

<div class="question active">

<h3>1. De moles a átomos</h3>

<p>
Convertir 2.5 moles de Hierro (Fe)
a átomos de Hierro.
</p>

<label class="option">
<input type="radio" name="q1" value="a">
A. 1.5055 × 10²³ átomos
</label>

<label class="option">
<input type="radio" name="q1" value="b">
B. 1.5055 × 10²⁴ átomos
</label>

<label class="option">
<input type="radio" name="q1" value="c">
C. 1.5055 × 10²⁵ átomos
</label>

<label class="option">
<input type="radio" name="q1" value="d">
D. 6.022 × 10²³ átomos
</label>

</div>

<!-- PEGA AQUÍ TODAS LAS DEMÁS PREGUNTAS EXACTAMENTE IGUAL -->

<div class="actions">

<button type="button"
class="btn-primary"
onclick="calificarExamen()">
Calificar examen
</button>

<button type="button"
class="btn-secondary"
onclick="reiniciarExamen()">
Reiniciar
</button>

</div>

<div class="result" id="resultado">

<h2>Resultado</h2>

<p id="puntajeTexto"></p>

<div id="revision"></div>

</div>

<div class="result"
id="resultadoParty"
style="display:none;">

<h2>Resultado final de la sala</h2>

<div id="partyResultadoContenido"></div>

</div>

</form>

</div>

<script>

const respuestasCorrectas = {
q1:"b"
};

const textosCorrectos = {
q1:"B. 1.5055 × 10²⁴ átomos"
};

const explicaciones = {
q1:"Para pasar de moles a átomos se multiplica por el número de Avogadro."
};

let current = 0;
let examenFinalizado = false;

const preguntas =
document.querySelectorAll(".question");

function actualizarProgreso(){

const respondidas =
document.querySelectorAll(
"input[type='radio']:checked"
).length;

document.getElementById("progress").textContent =
`${respondidas} / ${preguntas.length}`;

document.getElementById("qNum").textContent =
current + 1;

}

function mostrarPregunta(index){

preguntas.forEach((p,i)=>{

p.classList.remove("active");

if(i === index){
p.classList.add("active");
}

});

actualizarProgreso();

}

function siguientePregunta(){

if(current < preguntas.length - 1){

current++;

mostrarPregunta(current);

}

}

function anteriorPregunta(){

if(current > 0){

current--;

mostrarPregunta(current);

}

}

document.querySelectorAll(".option")
.forEach(option=>{

option.addEventListener("click",()=>{

if(examenFinalizado) return;

const radio =
option.querySelector("input");

radio.checked = true;

const question =
option.closest(".question");

question.querySelectorAll(".option")
.forEach(o=>{
o.classList.remove("selected");
});

option.classList.add("selected");

actualizarProgreso();

});

});

function limpiarEstadosVisuales(){

document.querySelectorAll(".option")
.forEach(o=>{

o.classList.remove(
"correct-answer",
"wrong-answer"
);

});

}

function calificarExamen(){

if(examenFinalizado) return;

examenFinalizado = true;

let total =
Object.keys(respuestasCorrectas).length;

let correctas = 0;

let revisionHTML = "";

limpiarEstadosVisuales();

for(let pregunta in respuestasCorrectas){

const seleccionada =
document.querySelector(
`input[name="${pregunta}"]:checked`
);

const opciones =
document.querySelectorAll(
`input[name="${pregunta}"]`
);

const numero =
pregunta.replace("q","");

opciones.forEach(op=>{

const label =
op.closest(".option");

if(op.value ===
respuestasCorrectas[pregunta]){

label.classList.add(
"correct-answer"
);

}

});

if(seleccionada){

const labelSeleccionado =
seleccionada.closest(".option");

if(seleccionada.value ===
respuestasCorrectas[pregunta]){

correctas++;

revisionHTML += `
<div class="review-item correcta">

<h4>
Pregunta ${numero}: ✅ Correcta
</h4>

<div class="explicacion">
${explicaciones[pregunta]}
</div>

</div>
`;

}else{

labelSeleccionado.classList.add(
"wrong-answer"
);

revisionHTML += `
<div class="review-item incorrecta">

<h4>
Pregunta ${numero}: ❌ Incorrecta
</h4>

<div class="explicacion">

<strong>Respuesta correcta:</strong>

${textosCorrectos[pregunta]}

<br><br>

${explicaciones[pregunta]}

</div>

</div>
`;

}

}else{

revisionHTML += `
<div class="review-item sin-responder">

<h4>
Pregunta ${numero}: ⚠️ Sin responder
</h4>

<div class="explicacion">

<strong>Respuesta correcta:</strong>

${textosCorrectos[pregunta]}

</div>

</div>
`;

}

}

const porcentaje =
((correctas / total) * 100)
.toFixed(1);

document.getElementById("puntajeTexto")
.innerHTML = `

Obtuviste
<strong>${correctas}</strong>

de

<strong>${total}</strong>

correctas.<br>

Nota final:

<strong>${porcentaje}%</strong>

`;

document.getElementById("revision")
.innerHTML = revisionHTML;

document.getElementById("resultado")
.style.display = "block";

mostrarPregunta(current);

}

function reiniciarExamen(){

location.reload();

}

preguntas.forEach((pregunta,index)=>{

const nav =
document.createElement("div");

nav.className = "navigation";

nav.innerHTML = `

<button class="prev"
onclick="anteriorPregunta()"
${index===0 ? "disabled" : ""}>
Anterior
</button>

${index===preguntas.length-1

? `<button class="finish"
onclick="calificarExamen()">
Finalizar
</button>`

: `<button class="next"
onclick="siguientePregunta()">
Siguiente
</button>`

}

`;

pregunta.appendChild(nav);

});

mostrarPregunta(0);

</script>

<script type="module"
src="../party/party-timer.js"></script>

<script type="module"
src="../party/party-resultados.js"></script>

</body>
</html>

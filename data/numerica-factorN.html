<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factor N</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f2027,#2c5364);
  color:#fff;
  padding:20px;
}

.container{
  max-width:850px;
  margin:auto;
  background:rgba(255,255,255,0.08);
  padding:25px;
  border-radius:20px;
}

h1,p{text-align:center;}

.config{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  justify-content:center;
  margin:20px 0;
}

select, button{
  padding:10px;
  border-radius:10px;
  border:none;
}

.start-btn{
  background:#ffd54f;
  font-weight:bold;
  cursor:pointer;
}

.topbar{
  display:none;
  justify-content:space-between;
  margin-bottom:20px;
}

.sum{
  text-align:center;
  font-size:1.7rem;
  margin:20px 0;
}

.line{
  border-top:3px solid #fff;
  width:120px;
  margin:10px auto;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:20px;
}

.true{background:#4caf50;color:white;}
.false{background:#f44336;color:white;}

.result{
  display:none;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">
<h1>Factor N</h1>
<p>Verdadero o falso</p>

<div id="status">Cargando banco...</div>

<div class="config" id="config" style="display:none;">
  <select id="count">
    <option value="5">5</option>
    <option value="10" selected>10</option>
    <option value="20">20</option>
    <option value="30">30</option>
  </select>

  <select id="time">
    <option value="0">Sin tiempo</option>
    <option value="60">1 min</option>
    <option value="120">2 min</option>
    <option value="300" selected>5 min</option>
  </select>

  <button class="start-btn" onclick="start()">Empezar</button>
</div>

<div class="topbar" id="topbar">
  <div id="progress"></div>
  <div id="timer"></div>
</div>

<div id="quiz"></div>

<div class="result" id="result">
  <h2 id="score"></h2>
  <button onclick="location.reload()">Reiniciar</button>
</div>

</div>

<script>
let allQuestions = [];
let questions = [];
let current = 0;
let score = 0;
let timerInterval;
let timeLeft = 0;

// CARGAR JSON
async function load(){
  try{
    const res = await fetch("../banco/mate.json");
    const data = await res.json();

    allQuestions = data;
    document.getElementById("status").innerText =
      "Banco cargado: " + allQuestions.length + " preguntas";

    document.getElementById("config").style.display = "flex";
  }catch(e){
    document.getElementById("status").innerText =
      "Error cargando JSON";
    console.error(e);
  }
}

function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

function start(){
  const count = parseInt(document.getElementById("count").value);
  timeLeft = parseInt(document.getElementById("time").value);

  questions = shuffle([...allQuestions]).slice(0,count);

  current = 0;
  score = 0;

  document.getElementById("config").style.display = "none";
  document.getElementById("status").style.display = "none";
  document.getElementById("topbar").style.display = "flex";

  if(timeLeft>0){
    updateTimer();
    timerInterval = setInterval(()=>{
      timeLeft--;
      updateTimer();
      if(timeLeft<=0){
        finish();
      }
    },1000);
  }else{
    document.getElementById("timer").innerText="Sin tiempo";
  }

  render();
}

function updateTimer(){
  const m = Math.floor(timeLeft/60);
  const s = timeLeft%60;
  document.getElementById("timer").innerText = m+":"+String(s).padStart(2,"0");
}

function render(){
  if(current>=questions.length){
    finish();
    return;
  }

  const q = questions[current];
  const quiz = document.getElementById("quiz");

  document.getElementById("progress").innerText =
    "Pregunta "+(current+1)+" / "+questions.length;

  let html = `<div class="sum">`;

  q.nums.forEach(n=>{
    html += n + "<br>";
  });

  html += `<div class="line"></div>${q.result}</div>`;

  html += `
  <div class="buttons">
    <button class="true" onclick="answer(true)">✔ Verdadero</button>
    <button class="false" onclick="answer(false)">❌ Falso</button>
  </div>`;

  quiz.innerHTML = html;
}

function answer(user){
  const q = questions[current];

  if(user === q.isCorrect){
    score++;
  }

  current++;
  render();
}

function finish(){
  clearInterval(timerInterval);

  document.getElementById("quiz").innerHTML="";
  document.getElementById("result").style.display="block";

  document.getElementById("score").innerText =
    "Puntaje: "+score+" / "+questions.length;
}

load();
</script>

</body>
</html>

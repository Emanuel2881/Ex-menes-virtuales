<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Habilidad Numérica 11</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#eff6ff,#dbeafe,#bfdbfe);
color:#1e3a8a;
min-height:100vh;
padding:30px 15px;
}

.container{
max-width:950px;
margin:auto;
background:rgba(255,255,255,0.95);
padding:25px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:2.3rem;
color:#1d4ed8;
margin-bottom:10px;
}

.header p{
color:#1e40af;
}

.stats-bar{
display:flex;
gap:12px;
justify-content:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.stat-box{
background:#fff;
border:1px solid #93c5fd;
border-radius:14px;
padding:12px 18px;
min-width:150px;
text-align:center;
}

.question{
display:none;
background:#eff6ff;
border:1px solid #93c5fd;
border-radius:20px;
padding:20px;
}

.question.active{
display:block;
}

.option{
background:#dbeafe;
padding:12px;
margin:10px 0;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#bfdbfe;
}

.option.selected{
background:#2563eb;
color:white;
}

.option.correct-answer{
background:#bbf7d0;
}

.option.wrong-answer{
background:#fecaca;
}

.navigation{
text-align:center;
margin-top:15px;
}

button{
border:none;
padding:10px 15px;
border-radius:10px;
margin:5px;
cursor:pointer;
}

.next{
background:#2563eb;
color:white;
}

.prev{
background:#93c5fd;
}

.finish{
background:#1d4ed8;
color:white;
}

.actions{
text-align:center;
margin-top:20px;
}

.result{
display:none;
margin-top:20px;
padding:20px;
background:#eff6ff;
border-radius:15px;
}

.review-item{
background:white;
padding:14px;
margin:12px 0;
border-left:5px solid gray;
border-radius:12px;
}

.correcta{
border-left-color:green;
}

.incorrecta{
border-left-color:red;
}

.sin-responder{
border-left-color:orange;
}

.explicacion{
margin-top:8px;
font-size:0.92rem;
color:#374151;
}

/* PANEL RANKING */

.ranking-panel{
position:fixed;
left:0;
top:0;
width:320px;
height:100vh;
background:white;
box-shadow:4px 0 20px rgba(0,0,0,0.1);
padding:20px;
overflow-y:auto;
z-index:999;
transition:transform 0.3s ease;
}

.ranking-panel.hidden{
transform:translateX(-100%);
}

.toggle-ranking{
position:fixed;
left:15px;
top:15px;
z-index:1000;
background:#2563eb;
color:white;
border:none;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.ranking-content{
margin-top:60px;
}

@media(max-width:768px){

.ranking-panel{
width:260px;
}

.container{
padding:18px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧠 Habilidad Numérica 11</h1>
<p>Examen interactivo</p>
</div>

<div class="stats-bar">

<div class="stat-box">
<span>Pregunta</span><br>
<b id="qNum">1</b> / 24
</div>

<div class="stat-box">
<span>Progreso</span><br>
<b id="progress">0 / 24</b>
</div>

</div>

<div id="quiz"></div>

<div class="actions">
<button onclick="finish()">Calificar</button>
<button onclick="location.reload()">Reiniciar</button>
</div>

<div class="result" id="resultado">

<h2 style="margin-bottom:20px;">
Resultado Final
</h2>

<p id="score"></p>

<div id="review"></div>

</div>

</div>

    o: ["50.000", "55.000", "57.000", "60.000", "Ninguna de ellas"],

  },

  },
  {
    q: "29. ¿Qué número debe sustituir a la T en este ejemplo de división correcta?\n\n T2T3 : 1039 = T",

  },
  {
    q: "30. 50 % de 6.300 =",
    o: ["50", "126", "315", "3.500", "Ninguna de ellas"],
    a: 4,
    exp: "El 50% de 6,300 es la mitad, es decir, 3,150. Como no figura en la lista de opciones, la respuesta es 'Ninguna de ellas'[cite: 1429]."
  },
  {
    q: "31. ¿Cuál es el número MAS PEQUEÑO que es divisible exactamente por 10 y por 15?",
    o: ["60", "30", "25", "15", "Ninguna de ellas"],
    a: 1,
    exp: "El mínimo común múltiplo (m.c.m) de 10 y 15 es 30[cite: 1429, 1430]."
  },
  {
    q: "32. Si un bolígrafo cuesta 1,20 euros, ¿cuánto costarán 12 bolígrafos?",
    o: ["12,40", "14,40", "15,00", "16,20", "Ninguna de ellas"],
    a: 1,
    exp: "Multiplicamos la cantidad por el coste unitario: 12 * 1,20 = 14,40 euros."
  },
  {
    q: "33. ¿Qué cifra debería sustituir a la J en esta multiplicación cuyo resultado es correcto?\n\n  1 J 5 6\n x    J\n---------\n3 5 8 2 J",
    o: ["3", "4", "7", "9", "Ninguna de ellas"],

    exp: "Para J=7: 1756 * 7 = 12292. Para J=9: 1956 * 9 = 17604. Ninguna de las opciones propuestas de forma directa cumple la igualdad aritmética exacta, resultando en 'Ninguna de ellas'[cite: 1442, 1443]."

  },

    a: 2,

  }
];

let current=0;
let answers=new Array(questions.length).fill(null);
let done=false;

function render(){

const quiz=document.getElementById("quiz");

quiz.innerHTML="";

questions.forEach((q,i)=>{

const div=document.createElement("div");

div.className="question"+(i===current?" active":"");

let opts="";

q.o.forEach((op,j)=>{

let cls="";

if(answers[i]===j){

cls+=" selected";

}

if(done){

if(j===q.a){

cls+=" correct-answer";

}

if(answers[i]===j && j!==q.a){

cls+=" wrong-answer";

}

}

opts+=`

<div class="option${cls}" onclick="select(${i},${j})">
${op}
</div>

`;

});

div.innerHTML=`

<h3>${q.q}</h3>

${opts}

<div class="navigation">

<button class="prev"
onclick="prev()"
${i===0?"disabled":""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish" onclick="finish()">Finalizar</button>`

: `<button class="next" onclick="next()">Siguiente</button>`

}

</div>

`;

quiz.appendChild(div);

});

update();

}

function select(i,j){

if(done)return;

answers[i]=j;

render();

}

function next(){

if(answers[current]===null){

alert("Responde primero");

return;

}

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function prev(){

current--;

render();

}

function update(){

document.getElementById("qNum").textContent=current+1;

document.getElementById("progress").textContent=
answers.filter(a=>a!==null).length+" / "+questions.length;

}

function finish(){

done=true;

let correct=0;
let html="";

questions.forEach((q,i)=>{

if(answers[i]===q.a){

correct++;

}

});

let porcentaje=Math.round(
(correct/questions.length)*100
);

const bots=[];

for(let i=1;i<=30;i++){

bots.push({
nombre:`Bot_${i}`,
nota:Math.floor(Math.random()*71)+30
});

}

const ranking=[
...bots,
{
nombre:"Tú",
nota:porcentaje,
usuario:true
}
];

ranking.sort((a,b)=>b.nota-a.nota);

let debajo=ranking.filter(
p=>porcentaje>p.nota
).length;

let iguales=ranking.filter(
p=>porcentaje===p.nota
).length;

let percentil=Math.round(
(
debajo+(0.5*iguales)
)
/ranking.length
*100
);

if(percentil<1){
percentil=1;
}

if(percentil>99){
percentil=99;
}

let nivel="Muy bajo";

if(percentil>=90){
nivel="Excelente";
}
else if(percentil>=75){
nivel="Muy bueno";
}
else if(percentil>=60){
nivel="Bueno";
}
else if(percentil>=40){
nivel="Promedio";
}
else if(percentil>=20){
nivel="Bajo";
}

questions.forEach((q,i)=>{

let estado="";

if(answers[i]===null){
estado="sin-responder";
}
else if(answers[i]===q.a){
estado="correcta";
}
else{
estado="incorrecta";
}

html+=`

<div class="review-item ${estado}">

<h3>
Pregunta ${i+1}
</h3>

<p style="margin-top:8px;">
${q.q}
</p>

<br>

<p>
<b>Tu respuesta:</b>

${
answers[i]!==null
?
q.o[answers[i]]
:
"Sin responder"
}
</p>

<p style="margin-top:6px;">
<b>Correcta:</b>

document.getElementById("rankingPanel")

window.mostrarResultadosParty = function(data){

const ranking=[...data].sort((a,b)=>b.porcentaje-a.porcentaje);

let html=`<div class="party-grid">`;

ranking.forEach((j,i)=>{

let medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"";

html+=`

<div class="party-card">

<h3>
${medal} Jugador ${i+1}
</h3>

<p>
${j.correctas}/${j.total}
</p>

<p>
${j.porcentaje}%
</p>

</div>

`;

});

html+=`</div>`;

html+=`

<div class="party-winner">

🏆 Mejor:
${ranking[0].porcentaje}%

</div>

`;

document.getElementById("partyResultadoContenido")
.innerHTML=html;

document.getElementById("resultadoParty")
.style.display="block";

};

render();

</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Química - Examen 3</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#ecfeff,#f0f9ff,#cffafe);
  color:#0f172a;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  font-size: clamp(1.9rem, 4vw, 2.7rem);
  margin-bottom:10px;
  color:#0891b2;
}

.header p{
  color:#0f766e;
  opacity:0.9;
}

.top-link{
  display:inline-block;
  margin-top:12px;
  color:#0891b2;
  text-decoration:none;
  font-weight:bold;
}

.stats-bar{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #bae6fd;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.stat-label{
  display:block;
  font-size:0.9rem;
  color:#0891b2;
  margin-bottom:4px;
  font-weight:bold;
}

.stat-value{
  display:block;
  font-size:1.15rem;
  color:#0f172a;
  font-weight:bold;
}

.question{
  display:none;
  background:#f8feff;
  border:1px solid #bae6fd;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
}

.question.active{
  display:block;
}

.question h3{
  font-size:1.08rem;
  line-height:1.6;
  color:#0f766e;
  margin-bottom:14px;
}

.option{
  display:block;
  background:#ecfeff;
  padding:12px 14px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#cffafe;
}

.option.selected{
  background:#06b6d4;
  color:white;
}

.option.correct-answer{
  background:#dcfce7 !important;
  color:#166534 !important;
}

.option.wrong-answer{
  background:#fee2e2 !important;
  color:#991b1b !important;
}

.navigation{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:18px;
}

button{
  border:none;
  border-radius:14px;
  padding:12px 20px;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

.prev{
  background:#a5f3fc;
  color:#0f766e;
}

.next{
  background:#06b6d4;
  color:white;
}

.finish{
  background:#0891b2;
  color:white;
}

.actions{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:25px;
}

.btn-primary{
  background:#0891b2;
  color:white;
}

.btn-secondary{
  background:#cffafe;
  color:#0f766e;
}

.result{
  margin-top:25px;
  padding:20px;
  border-radius:18px;
  background:#f0fdfa;
  border:1px solid #99f6e4;
  display:none;
}

.review-item{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.review-item.correcta{
  border-left:6px solid #22c55e;
}

.review-item.incorrecta{
  border-left:6px solid #ef4444;
}

.review-item.sin-responder{
  border-left:6px solid #f59e0b;
}

.explicacion{
  margin-top:8px;
  padding:10px;
  background:#f8fafc;
  border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧪 Química - Examen 3</h1>
<p>Configuración electrónica, enlaces y biomoléculas</p>

<a class="top-link" href="../quimica.html">
← Volver a Química
</a>
</div>

<div class="stats-bar">

<div class="stat-box">
<span class="stat-label">Pregunta actual</span>
<span class="stat-value">
<span id="qNum">1</span> / 22
</span>
</div>

<div class="stat-box">
<span class="stat-label">Progreso</span>
<span class="stat-value" id="progress">
0 / 22
</span>
</div>

</div>

<div id="quiz"></div>

<div class="actions">

<button class="btn-primary"
onclick="finishQuiz()">
Calificar examen
</button>

<button class="btn-secondary"
onclick="reiniciarExamen()">
Reiniciar
</button>

</div>

<div class="result" id="resultado">

<h2>Resultado</h2>

<p id="puntajeTexto"></p>

<div id="revision"></div>

</div>

</div>

<script>

const questions = [

{
q:"¿Qué nombre reciben los elementos que se ubican en la zona sombreada de la tabla periódica?",
o:["Metales","Alcalinotérreos","Metaloides","De transición"],
a:2,
exp:"Los elementos en la línea escalonada son metaloides."
},

{
q:"¿Cuál es la configuración electrónica semidesarrollada del elemento K, si su número atómico es 19?",
o:[
"1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹",
"1s² 2s² 2p⁶ 3s² 3p⁶ 4s²",
"1s² 2s² 2p⁶ 3s² 3p⁵ 4s²",
"1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹"
],
a:0,
exp:"El potasio tiene 19 electrones."
},

{
q:"Del electrón se afirma lo siguiente:",
o:[
"Es neutro",
"Tiene carga negativa y masa diminuta",
"Es la partícula más pequeña",
"Tiene carga positiva"
],
a:1,
exp:"El electrón tiene carga negativa."
},

{
q:"¿Cuántas moléculas de H₂O hay en 0.5 moles de H₂O?",
o:[
"0.5",
"1.21 × 10²⁴",
"3.011 × 10²³",
"9.05"
],
a:2,
exp:"0.5 × 6.022×10²³."
},

{
q:"Orden creciente de electronegatividad:",
o:[
"Na < Mg < Si < P < S < Cl",
"Na < Mg < P < Si < Cl < S",
"Na < Si < Mg < Cl < P < S",
"Cl < S < P < Si < Mg < Na"
],
a:0,
exp:"La electronegatividad aumenta hacia la derecha."
},

{
q:"¿Cuántos gramos de CO₂ hay en 0.05 moles?",
o:[
"2.20 g",
"1.4 g",
"1.40 g",
"0.0013 g"
],
a:2,
exp:"0.05 × 44.01 ≈ 1.40 g."
},

{
q:"¿Qué número de oxidación utiliza el S en Cu₂SO₃?",
o:["-4","+4","+6","-3"],
a:1,
exp:"En sulfito el azufre usa +4."
},

{
q:"¿Cuál es el elemento más electronegativo?",
o:["Oxígeno","Cloro","Hidrógeno","Flúor"],
a:3,
exp:"El flúor es el más electronegativo."
},

{
q:"¿Qué tipo de enlace se forma en CH₄?",
o:["Polar","Apolar","Iónico","Metálico"],
a:1,
exp:"CH₄ es covalente apolar."
},

{
q:"El término orgánico describe moléculas formadas por:",
o:[
"Carbono e hidrógeno",
"Hierro e hidrógeno",
"Hierro y nitrógeno",
"Sodio y cloro"
],
a:0,
exp:"Los compuestos orgánicos contienen carbono."
},

{
q:"Nombre clásico de Cl₂O₇:",
o:[
"Heptaóxido de dicloro",
"Anhídrido de cloro VII",
"Óxido clórico",
"Anhídrido perclórico"
],
a:3,
exp:"Es el anhídrido perclórico."
},

{
q:"Nombre de H₂Te(ac):",
o:[
"Hidruro de telurio",
"Teluro de hidrógeno",
"Ácido telurhídrico",
"Monotelurio de dihidrógeno"
],
a:2,
exp:"En disolución acuosa es ácido telurhídrico."
},

{
q:"1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁴ corresponde a:",
o:[
"Manganeso",
"Cromo",
"Hierro",
"Vanadio"
],
a:1,
exp:"Corresponde al cromo."
},

{
q:"La fórmula general de carbohidratos es:",
o:[
"(CH₂O)n",
"(CH₂O₂)n",
"(2CH₂O)n",
"(CH₃O)n"
],
a:0,
exp:"Es la fórmula general clásica."
},

{
q:"Misma fórmula pero diferente estructura:",
o:[
"Sacarosa",
"Enlaces glucosídicos",
"Isómeros",
"Fructuosa"
],
a:2,
exp:"Eso define a los isómeros."
},

{
q:"Característica del enlace beta:",
o:[
"Recto y fácil de romper",
"Cruzado y difícil de romper",
"Recto y difícil de romper",
"Cruzado y fácil de romper"
],
a:1,
exp:"Los beta son más resistentes."
},

{
q:"Enlaces entre monosacáridos:",
o:[
"Glucosídicos",
"Peptídicos",
"Gamma",
"Éter"
],
a:0,
exp:"Los monosacáridos forman enlaces glucosídicos."
},

{
q:"Polisacárido de reserva animal:",
o:[
"Almidón",
"Celulosa",
"Quitina",
"Glucógeno"
],
a:3,
exp:"El glucógeno almacena energía."
},

{
q:"En estructura secundaria de proteína hay:",
o:[
"Puentes disulfuro",
"Puentes eléctricos",
"Puentes de hidrógeno",
"Puentes metálicos"
],
a:2,
exp:"Predominan los puentes de hidrógeno."
},

{
q:"Proceso de volver básica una proteína:",
o:[
"Estructura primaria",
"Estructura secundaria",
"Desnaturalización",
"Glucosilación"
],
a:2,
exp:"Pierde su estructura original."
},

{
q:"Proteínas que aceleran reacciones:",
o:[
"Reguladoras",
"Motoras",
"Enzimas",
"Transportadoras"
],
a:2,
exp:"Las enzimas son catalizadores."
},

{
q:"Organización de materia biológica:",
o:[
"Átomos, moléculas, células, tejidos, órganos, sistemas",
"Moléculas, átomos, órganos, tejidos, células, sistemas",
"Sistemas, órganos, tejidos, células, moléculas, átomos",
"Átomos, tejidos, moléculas, órganos, células, sistemas"
],
a:0,
exp:"Ese es el orden correcto."
}

];

let current = 0;
let answers = new Array(questions.length).fill(null);
let examenFinalizado = false;

const quiz = document.getElementById("quiz");

function actualizarProgreso(){

const respondidas =
answers.filter(a => a !== null).length;

document.getElementById("progress").textContent =
`${respondidas} / ${questions.length}`;

document.getElementById("qNum").textContent =
current + 1;

}

function render(){

quiz.innerHTML = "";

questions.forEach((q,i)=>{

let div = document.createElement("div");

div.className =
"question" + (i===current ? " active" : "");

let opts = "";

q.o.forEach((op,j)=>{

let extraClass = "";

if(answers[i] === j)
extraClass += " selected";

if(examenFinalizado){

if(j === q.a)
extraClass += " correct-answer";

if(answers[i] === j && j !== q.a){
extraClass += " wrong-answer";
}

}

opts += `
<div class="option${extraClass}"
onclick="selectOption(${i},${j})">

${String.fromCharCode(65+j)}. ${op}

</div>
`;

});

div.innerHTML = `

<h3>${i+1}. ${q.q}</h3>

${opts}

<div class="navigation">

<button class="prev"
onclick="prevQuestion()"
${i===0 ? "disabled" : ""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish"
onclick="finishQuiz()">
Finalizar
</button>`

: `<button class="next"
onclick="nextQuestion()">
Siguiente
</button>`

}

</div>

`;

quiz.appendChild(div);

});

actualizarProgreso();

}

function selectOption(i,j){

if(examenFinalizado) return;

answers[i] = j;

render();

}

function nextQuestion(){

if(current < questions.length-1){

current++;

render();

}

}

function prevQuestion(){

if(current > 0){

current--;

render();

}

}

function finishQuiz(){

if(examenFinalizado) return;

examenFinalizado = true;

let total = questions.length;

let correctas = 0;

let revisionHTML = "";

questions.forEach((q,i)=>{

const respuestaUsuario = answers[i];

if(respuestaUsuario === q.a){

correctas++;

revisionHTML += `
<div class="review-item correcta">

<h4>
Pregunta ${i+1}: ✅ Correcta
</h4>

<div class="explicacion">
${q.exp}
</div>

</div>
`;

}else if(respuestaUsuario === null){

revisionHTML += `
<div class="review-item sin-responder">

<h4>
Pregunta ${i+1}: ⚠️ Sin responder
</h4>

<div class="explicacion">
Respuesta correcta: ${q.o[q.a]}
</div>

</div>
`;

}else{

revisionHTML += `
<div class="review-item incorrecta">

<h4>
Pregunta ${i+1}: ❌ Incorrecta
</h4>

<div class="explicacion">

Correcta: ${q.o[q.a]}

<br><br>

${q.exp}

</div>

</div>
`;

}

});

const porcentaje =
((correctas/total)*100).toFixed(1);

document.getElementById("puntajeTexto")
.innerHTML = `

Obtuviste
<strong>${correctas}</strong>

de

<strong>${total}</strong>

correctas.<br>

Nota final:

<strong>${porcentaje}%</strong>

`;

document.getElementById("revision")
.innerHTML = revisionHTML;

document.getElementById("resultado")
.style.display = "block";

render();

}

function reiniciarExamen(){

location.reload();

}

render();

</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

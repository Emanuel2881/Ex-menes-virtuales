<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Química - Examen 2</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#ecfeff,#f0f9ff,#cffafe);
  color:#0f172a;
  min-height:100vh;
  padding:30px 15px;
}

.container{
  max-width:950px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  font-size: clamp(1.9rem, 4vw, 2.7rem);
  margin-bottom:10px;
  color:#0891b2;
}

.header p{
  color:#0f766e;
  opacity:0.9;
}

.top-link{
  display:inline-block;
  margin-top:12px;
  color:#0891b2;
  text-decoration:none;
  font-weight:bold;
}

.stats-bar{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-bottom:20px;
}

.stat-box{
  background:#fff;
  border:1px solid #bae6fd;
  border-radius:14px;
  padding:12px 18px;
  min-width:150px;
  text-align:center;
}

.stat-label{
  display:block;
  font-size:0.9rem;
  color:#0891b2;
  margin-bottom:4px;
  font-weight:bold;
}

.stat-value{
  display:block;
  font-size:1.15rem;
  color:#0f172a;
  font-weight:bold;
}

.question{
  display:none;
  background:#f8feff;
  border:1px solid #bae6fd;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
}

.question.active{
  display:block;
}

.question h3{
  font-size:1.08rem;
  line-height:1.6;
  color:#0f766e;
  margin-bottom:14px;
}

.option{
  display:block;
  background:#ecfeff;
  padding:12px 14px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#cffafe;
}

.option.selected{
  background:#06b6d4;
  color:white;
}

.option.correct-answer{
  background:#dcfce7 !important;
  color:#166534 !important;
}

.option.wrong-answer{
  background:#fee2e2 !important;
  color:#991b1b !important;
}

.navigation{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:18px;
}

button{
  border:none;
  border-radius:14px;
  padding:12px 20px;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

.prev{
  background:#a5f3fc;
  color:#0f766e;
}

.next{
  background:#06b6d4;
  color:white;
}

.finish{
  background:#0891b2;
  color:white;
}

.actions{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:25px;
}

.btn-primary{
  background:#0891b2;
  color:white;
}

.btn-secondary{
  background:#cffafe;
  color:#0f766e;
}

.result{
  margin-top:25px;
  padding:20px;
  border-radius:18px;
  background:#f0fdfa;
  border:1px solid #99f6e4;
  display:none;
}

.review-item{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.review-item.correcta{
  border-left:6px solid #22c55e;
}

.review-item.incorrecta{
  border-left:6px solid #ef4444;
}

.review-item.sin-responder{
  border-left:6px solid #f59e0b;
}

.explicacion{
  margin-top:8px;
  padding:10px;
  background:#f8fafc;
  border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧪 Química - Examen 2</h1>
<p>Propiedades, enlaces y reacciones químicas</p>

<a class="top-link" href="../quimica.html">
← Volver a química
</a>
</div>

<div class="stats-bar">

<div class="stat-box">
<span class="stat-label">Pregunta actual</span>
<span class="stat-value">
<span id="qNum">1</span> / 20
</span>
</div>

<div class="stat-box">
<span class="stat-label">Progreso</span>
<span class="stat-value" id="progress">
0 / 20
</span>
</div>

</div>

<div id="quiz"></div>

<div class="actions">

<button class="btn-primary"
onclick="finishQuiz()">
Calificar examen
</button>

<button class="btn-secondary"
onclick="reiniciarExamen()">
Reiniciar
</button>

</div>

<div class="result" id="resultado">

<h2>Resultado</h2>

<p id="puntajeTexto"></p>

<div id="revision"></div>

</div>

</div>

<script>

const questions = [

{
q:"¿Cuál es una propiedad extensiva?",
o:["Densidad","Masa y volumen","Color","Punto de ebullición"],
a:1,
exp:"La masa y volumen dependen de la cantidad de materia."
},

{
q:"¿Cómo se llama el paso de sólido a líquido?",
o:["Evaporación","Condensación","Sublimación","Fusión"],
a:3,
exp:"Ese cambio de estado se llama fusión."
},

{
q:"El agua es un:",
o:["Compuesto","Elemento","Átomo","Ion"],
a:0,
exp:"Está formada por hidrógeno y oxígeno."
},

{
q:"Una sustancia formada por un solo tipo de átomo es:",
o:["Elemento","Compuesto","Mezcla","Solución"],
a:0,
exp:"Eso define a un elemento."
},

{
q:"La unidad más pequeña de un elemento es:",
o:["Átomo","Mol","Protón","Neutrón"],
a:0,
exp:"El átomo conserva propiedades del elemento."
},

{
q:"Entre dos no metales se forma enlace:",
o:["Iónico","Covalente","Metálico","Nuclear"],
a:1,
exp:"Comparten electrones."
},

{
q:"Metal + no metal produce enlace:",
o:["Metálico","Covalente","Polar","Iónico"],
a:3,
exp:"Hay transferencia de electrones."
},

{
q:"Los fertilizantes sirven para:",
o:["Dar color","Secar plantas","Aportar nutrientes","Eliminar minerales"],
a:2,
exp:"Ayudan al crecimiento vegetal."
},

{
q:"Una propiedad percibida con sentidos es:",
o:["Extensiva","Cuantitativa","Propiedad cualitativa","Numérica"],
a:2,
exp:"No requiere medición."
},

{
q:"Los elementos se organizan en:",
o:["Lista química","Sistema orbital","Tabla periódica","Configuración"],
a:2,
exp:"La tabla periódica los ordena."
},

{
q:"Los halógenos tienen:",
o:["1 electrón","2 electrones","7 electrones de valencia","8 protones"],
a:2,
exp:"Pertenecen al grupo 17."
},

{
q:"Los bioelementos principales son:",
o:["Na y Cl","Ca y Mg","C, H, O, N, P, S","K y Fe"],
a:2,
exp:"Son esenciales para vida."
},

{
q:"¿Qué partículas participan en enlaces?",
o:["Protones","Electrones","Neutrones","Núcleos"],
a:1,
exp:"Los electrones participan directamente."
},

{
q:"La valencia indica:",
o:["Peso","Volumen","Capacidad de combinación","Número de neutrones"],
a:2,
exp:"Indica cómo se combina un átomo."
},

{
q:"Entre metales existe enlace:",
o:["Iónico","Covalente","Metálico","Polar"],
a:2,
exp:"Comparten electrones móviles."
},

{
q:"Los electrones externos se llaman:",
o:["Internos","De valencia","Neutrones","Orbitales"],
a:1,
exp:"Participan en reacciones."
},

{
q:"Los conductores eléctricos:",
o:["Tienen electrones libres","No tienen protones","Son líquidos","Son neutros"],
a:0,
exp:"Los electrones móviles conducen electricidad."
},

{
q:"Con col morada, verde indica solución:",
o:["Ácida","Neutra","Transparente","Básica"],
a:3,
exp:"El verde indica base."
},

{
q:"Una ecuación química contiene:",
o:["Solo productos","Solo reactivos","Reactivos y productos","Solo números"],
a:2,
exp:"Toda reacción tiene ambos."
},

{
q:"Una reacción que libera calor es:",
o:["Exotérmica","Endotérmica","Nuclear","Reversible"],
a:0,
exp:"Libera energía."
}

];

let current = 0;
let answers = new Array(questions.length).fill(null);
let examenFinalizado = false;

const quiz = document.getElementById("quiz");

function actualizarProgreso(){

const respondidas =
answers.filter(a => a !== null).length;

document.getElementById("progress").textContent =
`${respondidas} / ${questions.length}`;

document.getElementById("qNum").textContent =
current + 1;

}

function render(){

quiz.innerHTML = "";

questions.forEach((q,i)=>{

let div = document.createElement("div");

div.className =
"question" + (i===current ? " active" : "");

let opts = "";

q.o.forEach((op,j)=>{

let extraClass = "";

if(answers[i] === j)
extraClass += " selected";

if(examenFinalizado){

if(j === q.a)
extraClass += " correct-answer";

if(answers[i] === j && j !== q.a){
extraClass += " wrong-answer";
}

}

opts += `
<div class="option${extraClass}"
onclick="selectOption(${i},${j})">

${String.fromCharCode(65+j)}. ${op}

</div>
`;

});

div.innerHTML = `

<h3>${i+1}. ${q.q}</h3>

${opts}

<div class="navigation">

<button class="prev"
onclick="prevQuestion()"
${i===0 ? "disabled" : ""}>
Anterior
</button>

${i===questions.length-1

? `<button class="finish"
onclick="finishQuiz()">
Finalizar
</button>`

: `<button class="next"
onclick="nextQuestion()">
Siguiente
</button>`

}

</div>

`;

quiz.appendChild(div);

});

actualizarProgreso();

}

function selectOption(i,j){

if(examenFinalizado) return;

answers[i] = j;

render();

}

function nextQuestion(){

if(current < questions.length-1){

current++;

render();

}

}

function prevQuestion(){

if(current > 0){

current--;

render();

}

}

function finishQuiz(){

if(examenFinalizado) return;

examenFinalizado = true;

let total = questions.length;

let correctas = 0;

let revisionHTML = "";

questions.forEach((q,i)=>{

const respuestaUsuario = answers[i];

if(respuestaUsuario === q.a){

correctas++;

revisionHTML += `
<div class="review-item correcta">

<h4>
Pregunta ${i+1}: ✅ Correcta
</h4>

<div class="explicacion">
${q.exp}
</div>

</div>
`;

}else if(respuestaUsuario === null){

revisionHTML += `
<div class="review-item sin-responder">

<h4>
Pregunta ${i+1}: ⚠️ Sin responder
</h4>

<div class="explicacion">
Respuesta correcta: ${q.o[q.a]}
</div>

</div>
`;

}else{

revisionHTML += `
<div class="review-item incorrecta">

<h4>
Pregunta ${i+1}: ❌ Incorrecta
</h4>

<div class="explicacion">

Correcta: ${q.o[q.a]}

<br><br>

${q.exp}

</div>

</div>
`;

}

});

const porcentaje =
((correctas/total)*100).toFixed(1);

document.getElementById("puntajeTexto")
.innerHTML = `

Obtuviste
<strong>${correctas}</strong>

de

<strong>${total}</strong>

correctas.<br>

Nota final:

<strong>${porcentaje}%</strong>

`;

document.getElementById("revision")
.innerHTML = revisionHTML;

document.getElementById("resultado")
.style.display = "block";

render();

}

function reiniciarExamen(){

location.reload();

}

render();

</script>

<script type="module" src="../party/party-timer.js"></script>
<script type="module" src="../party/party-resultados.js"></script>

</body>
</html>

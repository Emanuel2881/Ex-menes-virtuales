<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Verbal</title>
 
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#e7dfcf;
    color:#2b2b2b;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:#f8f4ec;
    border-radius:18px;
    padding:30px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.sub{
    text-align:center;
    color:#5d564d;
    margin-bottom:25px;
}

.inicio{
    text-align:center;
}

button{
    background:#8b6b3f;
    color:white;
    border:none;
    padding:14px 24px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    transition:0.2s;
}

button:hover{
    transform:scale(1.03);
}

.info{
    display:flex;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.card{
    flex:1;
    background:#ece3d3;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.progreso{
    width:100%;
    height:16px;
    background:#ddd3c0;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.barra{
    width:0%;
    height:100%;
    background:#8b6b3f;
    transition:0.3s;
}

.pregunta{
    background:#f1ebdf;
    border-radius:16px;
    padding:25px;
}

.tipo{
    color:#7a5a31;
    margin-bottom:10px;
    font-weight:bold;
}

.texto{
    font-size:24px;
    margin-bottom:25px;
    line-height:1.5;
}

.opcion{
    background:#ece3d3;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
    cursor:pointer;
    transition:0.2s;
}

.opcion:hover{
    background:#ddd1bc;
}

.correcta{
    background:#9bc59f !important;
}

.incorrecta{
    background:#d8aaaa !important;
}

.botones{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:20px;
}

.estadistica{
    background:#ece3d3;
    padding:18px;
    border-radius:12px;
    margin-bottom:15px;
}

.resultados{
    text-align:center;
}

.oculto{
    display:none;
}

@media(max-width:700px){

    .texto{
        font-size:20px;
    }

    .info{
        flex-direction:column;
    }

    .botones{
        flex-direction:column;
    }
}
</style>
</head>
<body>

<div class="container">

<div id="pantallaInicio" class="inicio">
    <h1>Simulador de Habilidad Verbal</h1>
    <p class="sub">50 preguntas • 20 minutos</p>

    <div class="estadistica">
        <p>Analogías continuas, alternas e incompletas</p>
    </div>

    <button id="startBtn">Iniciar examen</button>
</div>

<div id="pantallaExamen" class="oculto">

    <div class="info">

        <div class="card">
            <h3>Tiempo</h3>
            <p id="timer">20:00</p>
        </div>

        <div class="card">
            <h3>Pregunta</h3>
            <p id="contadorPregunta">1 / 50</p>
        </div>

        <div class="card">
            <h3>Puntaje</h3>
            <p id="puntaje">0</p>
        </div>

    </div>

    <div class="progreso">
        <div class="barra" id="barra"></div>
    </div>

    <div class="pregunta">

        <p class="tipo" id="tipoPregunta"></p>

        <div class="texto" id="textoPregunta"></div>

        <div id="opciones"></div>

    </div>

    <div class="botones">
        <button id="anteriorBtn">Anterior</button>
        <button id="siguienteBtn">Siguiente</button>
    </div>

</div>

<div id="pantallaResultados" class="resultados oculto">

    <h2>Resultados</h2>

    <div class="estadistica">
        <h3>Nota final</h3>
        <p id="notaFinal"></p>
    </div>

    <div class="estadistica">
        <h3>Correctas</h3>
        <p id="correctas"></p>
    </div>

    

    

    <button onclick="location.reload()">Intentar otra vez</button>

</div>

</div>

let indice = 0;
let puntaje = 0;
let tiempo = 20 * 60;
let respuestas = Array(preguntas.length).fill(null);

const textoPregunta = document.getElementById("textoPregunta");
const opcionesDiv = document.getElementById("opciones");
const contadorPregunta = document.getElementById("contadorPregunta");
const puntajeTexto = document.getElementById("puntaje");
const tipoPregunta = document.getElementById("tipoPregunta");
const barra = document.getElementById("barra");

function iniciarExamen(){

    document.getElementById("pantallaInicio").classList.add("oculto");
    document.getElementById("pantallaExamen").classList.remove("oculto");

    mostrarPregunta();
    iniciarTimer();
}

function iniciarTimer(){

    const intervalo = setInterval(()=>{

        tiempo--;

        let minutos = Math.floor(tiempo / 60);
        let segundos = tiempo % 60;

        if(segundos < 10){
            segundos = "0" + segundos;
        }

        document.getElementById("timer").textContent = `${minutos}:${segundos}`;

        if(tiempo <= 0){
            clearInterval(intervalo);
            finalizarExamen();
        }

    },1000);
}

function mostrarPregunta(){

    const actual = preguntas[indice];

    contadorPregunta.textContent = `${indice + 1} / ${preguntas.length}`;

    tipoPregunta.textContent = `Tipo: ${actual.tipo}`;

    textoPregunta.textContent = actual.pregunta;

    barra.style.width = `${((indice + 1) / preguntas.length) * 100}%`;

    opcionesDiv.innerHTML = "";

    actual.opciones.forEach((opcion,i)=>{

        const div = document.createElement("div");

        div.classList.add("opcion");

        div.textContent = opcion;

        if(respuestas[indice] !== null){

            if(i === actual.correcta){
                div.classList.add("correcta");
            }

            if(i === respuestas[indice] && i !== actual.correcta){
                div.classList.add("incorrecta");
            }
        }

        div.addEventListener("click",()=> responder(i));

        opcionesDiv.appendChild(div);

    });
}

function responder(i){

    if(respuestas[indice] !== null) return;

    respuestas[indice] = i;

    if(i === preguntas[indice].correcta){
        puntaje++;
    }

    puntajeTexto.textContent = puntaje;

    mostrarPregunta();
}

function siguiente(){

    if(indice < preguntas.length - 1){
        indice++;
        mostrarPregunta();
    }else{
        finalizarExamen();
    }
}

function anterior(){

    if(indice > 0){
        indice--;
        mostrarPregunta();
    }
}

function finalizarExamen(){

    document.getElementById("pantallaExamen").classList.add("oculto");
    document.getElementById("pantallaResultados").classList.remove("oculto");

    const nota = Math.round((puntaje / preguntas.length) * 100);

    localStorage.setItem("verbal", nota);

    document.getElementById("notaFinal").textContent = `${nota} / 100`;
    document.getElementById("correctas").textContent = `${puntaje} de ${preguntas.length}`;
     setTimeout(()=>{

        window.location.href = "Numerica.html";

    },3000);
}

function random(min,max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
}


document.getElementById("startBtn").addEventListener("click", iniciarExamen);
document.getElementById("siguienteBtn").addEventListener("click", siguiente);
document.getElementById("anteriorBtn").addEventListener("click", anterior);

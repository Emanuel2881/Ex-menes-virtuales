<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados Finales</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#e7dfcf;
    color:#2b2b2b;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:950px;
    background:#f8f4ec;
    border-radius:20px;
    padding:30px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitulo{
    text-align:center;
    color:#5d564d;
    margin-bottom:30px;
}

.resumen{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:30px;
}

.card{
    background:#ece3d3;
    padding:20px;
    border-radius:14px;
    text-align:center;
}

.card h3{
    margin-bottom:10px;
    font-size:18px;
}

.card p{
    font-size:28px;
    font-weight:bold;
}

.titulo-seccion{
    margin-bottom:15px;
    margin-top:25px;
}

.ranking{
    background:#f1ebdf;
    border-radius:14px;
    padding:20px;
}

.fila{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-bottom:1px solid #d5cab7;
}

.fila:last-child{
    border-bottom:none;
}

.usuario{
    background:#d8c5a1;
    font-weight:bold;
    border-radius:10px;
}

.nivel-box{
    background:#ece3d3;
    padding:20px;
    border-radius:14px;
    text-align:center;
    margin-top:25px;
}

.nivel-box h2{
    margin-bottom:10px;
}

#nivel{
    font-size:30px;
    font-weight:bold;
    color:#8b6b3f;
}

button{
    width:100%;
    margin-top:30px;
    background:#8b6b3f;
    color:white;
    border:none;
    padding:16px;
    border-radius:14px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    opacity:0.9;
}

@media(max-width:700px){

    .fila{
        font-size:14px;
    }

    .card p{
        font-size:22px;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>Resultados Finales</h1>
    <p class="subtitulo">Simulador de admisión universitaria</p>


    <div class="resumen">

        <div class="card">
            <h3>Verbal</h3>
            <p id="verbal">0</p>
        </div>

        <div class="card">
            <h3>Numérica</h3>
            <p id="numerica">0</p>
        </div>

        <div class="card">
            <h3>Promedio</h3>
            <p id="promedio">0</p>
        </div>

        <div class="card">
            <h3>Percentil</h3>
            <p id="percentil">0%</p>
        </div>

    </div>


    <div class="nivel-box">
        <h2>Nivel obtenido</h2>
        <p id="nivel">Promedio</p>
    </div>


    <h2 class="titulo-seccion">Ranking General</h2>

    <div class="ranking" id="ranking">

    </div>


    <button id="reiniciarBtn">
        Volver a empezar
    </button>

</div>

<script type="module" src="resultados.js"></script>
</body>
</htm

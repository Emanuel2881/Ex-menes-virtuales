<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habilidad Verbal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #fff1f2, #ffe4e6, #fecdd3);
      color: #7f1d1d;
      min-height: 100vh;
      padding: 30px 15px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: #9f1239;
      margin-bottom: 8px;
    }

    .header p {
      color: #881337;
      opacity: 0.9;
    }

    /* Interruptor / Switch de Modo Secuencia */
    .secuencia-card {
      background: #fff;
      border: 2px solid #fecdd3;
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .secuencia-info h3 {
      font-size: 1.05rem;
      color: #9f1239;
      margin-bottom: 4px;
    }

    .secuencia-info p {
      font-size: 0.88rem;
      color: #be123c;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #e11d48;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Lista de exámenes */
    .list-title {
      font-size: 1.2rem;
      color: #881337;
      margin-bottom: 15px;
    }

    .exam-grid {
      display: grid;
      gap: 14px;
    }

    .exam-card {
      background: #fff;
      border: 1px solid #fecdd3;
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: #7f1d1d;
      transition: all 0.2s ease;
    }

    .exam-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(225, 29, 72, 0.12);
      border-color: #fb7185;
    }

    .exam-info h4 {
      font-size: 1.1rem;
      color: #9f1239;
      margin-bottom: 4px;
    }

    .exam-info p {
      font-size: 0.85rem;
      color: #be123c;
    }

    .btn-start {
      background: #ffe4e6;
      color: #9f1239;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .top-link {
      display: inline-block;
      margin-bottom: 15px;
      color: #be123c;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">

  <a class="top-link" href="../index.html">← Volver al Inicio</a>

  <div class="header">
    <h1>📖 Módulo Verbal</h1>
    <p>Selecciona una prueba o activa el modo examen continuo</p>
  </div>

  <!-- Switch Control de Modo Secuencia -->
  <div class="secuencia-card">
    <div class="secuencia-info">
      <h3>Modo Examen Completo (Secuencia)</h3>
      <p>Al terminar Verbal, avanzarás automáticamente al examen de Matemáticas.</p>
    </div>
    <label class="switch">
      <input type="checkbox" id="chkSecuencia" onchange="toggleModoSecuencia(this.checked)">
      <span class="slider"></span>
    </label>
  </div>

  <h3 class="list-title">Exámenes Disponibles</h3>

  <div class="exam-grid">
    <a href="data/verbal-examen1.html" class="exam-card">
      <div class="exam-info">
        <h4>Examen Verbal 1</h4>
        <p>15 Preguntas • Analogías y relaciones verbales</p>
      </div>
      <span class="btn-start">Comenzar →</span>
    </a>
  </div>

</div>

<!-- SCRIPT MÓDULO: Carga la lógica de secuencia y la expone globalmente -->
<script type="module">
  import { toggleModoSecuencia, esModoSecuencia } from './secuenciaExamenes.js';

  // Exponer a window para evitar "ReferenceError" en eventos HTML inline (onchange)
  window.toggleModoSecuencia = toggleModoSecuencia;
  window.esModoSecuencia = esModoSecuencia;

  // Sincronizar el estado del checkbox al cargar la página
  document.addEventListener('DOMContentLoaded', () => {
    const chk = document.getElementById('chkSecuencia');
    if (chk) {
      chk.checked = esModoSecuencia();
    }
  });
</script>

</body>
</html>
